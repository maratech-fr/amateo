<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!--
    Page 503 « service indisponible » — servie par CADDY, hors de l'application,
    quand la stack Docker est morte (docs/ops/Caddyfile.example, bloc handle_errors).

    Contraintes DURES (règle .claude/rules/system-pages.md) :
      · ZÉRO build, fichier autonome, servi tel quel depuis le disque de la VM ;
      · CSS INLINE · police system-ui SEULE · SVG inline · < 100 Ko ;
      · le SEUL chargement réseau est /config.js (même origine, servi du disque) ;
      · AUCUN littéral de marque dans ce HTML — la marque n'apparaît QUE via config.js
        (logotype + <title>), injectée par le script inline `if (window.LANDING_CONFIG)`.
        Sans lui : titre neutre, logotype masqué, page ENTIÈREMENT fonctionnelle.
  -->
  <title>Service momentanément indisponible</title>
  <style>
    /* ── Palette DUPLIQUÉE de la landing (landing.md : dupliquer est VOULU, jamais
         une dépendance). Thème via prefers-color-scheme en CSS pur. ── */
    :root {
      --paper: #faf9f7;
      --surface: #ffffff;
      --ink: #191714;
      --ink-2: #57534c;
      --muted: #6d675d;
      --line: #e7e3dc;
      --accent: #c2571e;
      --accent-ink: #9c4210;    /* assez sombre pour porter du texte sur clair */
      --accent-deep: #7e340a;
      --accent-soft: #faf0e8;
      --radius: 14px;
      /* Bouton plein : ses propres tokens, pour que le couple fond/texte reste
         contrasté dans les DEUX thèmes (en clair : fond sombre + texte blanc). */
      --btn-bg: #9c4210;
      --btn-bg-hover: #7e340a;
      --btn-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14120e;
        --surface: #1e1b16;
        --ink: #f7f4ee;
        --ink-2: #cfc8bb;
        --muted: #a79f90;       /* ≥ 4.5:1 sur --paper */
        --line: #332e27;
        --accent: #e79457;
        --accent-ink: #f0a869;  /* accent LISIBLE : clair sur fond sombre (.mark) */
        --accent-deep: #d97d3c;
        --accent-soft: #2a2118;
        /* En sombre le bouton s'inverse : fond accent CLAIR + texte sombre. */
        --btn-bg: #e79457;
        --btn-bg-hover: #f0a869;
        --btn-fg: #17140f;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;   /* dvh : centrage juste sur mobile */
      display: flex; align-items: center; justify-content: center;
      background: var(--paper); color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 32px 24px;
    }
    main {
      max-width: 560px; width: 100%; text-align: center;
    }
    .logotype {
      font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
      color: var(--ink); margin-bottom: 40px;
      /* Masqué tant que config.js n'a pas donné la marque — jamais un littéral ici. */
      display: none;
    }
    .logotype .dot { color: var(--accent); }
    h1 {
      font-size: clamp(26px, 5vw, 36px); line-height: 1.12; letter-spacing: -0.02em;
      font-weight: 800; text-wrap: balance; margin-bottom: 16px;
    }
    p.lede {
      font-size: 17px; color: var(--ink-2); max-width: 46ch;
      margin: 0 auto; text-wrap: pretty;
    }
    .ctas {
      margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .btn {
      display: inline-block; padding: 12px 22px; border-radius: 10px;
      font-weight: 650; font-size: 15.5px; text-decoration: none; text-align: center;
      border: 1.5px solid transparent; cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      /* Scène : on COUPE l'animation, rien d'autre. Cartes à opacité de base 1 +
         flottaison en TRANSFORM pur → `animation:none` les laisse posées, visibles,
         immobiles. AUCUN override d'opacité ici (transposé d'un écran d'attente à un
         écran de panne, il peindrait un faux état « plein/succès »). Racine identique
         à PR-1 (frontend/src/shared/components/ui/system-scene.css). */
      .ss-anim { animation: none !important; }
    }
    .btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
    .btn-primary:hover { background: var(--btn-bg-hover); }
    .btn-ghost { border-color: var(--line); color: var(--ink); background: var(--surface); }
    .btn-ghost:hover { border-color: var(--muted); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    /* Le lien support reste MASQUÉ tant que config.js n'a pas fourni contactEmail :
       jamais une adresse en dur, jamais un mailto vide. */
    [data-cta="support"] { display: none; }
    /* ── Scène système décorative (P5-22 PR-2). Voisine de l'in-app, JAMAIS
         synchronisée — voir le commentaire au-dessus du SVG. Couleurs = tokens de la
         palette dupliquée ci-dessus (surface/line/muted/accent). ── */
    .scene { width: 100%; max-width: 360px; margin: 0 auto 30px; }
    .scene svg { display: block; width: 100%; height: auto; }
    /* Flottaison des cartes : amplitude faible (~6 %), TRANSFORM pur. Base
       translateY(0)/scaleY(1) = pose figée (l'état exact du reduced-motion). */
    @keyframes ss-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes ss-squash { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02); } }
    /* L'ombre au sol se rétrécit et pâlit quand la carte s'élève. Opacité de repos
       0.16 portée par l'attribut SVG → `animation:none` la laisse posée. */
    @keyframes ss-shadow { 0%, 100% { transform: scaleX(1); opacity: 0.16; } 50% { transform: scaleX(0.82); opacity: 0.09; } }
  </style>
</head>
<body>
  <main>
    <a class="logotype" data-brand-logotype href="/"><span data-brand></span><span class="dot">.</span></a>

    <!-- SCÈNE système (P5-22 PR-2). MÊME DESSIN que la scène in-app
         (frontend/src/shared/components/ui/system-scene.tsx) et que sa VOISINE
         system-pages/maintenance.html — mais VOISINES, JAMAIS SYNCHRONISÉES : aucune source
         partagée, aucun test de parité (règle system-pages.md : la ressemblance est une
         CONVENTION, la palette DUPLIQUÉE, jamais une dépendance ; un script d'inlinage
         serait une chaîne de build, un test de parité fabriquerait une fausse synchro).
         Demi-terrain vu de dessus, cartes d'équipes flottant en apesanteur, ombres au sol.
         Décorative → aria-hidden (le sens vit dans le titre). Animation = TRANSFORM pur +
         opacité de base PLEINE : sous prefers-reduced-motion, `animation:none` suffit à
         laisser les cartes posées, AUCUN override d'opacité (cf. system-scene.css de PR-1). -->
    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 320 158" preserveAspectRatio="xMidYMid meet">
        <!-- Demi-terrain en filigrane : ligne de fond, raquette + cercle, arc à 3 pts, rond central. -->
        <g fill="none" stroke="var(--muted)" stroke-width="2" opacity="0.28">
          <rect x="8" y="8" width="304" height="142" rx="8" />
          <rect x="128" y="104" width="64" height="46" />
          <circle cx="160" cy="104" r="20" />
          <path d="M60 150V120a100 100 0 0 1 200 0v30" />
          <path d="M136 8a24 24 0 0 1 48 0" />
        </g>
        <!-- Ombres au sol (sous les cartes) — durées/délais non harmoniques pour éviter tout « pouls » collectif. -->
        <ellipse class="ss-anim" cx="67" cy="120" rx="30" ry="5" fill="#000" opacity="0.16" style="transform-box:fill-box;transform-origin:center;animation:ss-shadow 5.2s ease-in-out infinite" />
        <ellipse class="ss-anim" cx="159" cy="112" rx="30" ry="5" fill="#000" opacity="0.16" style="transform-box:fill-box;transform-origin:center;animation:ss-shadow 4.4s ease-in-out 0.5s infinite" />
        <ellipse class="ss-anim" cx="247" cy="124" rx="28" ry="5" fill="#000" opacity="0.16" style="transform-box:fill-box;transform-origin:center;animation:ss-shadow 5.8s ease-in-out 0.9s infinite" />
        <!-- Carte GAUCHE — « créneau libre · à replacer » : contour pointillé STATIQUE, accent en filigrane. -->
        <g class="ss-anim" style="animation:ss-float 5.2s ease-in-out infinite">
          <g class="ss-anim" style="transform-box:fill-box;transform-origin:bottom center;animation:ss-squash 5.2s ease-in-out infinite">
            <rect x="34" y="70" width="66" height="40" rx="8" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.85" />
            <rect x="42" y="78" width="12" height="12" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 2.5" />
            <rect x="60" y="80" width="30" height="5" rx="2.5" fill="var(--muted)" opacity="0.4" />
            <rect x="60" y="90" width="20" height="4" rx="2" fill="var(--muted)" opacity="0.28" />
          </g>
        </g>
        <!-- Carte CENTRE — carte d'équipe posée : pastille d'accent tempérée (0.6) + squelette de contenu. -->
        <g class="ss-anim" style="animation:ss-float 4.4s ease-in-out 0.5s infinite">
          <g class="ss-anim" style="transform-box:fill-box;transform-origin:bottom center;animation:ss-squash 4.4s ease-in-out 0.5s infinite">
            <rect x="126" y="58" width="66" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
            <rect x="134" y="66" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.6" />
            <rect x="152" y="68" width="30" height="5" rx="2.5" fill="var(--muted)" opacity="0.8" />
            <rect x="152" y="78" width="20" height="4" rx="2" fill="var(--muted)" opacity="0.45" />
            <rect x="134" y="86" width="48" height="5" rx="2.5" fill="var(--line)" />
          </g>
        </g>
        <!-- Carte DROITE — seconde carte posée, désynchronisée. -->
        <g class="ss-anim" style="animation:ss-float 5.8s ease-in-out 0.9s infinite">
          <g class="ss-anim" style="transform-box:fill-box;transform-origin:bottom center;animation:ss-squash 5.8s ease-in-out 0.9s infinite">
            <rect x="214" y="76" width="66" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5" />
            <rect x="222" y="84" width="12" height="12" rx="3" fill="var(--accent)" opacity="0.5" />
            <rect x="240" y="86" width="30" height="5" rx="2.5" fill="var(--muted)" opacity="0.8" />
            <rect x="240" y="96" width="20" height="4" rx="2" fill="var(--muted)" opacity="0.45" />
            <rect x="222" y="104" width="48" height="5" rx="2.5" fill="var(--line)" />
          </g>
        </g>
      </svg>
    </div>

    <h1>Le gymnase est fermé, on cherche les clés.</h1>
    <p class="lede">
      Le service est momentanément indisponible. Personne n'a perdu de données&nbsp;:
      vos équipes, vos gymnases et vos créneaux dorment tranquillement. Réessayez dans un instant.
    </p>

    <div class="ctas">
      <!-- Repli SANS JS : l'ancre pointe la racine, qui refait la tentative.
           Avec JS on recharge la page courante à la place. -->
      <a class="btn btn-primary" href="/" data-cta="retry">Réessayer maintenant</a>
      <a class="btn btn-ghost" href="#" data-cta="support">Prévenir le support</a>
    </div>
  </main>

  <!-- Même origine, même disque : Caddy sert /config.js depuis landing/config.js.
       Sur une app VIVANTE cette requête part au proxy comme aujourd'hui, sans
       conséquence — cette page d'erreur n'est alors JAMAIS affichée. Ne pas
       « corriger » ce src en le retirant : c'est la seule source de la marque. -->
  <script src="/config.js"></script>
  <script>
    (function () {
      if (!window.LANDING_CONFIG) return; // repli SANS marque, page fonctionnelle.
      var c = window.LANDING_CONFIG;
      if (c.brand) {
        document.title = c.brand + " — " + document.title;
        var slots = document.querySelectorAll("[data-brand]");
        for (var i = 0; i < slots.length; i++) slots[i].textContent = c.brand;
        var logo = document.querySelector("[data-brand-logotype]");
        if (logo) logo.style.display = "inline-block";
      }
      if (c.contactEmail) {
        var mail = document.querySelector('[data-cta="support"]');
        if (mail) {
          mail.href = "mailto:" + c.contactEmail
            + "?subject=" + encodeURIComponent("Service indisponible");
          mail.style.display = "inline-block";
        }
      }
    })();
    // Réessai réel avec JS : recharge la page d'origine plutôt que la racine.
    (function () {
      var retry = document.querySelector('[data-cta="retry"]');
      if (retry) retry.addEventListener("click", function (e) {
        e.preventDefault();
        location.reload();
      });
    })();
  </script>
</body>
</html>
