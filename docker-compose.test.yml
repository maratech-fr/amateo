    ports: !reset []
  postgres:
    restart: "no"
    ports: !reset []
  redis:
    restart: "no"
    ports: !reset []
  messenger-worker:
    restart: "no"
  cron-runner:
    restart: "no"
  engine:
    restart: "no"
    ports: !reset []
  pdf-worker:
    restart: "no"
  mercure:
    restart: "no"
    ports: !reset []
  mailpit:
    restart: "no"
    ports: !reset []
