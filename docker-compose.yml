services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: amateo-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      nginx:
        condition: service_healthy
      mercure:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amateo_network

  # Node/npm tooling stays inside Docker. This service is run on demand by the
  # frontend Makefile and never starts as part of the application stack.
  frontend-tooling:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: tooling
    working_dir: /app/frontend
    environment:
      HUSKY: "0"
    networks:
      - amateo_network

  # P4-33 — e2e Playwright DOCKERISÉ : l'hôte n'a plus besoin de Node (dernier
  # maillon qui l'exigeait). Image officielle, navigateurs préinstallés.
  # ⚠ Le tag DOIT suivre la version de @playwright/test du package-lock
  # (aujourd'hui 1.62.0) : une dérive = « browser not found » au premier run.
  # node_modules dans un volume DÉDIÉ (pas celui de frontend-dev : autre image,
  # binaires natifs potentiellement incompatibles).
  e2e:
    profiles: ["tools"]
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /app/frontend
    # UID hôte (patron php-fpm) : en root, les artefacts test-results/ devenaient
    # intouchables depuis l'hôte. HOME inscriptible requis par Chromium.
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - ./frontend:/app/frontend:cached
      - e2e_node_modules:/app/frontend/node_modules
    environment:
      HUSKY: "0"
      HOME: /tmp
      # Cibles INTERNES au réseau compose : le Vite dev (code vivant) et Mailpit.
      E2E_BASE_URL: http://frontend-dev:5173
      MAILPIT_WEB_URL: http://mailpit:8025
    networks:
      - amateo_network

  # Vite development server. Source code is bind-mounted for hot reload, while
  # dependencies remain in a Docker-managed volume rather than on the host.
  frontend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: tooling
    working_dir: /app/frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app/frontend:cached
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      HUSKY: "0"
      API_PROXY_TARGET: http://nginx
      MERCURE_PROXY_TARGET: http://mercure
    command: >-
      sh -lc 'npm ci --legacy-peer-deps && exec npm run dev -- --host 0.0.0.0'
    depends_on:
      nginx:
        condition: service_healthy
      mercure:
        condition: service_healthy
    networks:
      - amateo_network

  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${USER_ID:-1000}
        GID: ${GROUP_ID:-1000}
    container_name: amateo-php-fpm
    working_dir: /app/backend
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - ./:/app:cached
    env_file:
      - ./.env
    environment:
      # Browser-facing hub URL must match the actually published port
      # (${MERCURE_PORT}); overrides the static value in backend/.env so the two
      # can never drift.
      MERCURE_PUBLIC_URL: "http://localhost:${MERCURE_PORT}/.well-known/mercure"
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amateo_network

  nginx:
    image: nginx:1.27-alpine
    container_name: amateo-nginx
    depends_on:
      php-fpm:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - ./:/app:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - amateo_network

  postgres:
    image: postgres:16-alpine
    container_name: amateo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Historical dev passwords for the 02-users.sh init script (fail-closed:
      # it aborts when unset). Prod supplies real values via .env.prod.
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - amateo_network

  redis:
    image: redis:7-alpine
    container_name: amateo-redis
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - amateo_network

  messenger-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${USER_ID:-1000}
        GID: ${GROUP_ID:-1000}
    container_name: amateo-messenger-worker
    working_dir: /app/backend
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - ./:/app:cached
    env_file:
      - ./.env
    command: >-
      sh -lc 'if [ -f bin/console ]; then
        exec php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --no-interaction;
      else
        exec sleep infinity;
      fi'
    depends_on:
      php-fpm:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$cmd = @file_get_contents(\"/proc/1/cmdline\"); exit((strpos($$cmd, \"messenger:consume\") === false && strpos($$cmd, \"sleep\") === false) ? 1 : 0);'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amateo_network

  # Minute scheduler tick. app:jobs:run-due resolves due slots in Europe/Paris;
  # the allowlisted app:jobs:run wrapper prevents overlap and persists outcomes.
  # Missed slots are caught up once after restart; one failure never stops the next job.
  cron-runner:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${USER_ID:-1000}
        GID: ${GROUP_ID:-1000}
    container_name: amateo-cron-runner
    working_dir: /app/backend
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - ./:/app:cached
    env_file:
      - ./.env
    command: >-
      sh -lc 'while true; do
        if [ -f bin/console ]; then
          php bin/console app:jobs:run-due --no-interaction || true;
        fi;
        sleep 60;
      done'
    depends_on:
      php-fpm:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Same PID-1 pattern as messenger-worker (no pgrep in the php image; a
      # process-list grep would also self-match). PID 1 is the sh loop whose
      # command line carries "sleep 60".
      test: ["CMD-SHELL", "php -r '$$cmd = @file_get_contents(\"/proc/1/cmdline\"); exit(strpos($$cmd, \"sleep 60\") === false ? 1 : 0);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - amateo_network

  engine:
    build:
      context: .
      dockerfile: docker/engine/Dockerfile
    container_name: amateo-engine
    working_dir: /app/engine
    volumes:
      - ./:/app:cached
    env_file:
      - ./engine/.env
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${ENGINE_PORT}:8000"
    command: >-
      sh -lc 'if [ -f app/main.py ]; then exec uvicorn app.main:app --host 0.0.0.0 --port 8000; else exec python -m http.server 8000 --bind 0.0.0.0; fi'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amateo_network

  pdf-worker:
    build:
      context: .
      dockerfile: docker/pdf-worker/Dockerfile
    container_name: amateo-pdf-worker
    working_dir: /app/frontend
    # Host uid, like the PHP containers: the worker creates backend/public/exports
    # on the bind mount itself (PdfGenerator.php does NOT pre-create it), which the
    # image's pptruser (10042) may not do inside a host-owned directory.
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    volumes:
      - ./:/app:cached
      - pdf_worker_node_modules:/app/frontend/node_modules
    environment:
      NODE_ENV: development
      # Chrome (crashpad, profile) needs a writable $HOME, which the host uid does
      # not have in /home/pptruser — while the browser binary stays in the image's
      # cache, which puppeteer resolves through PUPPETEER_CACHE_DIR before $HOME.
      HOME: /tmp
      PUPPETEER_CACHE_DIR: /home/pptruser/.cache/puppeteer
    command: [ "node", "worker.js" ]
    healthcheck:
      test: [ "CMD-SHELL", "pgrep -fa 'node worker.js' >/dev/null" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amateo_network

  mercure:
    image: dunglas/mercure:latest
    container_name: amateo-mercure
    environment:
      SERVER_NAME: ":80"
      # SEC-05/06: dedicated Mercure secret (no longer the lexik JWT passphrase);
      # no anonymous subscribers, CORS limited to the dev frontends, publish
      # restricted to same-origin (the backend publishes server-side).
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:5173 http://localhost:8081
    ports:
      - "127.0.0.1:${MERCURE_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - amateo_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: amateo-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - amateo_network

networks:
  amateo_network:
    name: amateo_network

volumes:
  postgres_data:
  pdf_worker_node_modules:
  frontend_node_modules:
  e2e_node_modules:
