server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    # Match the backend nginx (docker/nginx/default.conf) — the nginx default of
    # 1m would 413 wizard .xlsx imports at this edge (same fix as prod conf).
    client_max_body_size 20m;
    # Baseline headers at server level so EVERY response carries them — including
    # nginx-generated errors (502/504 when the /api upstream is down, 413/400)
    # that never reach the backend. The CSP is added ONLY in the HTML locations
    # (csp.conf), never here, so the /api and /exports proxies don't get
    # a strict default-src onto backend responses. Locations that set their
    # own add_header (content, /health) re-include the base (nginx doesn't inherit
    # server-level add_header into a location that has its own).
    include /etc/nginx/snippets/security-headers.conf;

    location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "healthy\n";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /.well-known/mercure {
        set $mercure_upstream http://mercure:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $mercure_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SEC-14 : pas de forward d'Upgrade — Mercure est du SSE pur (HTTP long
        # stream), et forcer « Connection: upgrade » ouvrait le motif h2c smuggling.
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
    }

    location /api/ {
        set $api_upstream http://nginx:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $api_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 120 s : le placement des matchs (POST /api/fixtures/place) tient jusqu'à
        # ~90 s côté contrôleur (moteur 60 s + import) — la chaîne de timeouts P4-240
        # (proxy front → nginx fastcgi → PHP) doit dépasser ce plafond, sinon le
        # proxy coupe une requête que le backend est en train d'honorer.
        proxy_read_timeout 120s;
    }

    # Backend bundle assets (/api/docs swagger UI). ^~ so the static-extension
    # regex above doesn't catch /bundles/*.css|png and 404 against the SPA root.
    location ^~ /bundles/ {
        set $bundles_upstream http://nginx:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $bundles_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exported PDF/PNG files served from the backend's public/exports.
    location ^~ /exports/ {
        set $exports_upstream http://nginx:80;
        # SEC-14 : proxy PUBLIC par design (pas un endpoint X-Accel interne).
        proxy_pass $exports_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PAS de `location /engine/` — frontière §2 de `CLAUDE.md` :
    # le frontend NE contacte JAMAIS l'engine directement, la génération passe par
    # `POST /api/schedules/{id}/generate` et c'est le backend qui appelle l'engine.
    # Ce proxy a existé comme outil de debug ; il exposait le solveur SANS AUTHENTIFICATION
    # à quiconque atteignait le port 8081 — y compris à travers un tunnel de démo
    # (docs/technique/demo-tunnel-cloudflare.md). Pour parler à l'engine en local :
    # `docker compose exec engine …`, ou publier son port ponctuellement.

    location / {
        # SPA shell: always revalidate so a redeploy's new asset hashes are picked
        # up (the exact `= /index.html` block above doesn't cover the try_files fallback).
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/csp.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
