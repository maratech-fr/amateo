# Baseline security headers, safe on EVERY response (HTML, JSON proxy, SSE, text).
# `include`d wherever nginx would otherwise drop them — the SPA content locations
# (which also add the CSP, see csp.conf) AND the proxy/util locations that set
# their own add_header or proxy to an upstream that sets none (/health, mercure).
# (/engine ne figure plus dans cette liste : le proxy n'existe nulle part — DOC-32.) nginx does NOT inherit server-level add_header into a location that
# has any add_header of its own, so these must be re-included per location.
#
# Referrer-Policy stays "same-origin" (no Referer leaves the origin at all) and
# HSTS omits includeSubDomains (TLS is terminated upstream; pinning sibling
# subdomains to HTTPS for a year is a deployment footgun).
#
# X-Robots-Tag: the WHOLE app subdomain stays out of search indexes — the SPA,
# the in-app privacy page (founder decision: reachable by its link, never
# findable), AND the token pages (club-approval, coach doléances). Those token
# URLs are the reason this lives HERE and NOT in robots.txt: robots.txt is
# PUBLIC, so listing a token path there would ANNOUNCE its existence. robots.txt
# only stops crawling; this response header is what stops the INDEXING of a URL
# discovered elsewhere (a forwarded mail link). One line on the shared baseline
# covers every response — SPA HTML, /api & /exports proxies, nginx-generated
# errors — with no path ever named. (Landing is a different host, served by
# Caddy, and is deliberately NOT covered: it must be indexed.)
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Robots-Tag "noindex, nofollow" always;
