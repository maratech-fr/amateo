upstream php_fpm {
    server php-fpm:9000;
}

server {
    listen 80;
    server_name _;
    root /app/backend/public;
    index index.php;
    client_max_body_size 20m;

    # NOTE: security response headers for /api & /exports are added by the PUBLIC
    # edge — the frontend nginx server-level include (docker/frontend). This
    # backend server sits behind that proxy and deliberately sets none, so a
    # proxied response never carries a DUPLICATE X-Frame-Options (which some
    # browsers then ignore). Single source of truth: docker/frontend/security-headers.conf.

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    location /.well-known/mercure {
        proxy_pass http://mercure/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
    }

    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass php_fpm;
        # 120 s : le placement des matchs (POST /api/fixtures/place) laisse au moteur
        # un budget de 60 s + marge réseau/import (chaîne de timeouts P4-240).
        fastcgi_read_timeout 120s;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }
}
