:root {
  --bg: #08070a; --fg: #f4f2ee; --muted: rgba(244,242,238,.52); --glass: rgba(24,21,28,.62);
  --line: rgba(255,255,255,.1); --seg: rgba(255,255,255,.09); --seg-on: rgba(255,255,255,.2);
  --fill: #46AFAC; --btn: rgba(255,255,255,.06); --btn-hover: rgba(255,255,255,.12);
}
:root[data-theme="paper"] {
  --bg: #faf9f7; --fg: #464646; --muted: rgba(70,70,70,.58); --glass: rgba(253,252,250,.78);
  --line: rgba(70,70,70,.13); --seg: rgba(70,70,70,.08); --seg-on: rgba(70,70,70,.16);
  --fill: #46AFAC; --btn: rgba(70,70,70,.05); --btn-hover: rgba(70,70,70,.1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

<body>
<canvas id="stage" role="img" aria-label="Animation du logo amateo, version Créneaux : intro, boucle d'attente, sortie"></canvas>
<div class="ui" id="ui">
  <div class="top">
    <span><b>amateo</b> · motion 02 — Créneaux · <span id="phase">Intro</span></span>
    <span class="keys">Espace lecture · S sortie · L attente infinie · V ralenti · ←/→ image · R rejouer</span>
  </div>

    <button id="bSlow" type="button" aria-pressed="false">¼ ×</button>

</div>
<script>
/* ==========================================================================
   Amateo · motion — noyau commun
   Math (easings, ressorts), géométrie du logo (spec du graphiste), glyphes
   Poppins 500 vectorisés, et le lecteur 3 temps : INTRO → BOUCLE → SORTIE.
   Tout est une fonction PURE du temps : render(phase, t) ne garde aucun état,
   d'où le scrub, le pas-à-pas, le ralenti et l'export image par image exacts.
   ========================================================================== */
'use strict';

/* ---------- math ---------- */
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b, ease) => {
  const p = clamp((t - a) / (b - a));
  return ease ? ease(p) : p;
};
const smooth = (x) => x * x * (3 - 2 * x);
const lerpAngle = (a, b, t) => a + ((((b - a + Math.PI) % TAU) + TAU) % TAU - Math.PI) * t;

/* cubic-bezier CSS, résolu par Newton puis dichotomie */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (u) => ((ax * u + bx) * u + cx) * u;
  const sy = (u) => ((ay * u + by) * u + cy) * u;
  const dx = (u) => (3 * ax * u + 2 * bx) * u + cx;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 8; i++) {
      const e = sx(u) - x;
      if (Math.abs(e) < 1e-7) return sy(u);
      const d = dx(u);
      if (Math.abs(d) < 1e-6) break;
      u -= e / d;
    }
    let lo = 0, hi = 1;
    u = x;
    for (let i = 0; i < 40; i++) {
      const v = sx(u);
      if (Math.abs(v - x) < 1e-7) break;
      if (v < x) lo = u; else hi = u;
      u = (lo + hi) / 2;
    }
    return sy(u);
  };
}

const Ease = {
  inQuad: (x) => x * x,
  inCubic: (x) => x * x * x,
  outCubic: (x) => 1 - (1 - x) ** 3,
  inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2),
  outQuint: (x) => 1 - (1 - x) ** 5,
  inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: (s = 1.70158) => (x) => 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2,
  inBack: (s = 1.70158) => (x) => (s + 1) * x ** 3 - s * x * x,
  /* réponse indicielle d'un ressort sous-amorti, recalée pour finir EXACTEMENT à 1 */
  spring(zeta = 0.5, omega = 12) {
    const wd = omega * Math.sqrt(1 - zeta * zeta);
    const f = (x) => 1 - Math.exp(-zeta * omega * x) * (Math.cos(wd * x) + (zeta * omega / wd) * Math.sin(wd * x));
    const r = 1 - f(1);
    return (x) => f(x) + r * x * x * x;
  },
};
/* impulsion amortie (choc) : nulle avant τ=0, oscille, s'éteint */
const ring = (tau, freq = 3, decay = 6) => (tau <= 0 ? 0 : Math.exp(-decay * tau) * Math.sin(TAU * freq * tau));

/* PRNG déterministe : mêmes étincelles à chaque rendu */
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- marque (handoff graphiste — valeurs définitives) ---------- */
const BRAND = { magenta: '#B51C8A', orange: '#D47800', teal: '#46AFAC', ink: '#464646' };
const ARCS = [
  { key: 'magenta', color: BRAND.magenta, R: 313, w: 83, start: 98, len: 133 },
  { key: 'orange', color: BRAND.orange, R: 325, w: 66, start: 252, len: 69 },
  { key: 'teal', color: BRAND.teal, R: 332, w: 50, start: 334.5, len: 89 },
];
ARCS.forEach((a) => (a.mid = a.start + a.len / 2));
/* verrouillage horizontal du handoff (scène 1920×1080, position finale de « Signature ») */
const LOCKUP = { cx: 535, cy: 540, k: 0.35, wordX: 705, baseY: 597.5, fs: 0.21 };
const TEAL_EDGE_U = 332 + 25; /* bord extérieur du trait teal, en unités d'icône */

/* ---------- glyphes « amateo » (Poppins 500, mis en forme par HarfBuzz) ---------- */
const WORD = (() => {
  const g = {"upem":1000,"glyphs":[{"ch":"a","x":0,"bounds":[37,-9,603,560],"d":"M297 560Q362 560 410.5 534.5Q459 509 488 471V551H603V0H488V82Q459 43 409.0 17.0Q359 -9 295 -9Q224 -9 165.0 27.5Q106 64 71.5 129.5Q37 195 37 278Q37 361 71.5 425.0Q106 489 165.5 524.5Q225 560 297 560ZM321 461Q277 461 239.0 439.5Q201 418 177.5 376.5Q154 335 154 278Q154 221 177.5 178.0Q201 135 239.5 112.5Q278 90 321 90Q365 90 403.0 112.0Q441 134 464.5 176.5Q488 219 488 276Q488 333 464.5 375.0Q441 417 403.0 439.0Q365 461 321 461Z"},{"ch":"m","x":668.0,"bounds":[75,0,969,560],"d":"M969 325V0H856V308Q856 382 819.0 421.5Q782 461 718 461Q654 461 616.5 421.5Q579 382 579 308V0H466V308Q466 382 429.0 421.5Q392 461 328 461Q264 461 226.5 421.5Q189 382 189 308V0H75V551H189V488Q217 522 260.0 541.0Q303 560 352 560Q418 560 470.0 532.0Q522 504 550 451Q575 501 628.0 530.5Q681 560 742 560Q807 560 858.5 533.0Q910 506 939.5 453.0Q969 400 969 325Z"},{"ch":"a","x":1697.0,"bounds":[37,-9,603,560],"d":"M297 560Q362 560 410.5 534.5Q459 509 488 471V551H603V0H488V82Q459 43 409.0 17.0Q359 -9 295 -9Q224 -9 165.0 27.5Q106 64 71.5 129.5Q37 195 37 278Q37 361 71.5 425.0Q106 489 165.5 524.5Q225 560 297 560ZM321 461Q277 461 239.0 439.5Q201 418 177.5 376.5Q154 335 154 278Q154 221 177.5 178.0Q201 135 239.5 112.5Q278 90 321 90Q365 90 403.0 112.0Q441 134 464.5 176.5Q488 219 488 276Q488 333 464.5 375.0Q441 417 403.0 439.0Q365 461 321 461Z"},{"ch":"t","x":2365.0,"bounds":[28,0,342,688],"d":"M208 458V153Q208 122 222.5 108.5Q237 95 272 95H342V0H252Q175 0 134.0 36.0Q93 72 93 153V458H28V551H93V688H208V551H342V458Z"},{"ch":"e","x":2727.0,"bounds":[37,-9,580,560],"d":"M576 233H155Q160 167 204.0 127.0Q248 87 312 87Q404 87 442 164H565Q540 88 474.5 39.5Q409 -9 312 -9Q233 -9 170.5 26.5Q108 62 72.5 126.5Q37 191 37 276Q37 361 71.5 425.5Q106 490 168.5 525.0Q231 560 312 560Q390 560 451.0 526.0Q512 492 546.0 430.5Q580 369 580 289Q580 258 576 233ZM461 325Q460 388 416.0 426.0Q372 464 307 464Q248 464 206.0 426.5Q164 389 156 325Z"},{"ch":"o","x":3334.0,"bounds":[38,-9,600,560],"d":"M38 276Q38 360 75.0 425.0Q112 490 176.0 525.0Q240 560 319 560Q398 560 462.0 525.0Q526 490 563.0 425.0Q600 360 600 276Q600 192 562.0 127.0Q524 62 458.5 26.5Q393 -9 314 -9Q236 -9 173.0 26.5Q110 62 74.0 126.5Q38 191 38 276ZM483 276Q483 336 460.0 377.5Q437 419 399.0 440.0Q361 461 317 461Q273 461 235.5 440.0Q198 419 176.0 377.5Q154 336 154 276Q154 187 199.5 138.5Q245 90 314 90Q358 90 396.5 111.0Q435 132 459.0 174.0Q483 216 483 276Z"}]};
  return g.glyphs.map((gl, i) => ({
    ch: gl.ch,
    x: gl.x,
    bounds: gl.bounds,
    path: new Path2D(gl.d),
    teal: i >= 4,
  }));
})();
const WORD_RIGHT = LOCKUP.wordX + (WORD[5].x + WORD[5].bounds[2]) * LOCKUP.fs;

/* ---------- primitives de dessin ---------- */
function strokeArc(ctx, cx, cy, r, startDeg, lenDeg, width, color) {
  if (lenDeg < 0.5 || width < 0.05 || r < 0.05) return;
  ctx.beginPath();
  ctx.arc(cx, cy, r, startDeg * DEG, (startDeg + lenDeg) * DEG);
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.stroke();
}

/* capsule de longueur s (axe), largeur w, courbure kappa, milieu (mx,my), tangente phi.
   kappa = 0 → barre droite ; kappa = 1/R → arc de cercle. La longueur est conservée :
   c'est ce qui permet de « plier » un créneau de planning en arc du logo. */
function strokeBent(ctx, mx, my, phi, s, kappa, width, color) {
  if (width < 0.05) return;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  if (s < 0.05) {
    ctx.beginPath();
    ctx.arc(mx, my, width / 2, 0, TAU);
    ctx.fillStyle = color;
    ctx.fill();
    return;
  }
  ctx.beginPath();
  if (Math.abs(kappa * s) < 2e-3) {
    const hx = (Math.cos(phi) * s) / 2, hy = (Math.sin(phi) * s) / 2;
    ctx.moveTo(mx - hx, my - hy);
    ctx.lineTo(mx + hx, my + hy);
  } else {
    const r = 1 / Math.abs(kappa);
    const ox = mx - Math.sin(phi) / kappa;
    const oy = my + Math.cos(phi) / kappa;
    if (kappa > 0) ctx.arc(ox, oy, r, phi - (kappa * s) / 2 - Math.PI / 2, phi + (kappa * s) / 2 - Math.PI / 2, false);
    else ctx.arc(ox, oy, r, phi - (kappa * s) / 2 + Math.PI / 2, phi + (kappa * s) / 2 + Math.PI / 2, true);
  }
  ctx.stroke();
}

/* pose « capsule » exacte de l'arc i d'une icône centrée (cx,cy) à l'échelle k, tournée de rotDeg */
function arcPose(i, cx, cy, k, rotDeg = 0) {
  const a = ARCS[i];
  const am = (a.mid + rotDeg) * DEG;
  const R = a.R * k;
  return { mx: cx + R * Math.cos(am), my: cy + R * Math.sin(am), phi: am + Math.PI / 2, s: R * a.len * DEG, kappa: 1 / R, w: a.w * k };
}

function drawLetter(ctx, i, x, y, s, color, rotDeg = 0) {
  ctx.save();
  ctx.translate(x, y);
  if (rotDeg) ctx.rotate(rotDeg * DEG);
  ctx.scale(s, -s);
  ctx.fillStyle = color;
  ctx.fill(WORD[i].path);
  ctx.restore();
}

function grainTile(seed, alpha, size = 192) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  const r = rng(seed);
  for (let p = 0; p < img.data.length; p += 4) {
    const v = (r() * 255) | 0;
    img.data[p] = img.data[p + 1] = img.data[p + 2] = v;
    img.data[p + 3] = alpha;
  }
  g.putImageData(img, 0, 0);
  return c;
}

/* ==========================================================================
   Lecteur : machine à états intro → boucle → sortie.
   - La sortie part À TOUT INSTANT de la boucle (l'appli répond quand elle
     répond) : la scène reçoit tau0, le temps de boucle au moment du départ,
     et raccorde position ET vitesse.
   - Frise « film » = intro + 1 boucle + sortie, pour le scrub et l'export.
   ========================================================================== */
function mountPlayer(scene) {
  const qs = new URLSearchParams(location.search);
  const EXPORT = qs.has('export');
  const T = scene.T;
  const T_END = 0.9;
  const FILM = T.intro + T.loop + T.outro;

  const canvas = document.getElementById('stage');
  const main = canvas.getContext('2d');
  const layerC = document.createElement('canvas');
  const layer = layerC.getContext('2d');
  const smallC = document.createElement('canvas');
  const small = smallC.getContext('2d');

  const R = { main, layer, layerC, small, smallC, W: 0, H: 0, s: 1, ox: 0, oy: 0 };
  R.logical = (ctx) => ctx.setTransform(R.s, 0, 0, R.s, R.ox, R.oy);
  R.device = (ctx) => ctx.setTransform(1, 0, 0, 1, 0, 0);
  R.view = () => ({ x0: -R.ox / R.s, y0: -R.oy / R.s, x1: (R.W - R.ox) / R.s, y1: (R.H - R.oy) / R.s });
  R.clearLayer = () => {
    R.device(layer);
    layer.globalCompositeOperation = 'source-over';
    layer.globalAlpha = 1;
    layer.clearRect(0, 0, R.W, R.H);
  };
  /* halo : le calque est réduit au quart, flouté, puis ajouté en mode « lighter » */
  R.extra = [];
  R.newLayer = () => {
    const c = document.createElement('canvas');
    c.width = R.W || 1;
    c.height = R.H || 1;
    R.extra.push(c);
    return c;
  };
  R.bloom = (amount, blur, src = layerC) => {
    if (amount <= 0.001) return;
    const sw = smallC.width, sh = smallC.height;
    R.device(small);
    small.globalCompositeOperation = 'source-over';
    small.clearRect(0, 0, sw, sh);
    small.filter = `blur(${Math.max(0.5, (blur * R.s) / 4)}px)`;
    small.drawImage(src, 0, 0, sw, sh);
    small.filter = 'none';
    R.device(main);
    main.globalCompositeOperation = 'lighter';
    main.globalAlpha = Math.min(1, amount);
    main.drawImage(smallC, 0, 0, R.W, R.H);
    main.globalAlpha = 1;
    main.globalCompositeOperation = 'source-over';
  };
  R.composite = (alpha = 1, src = layerC) => {
    R.device(main);
    main.globalAlpha = alpha;
    main.drawImage(src, 0, 0);
    main.globalAlpha = 1;
  };

  function resize() {
    const dpr = EXPORT ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    const W = Math.round(window.innerWidth * dpr);
    const H = Math.round(window.innerHeight * dpr);
    if (W === R.W && H === R.H) return;
    canvas.width = layerC.width = W;
    canvas.height = layerC.height = H;
    for (const c of R.extra) { c.width = W; c.height = H; }
    smallC.width = Math.max(1, Math.round(W / 4));
    smallC.height = Math.max(1, Math.round(H / 4));
    R.W = W;
    R.H = H;
    R.s = Math.min(W / 1920, H / 1080);
    R.ox = (W - 1920 * R.s) / 2;
    R.oy = (H - 1080 * R.s) / 2;
  }

  /* ---------- état ---------- */
  const st = { phase: 'intro', t: 0, tau0: 0, loops: 0 };
  let playing = true, speed = 1, hold = false, exitReq = false;

  function filmTime() {
    if (st.phase === 'intro') return st.t;
    if (st.phase === 'loop') return T.intro + st.t;
    if (st.phase === 'outro') return T.intro + T.loop + st.t;
    return FILM;
  }
  function seekFilm(ft) {
    exitReq = false;
    if (ft < T.intro) Object.assign(st, { phase: 'intro', t: Math.max(0, ft) });
    else if (ft < T.intro + T.loop) Object.assign(st, { phase: 'loop', t: ft - T.intro, loops: 0 });
    else if (ft < FILM) Object.assign(st, { phase: 'outro', t: ft - T.intro - T.loop, tau0: 0 });
    else Object.assign(st, { phase: 'outro', t: T.outro, tau0: 0 });
  }
  function advance(dt) {
    st.t += dt * speed;
    for (let guard = 0; guard < 8; guard++) {
      if (st.phase === 'intro' && st.t >= T.intro) {
        st.t -= T.intro;
        if (exitReq) { exitReq = false; Object.assign(st, { phase: 'outro', tau0: 0 }); }
        else Object.assign(st, { phase: 'loop', loops: 0 });
        continue;
      }
      if (st.phase === 'loop') {
        if (exitReq) { exitReq = false; Object.assign(st, { phase: 'outro', tau0: st.t % T.loop, t: 0 }); continue; }
        if (st.t >= T.loop) {
          st.t -= T.loop;
          st.loops++;
          if (!hold) Object.assign(st, { phase: 'outro', tau0: 0 });
          continue;
        }
      }
      if (st.phase === 'outro' && st.t >= T.outro) { st.t -= T.outro; st.phase = 'end'; continue; }
      if (st.phase === 'end' && st.t >= T_END) { st.t -= T_END; Object.assign(st, { phase: 'intro' }); continue; }
      break;
    }
  }
  function draw() {
    resize();
    const ph = st.phase === 'end' ? 'outro' : st.phase;
    const t = st.phase === 'end' ? T.outro : st.t;
    scene.render(R, ph, t, st.tau0);
    if (!EXPORT) syncUI();
  }

  /* ---------- UI ---------- */
  const $ = (id) => document.getElementById(id);
  const ui = $('ui');
  const segs = [
    { el: $('segIntro'), d: T.intro, phase: 'intro' },
    { el: $('segLoop'), d: T.loop, phase: 'loop' },
    { el: $('segOutro'), d: T.outro, phase: 'outro' },
  ];
  const head = $('head');
  const track = $('track');
  let acc = 0;
  for (const sg of segs) {
    sg.t0 = acc;
    sg.el.style.left = `${(acc / FILM) * 100}%`;
    sg.el.style.width = `calc(${(sg.d / FILM) * 100}% - 3px)`;
    acc += sg.d;
  }
  function syncUI() {
    const ft = filmTime();
    head.style.left = `${(ft / FILM) * 100}%`;
    for (const sg of segs) {
      sg.el.classList.toggle('on', st.phase === sg.phase || (st.phase === 'end' && sg.phase === 'outro'));
      sg.el.style.setProperty('--fill-p', clamp((ft - sg.t0) / sg.d).toFixed(4));
    }
    const label = { intro: 'Intro', loop: `Boucle${st.loops ? ' ×' + (st.loops + 1) : ''}`, outro: 'Sortie', end: 'Fin' }[st.phase];
    $('phase').textContent = label;
    $('time').textContent = `${(st.phase === 'end' ? T.outro : st.t).toFixed(2)} s`;
    $('bPlay').setAttribute('aria-pressed', String(playing));
    const icon = playing ? ICON_PAUSE : ICON_PLAY;
    if ($('bPlay').dataset.icon !== icon) { $('bPlay').innerHTML = icon; $('bPlay').dataset.icon = icon; }
    $('bHold').setAttribute('aria-pressed', String(hold));
    $('bSlow').setAttribute('aria-pressed', String(speed !== 1));
    $('bExit').classList.toggle('armed', exitReq);
    $('bExit').disabled = st.phase === 'outro' || st.phase === 'end';
  }
  const ICON_PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>';

  const actions = {
    play() { if (st.phase === 'end' && !playing) seekFilm(0); playing = !playing; },
    replay() { seekFilm(0); playing = true; },
    exit() { if (st.phase === 'intro' || st.phase === 'loop') exitReq = true; },
    hold() { hold = !hold; },
    slow() { speed = speed === 1 ? 0.25 : 1; },
    step(d) { playing = false; seekFilm(clamp(filmTime() + d, 0, FILM)); },
  };
  if (!EXPORT) {
    $('bPlay').onclick = actions.play;
    $('bReplay').onclick = actions.replay;
    $('bExit').onclick = actions.exit;
    $('bHold').onclick = actions.hold;
    $('bSlow').onclick = actions.slow;
    window.addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
      const k = e.key.toLowerCase();
      if (k === ' ') actions.play();
      else if (k === 'r') actions.replay();
      else if (k === 's' || k === 'enter') actions.exit();
      else if (k === 'l') actions.hold();
      else if (k === 'v') actions.slow();
      else if (k === 'arrowright') actions.step(1 / 60);
      else if (k === 'arrowleft') actions.step(-1 / 60);
      else return;
      e.preventDefault();
      poke();
    });
    let dragging = false, wasPlaying = false;
    const scrub = (e) => {
      const r = track.getBoundingClientRect();
      seekFilm(clamp((e.clientX - r.left) / r.width) * FILM);
    };
    track.addEventListener('pointerdown', (e) => {
      dragging = true;
      wasPlaying = playing;
      playing = false;
      track.setPointerCapture(e.pointerId);
      scrub(e);
    });
    track.addEventListener('pointermove', (e) => dragging && scrub(e));
    track.addEventListener('pointerup', () => { dragging = false; playing = wasPlaying; });
    let idle;
    const poke = () => {
      ui.classList.remove('hidden');
      clearTimeout(idle);
      idle = setTimeout(() => playing && ui.classList.add('hidden'), 2600);
    };
    window.addEventListener('pointermove', poke);
    window.addEventListener('pointerdown', poke);
    poke();

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      playing = false;
      seekFilm(T.intro);
      $('reduced').hidden = false;
      $('reduced').querySelector('button').onclick = () => { $('reduced').hidden = true; actions.replay(); };
    }
  } else {
    ui.remove();
  }

  let last = null;
  function tick(now) {
    if (last !== null && playing) advance(Math.min(0.05, (now - last) / 1000));
    last = now;
    draw();
    requestAnimationFrame(tick);
  }

  /* API d'export : rendu exact d'un instant du film, sans horloge */
  window.__film = { duration: FILM, T };
  window.__seek = (ft) => { seekFilm(ft); draw(); };

  document.fonts.load('500 20px Poppins').finally(() => {
    window.addEventListener('resize', draw);
    if (EXPORT) { playing = false; seekFilm(0); draw(); window.__ready = true; }
    else requestAnimationFrame(tick);
  });
}

/* ==========================================================================
   Version 02 · CRÉNEAUX — papier, matière, mécanique d'horloger
   Idée : un arc du logo EST un créneau de planning plié. Chaque capsule garde
   sa longueur exacte (celle de l'arc) ; seule sa courbure change, 0 → 1/R.
   INTRO  1,5 s  trois créneaux arrivent comme des barres de Gantt, en vol
                 (ombre portée, étirement de vitesse), et se plient en arcs ;
                 le mot pousse depuis sa ligne de base, lettre par lettre.
   BOUCLE 6 s    relais d'horloger : chaque arc, tour à tour, se soulève du
                 papier, sort sur une piste extérieure (il ne recouvre jamais
                 les autres), fait un tour en 4 crans de 90° et se range ; le
                 mot accuse chaque cran ; le logo exact se repose entre deux relais.
   SORTIE 1,5 s  depuis n'importe quel instant : le cran en cours se termine,
                 le mot s'enfonce, les arcs se DÉPLIENT (rebond élastique de la
                 courbure) et repartent en barres, de part et d'autre.
   ========================================================================== */
const SCENE = (() => {
  const T = { intro: 1.5, loop: 6, outro: 1.5 };
  const { cx: CX, cy: CY, k: K } = LOCKUP;
  const ROW_Y = [CY, CY - 100, CY + 100]; /* magenta au centre, orange en haut, teal en bas */
  const PHI0 = [Math.PI, 0, Math.PI]; /* horizontale la plus proche de la tangente finale */
  const TICK_DUR = 0.22;
  const TICKS = ARCS.map((_, i) => [0, 1, 2, 3].map((k) => 0.3 + 2 * i + 0.26 * k));
  const THUMP = [2.6, 2.2, 1.8];
  const EXIT_DIR = [1, -1, 1];
  const PAPER = '#faf9f7';
  const travelEase = bezier(0.15, 0.6, 0.2, 1);
  const turnEase = bezier(0.5, 0, 0.2, 1);
  const bendIn = Ease.spring(0.5, 13);
  const bendOut = Ease.spring(0.42, 14);
  const flatEase = bezier(0.55, 0, 0.3, 1);
  const tickEase = Ease.outBack(2.2);
  const riseIn = Ease.outBack(1.3);
  const sinkOut = Ease.inBack(1.7);
  const grain = grainTile(5, 7);
  let grainPat = null;

  const mixPose = (A, B, p) => ({
    mx: lerp(A.mx, B.mx, p), my: lerp(A.my, B.my, p), phi: lerpAngle(A.phi, B.phi, p),
    s: lerp(A.s, B.s, p), kappa: lerp(A.kappa, B.kappa, p), w: lerp(A.w, B.w, p),
  });
  const nearestFlat = (phi) => (Math.cos(phi) >= 0 ? Math.round(phi / TAU) * TAU : Math.round((phi - Math.PI) / TAU) * TAU + Math.PI);

  /* ---------- intro ---------- */
  const iconPulse = (t) => 0.03 * ring(t - 1.12, 2.5, 7) * (1 - smooth(prog(t, 1.3, 1.5)));
  function introPose(i, t) {
    const fin = arcPose(i, CX, CY, K * (1 + iconPulse(t)));
    const t0 = 0.07 * i;
    const P0x = -760, P0y = ROW_Y[i], Qx = CX - 60, Qy = ROW_Y[i];
    const at = (tt) => {
      const p = prog(tt, t0, t0 + 0.95, travelEase);
      return [(1 - p) ** 2 * P0x + 2 * (1 - p) * p * Qx + p * p * fin.mx, (1 - p) ** 2 * P0y + 2 * (1 - p) * p * Qy + p * p * fin.my];
    };
    const [x, y] = at(t);
    const [xb, yb] = at(t - 1 / 120);
    const sp = clamp((Math.hypot(x - xb, y - yb) * 120) / 2600);
    return {
      mx: x, my: y,
      phi: lerpAngle(PHI0[i], fin.phi, turnEase(prog(t, 0.3 + t0, 1.15 + t0))),
      s: fin.s * (1 + 0.9 * sp),
      kappa: fin.kappa * bendIn(prog(t, 0.42 + t0, 1.3 + t0)),
      w: fin.w * (1 - 0.25 * sp),
      e: 1 - smooth(prog(t, 0.8 + t0, 1.35 + t0)),
    };
  }

  /* ---------- boucle ---------- */
  function loopRot(i, tau, onlyStartedBefore = Infinity) {
    let r = 0, squeeze = 0;
    for (const s of TICKS[i]) {
      if (s > onlyStartedBefore) continue;
      const p = prog(tau, s, s + TICK_DUR);
      r += 90 * tickEase(p);
      squeeze += Math.sin(Math.PI * p);
    }
    return { r, squeeze };
  }
  /* piste extérieure : le bord intérieur de l'arc soulevé passe au-delà du bord extérieur du teal */
  const OUT_SCALE = ARCS.map((a) => (TEAL_EDGE_U + a.w / 2 + 12) / a.R);
  const loopLift = (i, tau) => smooth(prog(tau, 0.04 + 2 * i, 0.32 + 2 * i)) * (1 - smooth(prog(tau, 1.28 + 2 * i, 1.6 + 2 * i)));
  function loopPose(i, tau, frozenAt = Infinity) {
    const { r, squeeze } = loopRot(i, tau, frozenAt);
    const e = loopLift(i, tau);
    const p = arcPose(i, CX, CY, K * lerp(1, OUT_SCALE[i], e), r);
    p.s *= 1 - 0.22 * squeeze;
    p.w = ARCS[i].w * K * (1 + 0.06 * e);
    p.e = e;
    return p;
  }
  function thump(j, tau, frozenAt = Infinity) {
    let dy = 0;
    TICKS.forEach((ticks, i) => ticks.forEach((s) => {
      if (s > frozenAt) return;
      dy += THUMP[i] * ring(tau - (s + 0.1) - 0.03 * j, 3, 9);
    }));
    return dy * (1 - smooth(prog(tau, 5.7, 6)));
  }

  /* ---------- sortie ---------- */
  function outroPose(i, t, tau0) {
    const tau = tau0 + t;
    const cur = loopPose(i, tau, tau0); /* le cran entamé se termine, aucun nouveau ne part */
    const flatPhi = nearestFlat(cur.phi);
    const flat = { mx: CX, my: ROW_Y[i], phi: flatPhi, s: cur.s, kappa: 0, w: cur.w };
    const t0 = 0.06 * i;
    const u = prog(t, 0.15 + t0, 0.72 + t0, flatEase);
    const p = mixPose(cur, flat, u);
    p.kappa = cur.kappa * (1 - bendOut(prog(t, 0.15 + t0, 0.8 + t0))); /* la courbure rebondit au-delà du plat */
    const x = prog(t, 0.68 + 0.07 * i, 1.3 + 0.07 * i, Ease.inCubic);
    p.mx += EXIT_DIR[i] * 2300 * x;
    p.s *= 1 + 1.8 * x;
    p.w *= 1 - 0.4 * x;
    p.e = Math.max(cur.e * (1 - prog(t, 0, 0.3)), Math.sin(Math.PI * prog(t, 0.1 + t0, 0.95 + t0)));
    return p;
  }

  const poseAt = (phase, i, t, tau0) => (phase === 'intro' ? introPose(i, t) : phase === 'loop' ? loopPose(i, t) : outroPose(i, t, tau0));

  function letterState(phase, t, tau0, j) {
    if (phase === 'intro') {
      const s = 0.72 + j * 0.055;
      const p = riseIn(prog(t, s, s + 0.5));
      return { dy: 175 * (1 - p), rot: 9 * (1 - p) };
    }
    if (phase === 'loop') return { dy: thump(j, t), rot: 0 };
    const s = (5 - j) * 0.04;
    const p = sinkOut(prog(t, s, s + 0.4));
    return { dy: 175 * p + thump(j, tau0 + t, tau0), rot: -7 * p };
  }

  /* ---------- rendu ---------- */
  function render(R, phase, t, tau0) {
    const ctx = R.main;
    const v = R.view();

    R.device(ctx);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, R.W, R.H);
    R.logical(ctx);
    const bg = ctx.createRadialGradient(900, 520, 0, 900, 520, 1250);
    bg.addColorStop(0, '#fdfcfa');
    bg.addColorStop(0.6, '#faf9f7');
    bg.addColorStop(1, '#efece7');
    ctx.fillStyle = bg;
    ctx.fillRect(v.x0, v.y0, v.x1 - v.x0, v.y1 - v.y0);
    R.device(ctx);
    if (!grainPat) grainPat = ctx.createPattern(grain, 'repeat');
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, R.W, R.H);
    R.logical(ctx);

    /* onde d'encre à l'emboîtement des trois arcs */
    if (phase === 'intro' && t > 1.08) {
      const p = prog(t, 1.08, 1.48, Ease.outCubic);
      ctx.globalAlpha = 0.16 * (1 - p);
      ctx.beginPath();
      ctx.arc(CX, CY, TEAL_EDGE_U * K + 8 + 54 * p, 0, TAU);
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = BRAND.ink;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* mot : pousse depuis sa ligne de base (masque juste sous la ligne) */
    ctx.save();
    ctx.beginPath();
    ctx.rect(LOCKUP.wordX - 60, v.y0 - 10, WORD_RIGHT - LOCKUP.wordX + 160, LOCKUP.baseY + 3 - v.y0 + 10);
    ctx.clip();
    for (let j = 0; j < 6; j++) {
      const ls = letterState(phase, t, tau0, j);
      const x = LOCKUP.wordX + WORD[j].x * LOCKUP.fs + (WORD[j].bounds[0] * LOCKUP.fs);
      ctx.save();
      ctx.translate(x, LOCKUP.baseY + ls.dy);
      if (ls.rot) ctx.rotate(ls.rot * DEG);
      drawLetter(ctx, j, -WORD[j].bounds[0] * LOCKUP.fs, 0, LOCKUP.fs, WORD[j].teal ? BRAND.teal : BRAND.ink);
      ctx.restore();
    }
    ctx.restore();

    /* créneaux / arcs, avec ombre portée quand ils quittent le papier ;
       l'arc soulevé passe AU-DESSUS des autres (ordre de dessin = élévation) */
    const poses = [0, 1, 2].map((i) => ({ i, p: poseAt(phase, i, t, tau0) }));
    poses.sort((a, b) => (a.p.e || 0) - (b.p.e || 0) || a.i - b.i);
    for (const { i, p } of poses) {
      const e = clamp(p.e || 0);
      if (e > 0.002) {
        ctx.shadowColor = `rgba(72,52,34,${0.24 * e})`;
        ctx.shadowBlur = 30 * e * R.s;
        ctx.shadowOffsetY = 15 * e * R.s;
      }
      strokeBent(ctx, p.mx, p.my, p.phi, p.s, p.kappa, p.w, ARCS[i].color);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }
  }

  return { T, render };
})();

mountPlayer(SCENE);
</script>
