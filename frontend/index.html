<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amateo</title>
    <!-- P5-24 — carte de partage (Open Graph / Twitter). Copie + image RECOPIÉES de la
         vitrine (deux zones indépendantes, aucun lien de code) ; URL ABSOLUES car un aperçu
         se charge hors du contexte de la page. AUCUN nom de marque en clair hors du <title>
         (les URL portent le domaine, une adresse) — gardé par tooling/og.test.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.amateo.app/" />
    <meta property="og:title" content="Le planning de votre club, sans le casse-tête" />
    <meta property="og:description" content="Générez le planning d'entraînements de votre club de basket en quelques minutes : toutes vos contraintes capturées, un planning optimisé, réajustable quand la réalité change." />
    <meta property="og:image" content="https://app.amateo.app/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- P5-14 (vague 3) — JS coupé : sans ce bloc, la SPA rend une page BLANCHE muette.
         Copie neutre SANS marque (le <title> est l'unique exception, cf. shared/lib/product.ts),
         zéro ressource externe, thème via prefers-color-scheme. Gardé par tooling/noscript.test.ts. -->
    <noscript>
      <style>
        .nojs {
          box-sizing: border-box;
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          font-family: system-ui, sans-serif;
          background: #f8fafc;
          color: #0f172a;
        }
        .nojs > div { max-width: 34rem; text-align: center; }
        .nojs h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
        .nojs p { font-size: 1rem; line-height: 1.6; margin: 0; color: #475569; }
        @media (prefers-color-scheme: dark) {
          .nojs { background: #0f172a; color: #f1f5f9; }
          .nojs p { color: #94a3b8; }
        }
      </style>
      <div class="nojs">
        <div>
          <h1>JavaScript est désactivé</h1>
          <p>
            Cette application ne peut pas fonctionner sans JavaScript.
            Réactivez-le dans les réglages de votre navigateur (ou dans votre
            extension de blocage), puis rechargez la page.
          </p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
