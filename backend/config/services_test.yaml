services:
    # P1-4 PR F — integration tests must never hit the real federation: the
    # FFBB client rides a deterministic stub (one engagement for ARA0000001).
    App\Tests\Double\FfbbHttpClientStub: ~
    App\Service\Basketball\FfbbApiClient:
        arguments:
            $httpClient: '@App\Tests\Double\FfbbHttpClientStub'

    # P2-53 RMM-8 — the geo clients never hit BAN/IGN in tests: deterministic
    # stubs keyed on the query/coordinates (empty query → no candidate; a
    # « poison » latitude → routing failure) so the autofill/geocode tests can
    # falsify MANUAL-survival, unresolved and cap without a network call.
    App\Tests\Double\BanGeocodingHttpClientStub: ~
    App\Service\Geo\BanGeocodingClient:
        arguments:
            $httpClient: '@App\Tests\Double\BanGeocodingHttpClientStub'
    App\Tests\Double\IgnRoutingHttpClientStub: ~
    App\Service\Geo\IgnRoutingClient:
        arguments:
            $httpClient: '@App\Tests\Double\IgnRoutingHttpClientStub'

    App\AdminJob\AdminJobExecutorInterface:
        alias: App\Tests\Double\RecordingAdminJobExecutor
        public: true
    App\Tests\Double\RecordingAdminJobExecutor:
        public: true

    # Wire the dev clock override in the test env too, so a non-regression test
    # can pin the clock and assert the season pivot / reminder crons follow it
    # (the structuring axis this simulator threads through). Unpinned, the
    # SimulatedClock returns real time — identical to the native clock, so other
    # tests are unaffected. `$inner` is bound to the native `clock` (no recursion).
    App\Clock\SimulatedClock:
        autowire: true
        arguments:
            $inner: '@clock'
    Psr\Clock\ClockInterface: '@App\Clock\SimulatedClock'
    Symfony\Component\Clock\ClockInterface: '@App\Clock\SimulatedClock'

    # P5-3a — décorateur pass-through du hasher : il compte les appels hashPassword pour
    # que PasswordResetEnumerationTest prouve que la branche « compte inexistant » du forgot
    # dépense bien un hash factice (équilibrage temporel anti-énumération). `$inner` est le
    # hasher réel décoré (patron $inner de SimulatedClock / FfbbHttpClientStub).
    App\Tests\Double\RecordingPasswordHasher:
        decorates: 'security.user_password_hasher'
        arguments:
            $inner: '@.inner'

    # P5-3b — le vérifieur Turnstile roule sur un stub au verdict pilotable : aucun
    # test d'inscription ne doit appeler Cloudflare. Le reste (secret, logger)
    # continue d'être autowiré/binder normalement (argument nommé = merge).
    App\Tests\Double\TurnstileHttpClientStub: ~
    App\Security\TurnstileVerifier:
        # autowire pour $logger ; le bind $turnstileSecret de services.yaml ne
        # retombe pas sur un service redéfini ici → on le REpose explicitement,
        # sinon le secret resterait au défaut vide et le test ne pourrait pas
        # activer Turnstile (%env% résolu au runtime, posé par le test avant boot).
        autowire: true
        arguments:
            $httpClient: '@App\Tests\Double\TurnstileHttpClientStub'
            $turnstileSecret: '%env(TURNSTILE_SECRET)%'
