parameters:
    # Boot-safe fallback: an environment that forgets to define the var still
    # boots (the transport is lazy — the real DSN comes from .env / deploy env,
    # e.g. redis://redis:6379/messages/failed in Docker). Prevents an
    # "Environment variable not found" kernel crash taking the whole API down.
    env(MESSENGER_FAILURE_TRANSPORT_DSN): 'redis://localhost:6379/messages/failed'

framework:
    messenger:
        # After all retries are exhausted, a failed message is preserved here
        # (inspectable via messenger:failed:show) instead of being silently
        # dropped. The schedule row's terminal status is reconciled separately
        # by the handler's catch-all and the stuck-schedule watchdog (BCK-01).
        failure_transport: failed

        # Correlation id (P5-11) : le middleware tamponne le request_id courant
        # au dispatch et le restaure côté worker. `default_middleware` reste actif
        # (défaut) — send_message/handle_message et les stamps par défaut sont
        # préservés ; on ajoute seulement le nôtre au bus par défaut.
        buses:
            messenger.bus.default:
                middleware:
                    - App\Messenger\RequestIdMiddleware

        transports:
            async:
                dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 2
                    max_delay: 60000
            failed: "%env(MESSENGER_FAILURE_TRANSPORT_DSN)%"

        routing:
            App\Message\GenerateScheduleMessage: async
            App\Message\ExportPdfMessage: async
            App\Message\Basketball\PopulateClubFromFfbbMessage: async
            App\Message\ComputeTravelTimesMessage: async
            # Les e-mails (vérification, reset, changement d'adresse…) partent par le bus :
            # le contrôleur enfile un SendEmailMessage, le SMTP se joue chez le worker (échec
            # retenu par le failure transport). Un envoi synchrone ferait d'un 500 SMTP un
            # oracle d'énumération sur la seule branche « compte existant » du forgot/register.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
