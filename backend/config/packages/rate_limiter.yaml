framework:
    rate_limiter:
        # Anti-brute-force / anti-ARA-enumeration on public auth endpoints.
        auth_register:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        auth_password_forgot:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        # Per-IP bound on the email-verification consume endpoint (anti token brute-force).
        auth_register_verify:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
        # P5-3a — consommer un lien de réinitialisation (POST /api/password/reset), PUBLIC,
        # keyé par IP : même famille « consommation de token secret » que auth_register_verify
        # (10/15min). Le forgot a déjà sa borne (auth_password_forgot) ; le reset était le seul
        # endpoint du rail mot de passe sans throttle — un token brute-forçable en boucle.
        auth_password_reset:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
        # P4-74 — demander un changement d'e-mail (POST /api/me/email), keyé PAR
        # UTILISATEUR (JWT) : la route envoie un mail vers une adresse tierce, donc
        # une borne dédiée en plus du limiteur `api` global. 5/15min couvre l'usage
        # réel (on change d'adresse rarement) et borne un envoi en boucle.
        email_change:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        # P4-74 — consommer le lien de confirmation (POST /api/me/email/confirm),
        # PUBLIC, keyé par IP (anti brute-force de token), même patron que
        # auth_register_verify.
        email_change_confirm:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
        admin_auth:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        # P5-6 — envoyer un signalement depuis l'app (POST /api/feedback), keyé PAR
        # UTILISATEUR (JWT) : la route persiste ET envoie un mail d'accusé, donc une
        # borne dédiée en plus du limiteur `api` global. 10/h couvre l'usage réel (on
        # signale un souci de temps en temps) et borne un envoi en boucle. NON assoupli
        # en test À DESSEIN — la borne étant PAR UTILISATEUR, seul un test qui poste 11
        # fois avec la même identité la tripe (aucun autre n'en fait autant sur un même
        # user), et FeedbackTest doit pouvoir prouver le 429 (patron auth_password_reset).
        feedback:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
        # P2-53 RMM-8 — l'autofill de la matrice de trajet (POST /api/venue-travel-times/autofill),
        # keyé PAR UTILISATEUR (JWT) : la route déclenche une RAFALE d'appels sortants vers l'IGN
        # (jusqu'à ~240 requêtes au cap). 10/h couvre l'usage réel (on remplit la matrice
        # ponctuellement, puis on ajuste à la main) et borne une boucle d'appels tiers.
        venue_travel_time_autofill:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
        # P2-54 RMM-9 — le rattrapage de l'annuaire adverse (POST /api/opponents/resolve),
        # keyé PAR UTILISATEUR (JWT) : la route déclenche une RAFALE d'appels sortants
        # (FFBB salles/organismes + géocodage BAN, jusqu'à ~3 requêtes par adversaire, cap 60).
        # 10/h couvre l'usage réel (on rattrape ponctuellement, puis l'annuaire se remplit tout
        # seul aux imports/apply) et borne une boucle d'appels tiers. Même patron que
        # venue_travel_time_autofill (per-user, non assoupli en test À DESSEIN).
        opponent_resolve:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
        # #10 C2 : la page publique de collecte des doléances (GET pré-remplissage +
        # POST soumission), par IP. 20/15min — large pour un coach (quelques soumissions),
        # borne réelle contre l'énumération de tokens.
        coach_wish_public:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
        # P3-4 : page publique d'approbation de création de club, par IP. Un
        # approbateur légitime fait 2-3 requêtes — borne anti-énumération de tokens.
        club_approval_public:
            policy: 'sliding_window'
            limit: 20
            interval: '15 minutes'
        # SEC-11: global throttle on the authenticated API, keyed PER USER (JWT),
        # applied by ApiRateLimitSubscriber on ^/api. 300/min = 5 req/s — well
        # above legitimate use (the frontend polls a schedule every few seconds)
        # but a real bound on a runaway/abusive client. Public endpoints keep
        # their own per-IP limiters above (this one needs an authenticated user).
        api:
            policy: 'sliding_window'
            limit: 300
            interval: '1 minute'
        # RGPD portabilité : l'export club lit toutes les tables du club et encode plusieurs Mo
        # par appel — l'usage légitime est ponctuel (quelques exports par an).
        # 10/h par utilisateur = large pour l'usage réel, borne réelle contre
        # un JWT management qui pomperait le workspace en boucle.
        # P4-45 — les deux caps MÉTIER, comptés PAR CLUB (ClubQuotaSubscriber), là où le
        # limiteur `api` ci-dessus compte par UTILISATEUR. Les deux bornent des choses
        # différentes : `api` protège d'un client emballé, ceux-ci d'une ressource partagée
        # et coûteuse. Un club ne doit pas obtenir trois fois le budget du solveur parce
        # qu'il a trois gestionnaires — c'est le club qui consomme, pas la personne.
        #
        # 5/h couvre les TROIS routes qui déclenchent un solve (generate, regenerate,
        # regenerate-from) : ne capper que la première aurait laissé le work-loop, donc
        # l'usage réel, hors de la borne. Un solve tient jusqu'à 600 s de CPU ; 5/h laisse
        # largement de quoi ajuster un planning dans une session de travail.
        schedule_generation:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # 10/h : le rendu PDF mobilise un worker Puppeteer. L'XLSX n'est PAS capté (généré
        # en mémoire, sans worker) — le limiteur global suffit à en borner un abus.
        schedule_pdf_export:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
        rgpd_export:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'

# Dev/e2e: the Playwright suite registers ~8 clubs in one minute from one IP —
# the strict anti-brute-force sizing (5/15min) is a production concern. 100 is
# enough for repeated local/CI suite runs while still being a REAL bound: an
# APP_ENV=dev box accidentally exposed (the .env.dist default) is not an open
# door for mass tenant creation / ARA enumeration. Prod keeps 5/15min.
when@dev:
    framework:
        rate_limiter:
            # La suite e2e enchaîne générations et exports sur un même club : les caps de
            # PROD y sont hors sujet. Ils restent des bornes réelles (un dev box exposé ne
            # devient pas une ferme à solves), mais assez larges pour une suite complète.
            schedule_generation:
                policy: 'sliding_window'
                limit: 200
                interval: '1 hour'
            schedule_pdf_export:
                policy: 'sliding_window'
                limit: 200
                interval: '1 hour'
            auth_register:
                policy: 'sliding_window'
                limit: 100
                interval: '15 minutes'
            auth_register_verify:
                policy: 'sliding_window'
                limit: 100
                interval: '15 minutes'
            coach_wish_public:
                policy: 'sliding_window'
                limit: 1000
                interval: '15 minutes'
            email_change:
                policy: 'sliding_window'
                limit: 100
                interval: '15 minutes'
            email_change_confirm:
                policy: 'sliding_window'
                limit: 100
                interval: '15 minutes'

# Test: a small API bound so ApiRateLimitTest can trip the 429 in a handful of
# requests. Keyed per user, so it never leaks across the other functional tests
# (each registers its own user, none makes 30 authed requests as one user).
when@test:
    framework:
        rate_limiter:
            api:
                policy: 'sliding_window'
                limit: 30
                interval: '1 minute'
            coach_wish_public:
                policy: 'sliding_window'
                limit: 1000
                interval: '15 minutes'
            # P4-74 : larges en test pour ne pas tripper pendant les suites.
            email_change:
                policy: 'sliding_window'
                limit: 1000
                interval: '15 minutes'
            email_change_confirm:
                policy: 'sliding_window'
                limit: 1000
                interval: '15 minutes'
