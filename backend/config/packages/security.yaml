security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        super_admin_provider:
            id: App\Security\SuperAdminProvider
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
        admin:
            pattern: ^/api/admin
            lazy: true
            provider: super_admin_provider
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/admin/auth/password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/auth/totp$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_SUPER_ADMIN }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        # SEC-16 (audit) : effacer le cookie httpOnly du JWT. Public par choix —
        # le geste est idempotent, ne révèle rien, et l'exiger authentifié
        # rendrait indéconnectable une session déjà expirée.
        - { path: ^/api/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/password, roles: PUBLIC_ACCESS }
        # P4-74 : confirmer un changement d'e-mail — le token EST l'identité
        # (envoyé à la nouvelle adresse) et le lien est souvent ouvert dans un
        # onglet non connecté. POST seul ; /api/me et /api/me/email (demande +
        # annulation) restent authentifiés (catch-all ^/api plus bas).
        - { path: ^/api/me/email/confirm$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        # SEC-10 (accepted): a club logo is a public brand asset, served to
        # unauthenticated consumers by design (emails, exported PDFs, future
        # public pages). The club id is an unguessable uuid; only GET is public.
        - { path: ^/api/clubs/[^/]+/logo$, methods: [GET], roles: PUBLIC_ACCESS }
        # Lot C: rehosted FFBB league/committee logos — public brand assets, GET only (same SEC-10 rationale).
        - { path: ^/api/ffbb-logos/, methods: [GET], roles: PUBLIC_ACCESS }
        # #10 C2 : page publique de collecte des doléances — le token (pas de JWT) porte
        # l'identité et le club. GET+POST publics ; tiret (coach-wishes) != /api/coach_wishes.
        - { path: ^/api/coach-wishes/public/, methods: [GET, POST], roles: PUBLIC_ACCESS }
        # P3-4 : page publique d'approbation de création de club — le token (mail
        # institutionnel FFBB, pas de compte) porte l'identité. 404 byte-identique.
        - { path: ^/api/club-approvals/, methods: [GET, POST], roles: PUBLIC_ACCESS }
        # P2-4 : le raccourci démo du register (DevDemoRegisterController). PRÉ-AUTH par
        # construction — le compte vient d'être créé par le register, aucun JWT encore ;
        # la route mint elle-même le cookie. Inoffensive hors démo : en debug comme
        # avant, en prod active seulement pendant la fenêtre d'activation du compte
        # animateur — sinon 422 not_demo_account, comme toute autre adresse.
        - { path: ^/api/dev/demo-register$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
