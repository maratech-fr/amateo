services:
    App\Service\DevScheduleReportWriter:
        autowire: true
        autoconfigure: true

    # Dev-only: throwaway load-test club seeding for the measurement harness.
    # Excluded from autoregistration in services.yaml so it can't reach prod/test.
    App\Command\LoadTestSeedClubsCommand:
        autowire: true
        autoconfigure: true

    # Dev/test-only: create-only seed of the real BCCL dev club (`make play`).
    # Excluded from autoregistration in services.yaml; declared here + in
    # services_test.yaml so it never reaches the prod container.
    App\Command\BcclSeedCommand:
        autowire: true
        autoconfigure: true

    # Dev-only clock override: consumers of ClockInterface get the simulated
    # clock (pinned instant from Redis, else real time). `$inner` is bound to the
    # native `clock` service explicitly so the alias below can't recurse.
    App\Clock\SimulatedClock:
        autowire: true
        arguments:
            $inner: '@clock'
    Psr\Clock\ClockInterface: '@App\Clock\SimulatedClock'
    Symfony\Component\Clock\ClockInterface: '@App\Clock\SimulatedClock'
