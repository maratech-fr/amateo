# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Where club logos are stored. Dev/default = local disk (persisted via the
    # ./:/app mount). Prod: swap the LogoStorage alias below for object storage.
    app.logo_storage_dir: '%kernel.project_dir%/var/storage/logos'
    # FFBB Meilisearch bearer token (lot C). Optional override — empty by default,
    # in which case FfbbApiClient fetches the public token from the FFBB config
    # endpoint at runtime. Never hard-code a token in the repo.
    env(FFBB_MEILISEARCH_TOKEN): ''
    # P5-3b — Cloudflare Turnstile sur le register. Vides par défaut → Turnstile
    # INERTE (le register n'exige aucun token, comportement byte-intact) ; seule
    # la prod pose ces valeurs. Le secret ne se COMMITE jamais (gardé par
    # EnvHygieneTest) ; la sitekey est publique (servie au front par /api/register/config).
    env(TURNSTILE_SECRET): ''
    env(TURNSTILE_SITEKEY): ''
    # P5-15 — l'expéditeur de TOUS les mails sortants (`MailFrom`). Le domaine doit
    # être celui VÉRIFIÉ chez le fournisseur transactionnel (SPF/DKIM/DMARC posés) :
    # un `from` hors domaine vérifié part en spam ou est refusé. Défauts = domaine
    # produit ; un environnement qui envoie depuis un autre domaine les surcharge.
    env(MAIL_FROM_ADDRESS): 'no-reply@amateo.app'
    env(MAIL_FROM_NAME): 'Amateo'
    # P5-15 — l'identité produit LUE PAR UN HUMAIN (`ProductIdentity`) : nom
    # commercial + éditeur. Variables pour qu'un renommage se fasse en UN point
    # (sujets d'e-mail, libellés d'écran, URI TOTP), jamais par une chasse aux
    # littéraux. `APP_PUBLISHER_NAME` est le responsable de traitement RGPD.
    env(APP_PRODUCT_NAME): 'Amateo'
    env(APP_PUBLISHER_NAME): 'Maratech'
    # SEC-16 (audit) — le cookie httpOnly qui porte le JWT applicatif. Nom et
    # chemin sont des PARAMÈTRES parce que trois écrivains doivent s'accorder :
    # le handler lexik (`set_cookies`, ci-dessous), `JwtCookieFactory`
    # (verifyEmail + déconnexion) et l'extracteur de jeton. Chemin `/api` : le
    # navigateur ne l'envoie qu'à l'API, jamais aux assets ni aux exports.
    app.jwt_cookie_name: 'BEARER'
    app.jwt_cookie_path: '/api'
    # P2-4 — le compte animateur du raccourci démo du register
    # (DevDemoRegisterController). MAISON UNIQUE : référence la constante de la
    # commande support `app:demo:create`, pour que les deux chemins qui posent
    # is_demo parlent du MÊME login. Jamais un littéral dupliqué.
    app.demo_animator_email: !php/const App\Command\DemoCreateCommand::DEFAULT_ANIMATOR_EMAIL
    # DÉFAUT `true` — fail-closed délibéré : une variable oubliée en production
    # donne un cookie `Secure` (correct), alors que l'inverse donnerait un jeton
    # en clair sur le réseau sans que rien ne le signale. C'est le DEV qui la met
    # à `false` (backend/.env), et son oubli s'y voit tout de suite : l'e2e
    # dockerisé tape http://frontend-dev:5173, une origine non sûre où un cookie
    # Secure n'est pas stocké du tout. Jamais dérivé de $request->isSecure() :
    # nginx prod écoute en 80 derrière la TLS et y répondrait faux
    # (docs/security/jwt-cookie.md).
    env(JWT_COOKIE_SECURE): 'true'

services:
    App\AdminJob\AdminJobExecutorInterface: '@App\AdminJob\ConsoleAdminJobExecutor'

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Browser-facing origin for links emailed to users (e.g. the email-verification
            # link). Empty → callers fall back to the request host (dev/e2e single origin).
            $frontendBaseUrl: '%env(FRONTEND_BASE_URL)%'
            # Optional FFBB Meilisearch token override (lot C); empty → fetched at runtime.
            $ffbbMeilisearchToken: '%env(FFBB_MEILISEARCH_TOKEN)%'
            # P5-6 — destination du digest de signalements (rail superadmin). Vide par
            # défaut ; posée par environnement. Née ici avec sa var .env.
            $supportEmail: '%env(SUPPORT_EMAIL)%'
            $appSecret: '%env(APP_SECRET)%'
            # P5-3b — Turnstile : secret (verify serveur) + sitekey (publique, front).
            $turnstileSecret: '%env(TURNSTILE_SECRET)%'
            $turnstileSiteKey: '%env(TURNSTILE_SITEKEY)%'
            # P5-15 — consommés par le SEUL service `MailFrom` ; les treize points
            # d'envoi lui demandent l'expéditeur, ils ne connaissent plus d'adresse.
            $mailFromAddress: '%env(MAIL_FROM_ADDRESS)%'
            $mailFromName: '%env(MAIL_FROM_NAME)%'
            # P5-15 — consommés par le SEUL service `ProductIdentity` ; les points
            # d'appel lui demandent le nom, ils ne portent plus de littéral.
            $productName: '%env(APP_PRODUCT_NAME)%'
            $publisherName: '%env(APP_PUBLISHER_NAME)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Service/DevScheduleReportWriter.php'
            - '../src/Export/ScheduleExportData.php'
            # Dev-only load-test harness command — registered in services_dev.yaml
            # so it never reaches the prod/test container (nor `bin/console list`).
            - '../src/Command/LoadTestSeedClubsCommand.php'
            # Dev/test-only BCCL create-only seed — registered in services_dev.yaml
            # + services_test.yaml so it never reaches the prod container (nor
            # `bin/console list` there); a runtime guard also refuses prod.
            - '../src/Command/BcclSeedCommand.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Logo storage: local disk in dev. Prod swaps this alias for an object-storage
    # implementation (S3/GCS/…) — callers depend only on the LogoStorage interface.
    App\Storage\LocalLogoStorage:
        arguments:
            $dir: '%app.logo_storage_dir%'
    App\Storage\LogoStorage: '@App\Storage\LocalLogoStorage'

    App\EventListener\TenantFilterListener:
        tags:
            - { name: kernel.event_subscriber }

    # P4-16 / P2-4 — l'horloge sait mentir pour un club démo (club.demo_today).
    # Décoration du service `clock` : TOUT consommateur de ClockInterface la
    # traverse. Hors requête (workers/crons/commandes) ou hors club (routes
    # publiques, firewall admin), passage direct — horloge réelle.
    App\Service\DemoAwareClock:
        decorates: 'clock'
        arguments:
            $inner: '@.inner'

    App\EventListener\CacheInvalidationListener:
        arguments:
            $scheduleCachePool: '@cache.schedule'
