# Deploy — build the prod images, push them to ghcr.io, then (if the VM is
# configured) roll the production stack to the new version over SSH.
#
# Two triggers, two different outcomes (docs/ops/deploy.md):
#   - push of a v* tag  → BUILD ONLY: publishes the images to ghcr.io and stops.
#                         Deployment is then a deliberate manual act (SuperAdmin
#                         console or `make deploy VERSION=<tag>`) — a tag never
#                         rolls the VM on its own (« tag ≠ déploiement »).
#   - workflow_dispatch → BUILD + DEPLOY: publishes the images AND rolls the VM
#                         (VERSION = input or short sha). This is the only event
#                         that runs the `deploy` and `update-release-branch` jobs.
#
# Re-deploying an EXISTING version (rollback) never rebuilds: if the images
# for that version are already in the registry they are reused as-is — the
# artifact that actually ran is what comes back, and history is never
# overwritten by a fresh build with drifted base layers.
#
# After a SUCCESSFUL VM roll, the `release` branch is fast-forwarded to the
# deployed commit so it stays ISO-prod — the starting point for fast fixes
# (hotfix) without dragging all of `main` into prod. See the
# update-release-branch job below and docs/ops/deploy.md §Branche `release`.
#
# The deploy job is gated on workflow_dispatch AND the repo variable
# DEPLOY_ENABLED == 'true' so the whole workflow is mergeable and the
# image-publishing half works BEFORE any VM exists; flipping the variable
# (plus the DEPLOY_* secrets) arms it.

name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (existing tag or sha-<short> = redeploy those images; empty = build this commit as its short sha)"
        required: false
        default: ""
      # Scheduled-maintenance window (empty = deploy behaves EXACTLY as before).
      # When set to an ISO-8601 instant, the deploy job raises the maintenance
      # witness ($DEPLOY_PATH/maintenance.on, the ISO Caddy serves as "back at")
      # BEFORE rolling the stack and clears it only after a successful roll.
      maintenance_until:
        description: "ISO-8601 return time (e.g. 2026-10-19T02:00:00+02:00); empty = no maintenance window, deploy unchanged"
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write


jobs:
  build-push:
    name: Build & push prod images
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
      deployed_sha: ${{ steps.meta.outputs.deployed_sha }}
    steps:
      # Dispatch with version=<existing tag> checks out THAT tag (a rollback
      # builds the OLD code if it must build at all — see the registry
      # short-circuit below). A sha-<short> version can't be a checkout ref:
      # it is resolved to its commit in the meta step (hence fetch-depth: 0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ (inputs.version != '' && !startsWith(inputs.version, 'sha-')) && inputs.version || '' }}
          fetch-depth: 0

      - name: Resolve version + lowercase owner
        id: meta
        env:
          # Never interpolate the raw input into shell text (script injection);
          # it arrives as an env var and is strictly validated before use.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="sha-$(git rev-parse --short HEAD)"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "FATAL: invalid version '$VERSION' (allowed: alphanumerics, dot, dash, underscore)" >&2
            exit 1
          fi
          # Redeploy of a sha-labelled build: point the workspace at that commit.
          if printf '%s' "$VERSION" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            git checkout "${VERSION#sha-}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          # Résout le commit RÉELLEMENT déployé (output `deployed_sha`) : la
          # branche `release` est ensuite recalée dessus — jamais sur le
          # github.sha du dispatch (qui, pour un rollback, est le HEAD de `main`).
          # sha-<court> → on dé-préfixe ; tag ou commit → rev-parse. fetch-depth 0
          # (checkout ci-dessus) rend tags ET commits résolvables quel que soit le
          # déclencheur. Échec de résolution = FATAL, jamais de repli silencieux.
          if printf '%s' "$VERSION" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            DEPLOYED_REF="${VERSION#sha-}"
          else
            DEPLOYED_REF="$VERSION"
          fi
          DEPLOYED_SHA="$(git rev-parse --verify --quiet "${DEPLOYED_REF}^{commit}" || true)"
          if [ -z "$DEPLOYED_SHA" ]; then
            echo "FATAL: impossible de résoudre le commit déployé pour la version '$VERSION' (ref '$DEPLOYED_REF')" >&2
            exit 1
          fi
          echo "deployed_sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"
          # :latest only moves FORWARD, on tag releases — a dispatch that
          # rebuilds an old ref must never drag latest backwards.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Deploying version: ${VERSION}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Connexion Docker Hub avant les builds prod (FROM php/node/nginx/python/postgres) : les
      # runners partagés épuisent le quota ANONYME (429 Too Many Requests — incident 2026-10-09).
      # Conditionnelle : sans les secrets la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Rollback short-circuit: if this version's images already exist in the
      # registry, DO NOT rebuild — reuse the exact artifacts that ran. A fresh
      # rebuild of an old tag would resolve newer base layers/apt packages and
      # overwrite the known-good images. ALL SIX images must exist: a run that
      # died after pushing only some of them must NOT poison the version into
      # "published forever but unpullable" — a partial set rebuilds everything.
      - name: Check registry for existing images
        id: existing
        run: |
          FOUND=true
          for IMG in php nginx frontend postgres engine pdf-worker; do
            if ! docker manifest inspect "ghcr.io/${{ steps.meta.outputs.owner }}/scheduler-${IMG}:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
              FOUND=false
              echo "scheduler-${IMG}:${{ steps.meta.outputs.version }} missing from the registry"
            fi
          done
          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" = "true" ]; then
            echo "All 6 images for ${{ steps.meta.outputs.version }} already published — skipping build, deploying as-is."
          fi

      # One step per image — same targets as the CI "Build prod images" step
      # (anti-rot pair: CI proves they build, this one publishes them).
      - name: Build & push scheduler-php
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/scheduler-php:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.push_latest == 'true' && format('ghcr.io/{0}/scheduler-php:latest', steps.meta.outputs.owner) || '' }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max

      - name: Build & push scheduler-nginx
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: nginx-prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/scheduler-nginx:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.push_latest == 'true' && format('ghcr.io/{0}/scheduler-nginx:latest', steps.meta.outputs.owner) || '' }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max

      - name: Build & push scheduler-frontend
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: prod
          push: true
          # P5-19 — the frontend Sentry DSN is frozen into the bundle at build
          # time, so it must be injected HERE (the runtime .env.prod can't reach
          # a compiled bundle). Empty until the VITE_SENTRY_DSN secret is set →
          # Sentry stays inert and the build guard is a no-op. Turning it on also
          # requires the DSN's ingest host in docker/frontend/csp.conf, else the
          # build fails on purpose (tooling/sentryCspGuard.ts).
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/scheduler-frontend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.push_latest == 'true' && format('ghcr.io/{0}/scheduler-frontend:latest', steps.meta.outputs.owner) || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build & push scheduler-postgres
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/postgres/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/scheduler-postgres:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.push_latest == 'true' && format('ghcr.io/{0}/scheduler-postgres:latest', steps.meta.outputs.owner) || '' }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

      - name: Build & push scheduler-engine
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/engine/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/scheduler-engine:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.push_latest == 'true' && format('ghcr.io/{0}/scheduler-engine:latest', steps.meta.outputs.owner) || '' }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max

      - name: Build & push scheduler-pdf-worker
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/pdf-worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/scheduler-pdf-worker:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.push_latest == 'true' && format('ghcr.io/{0}/scheduler-pdf-worker:latest', steps.meta.outputs.owner) || '' }}
          cache-from: type=gha,scope=pdf-worker
          cache-to: type=gha,scope=pdf-worker,mode=max

      # Un push de tag ne fait que CONSTRUIRE : l'annoncer noir sur blanc (log +
      # résumé du run) pour que l'opérateur qui pousse un tag voie que rien n'a été
      # déployé et comment le faire ensuite (cadrage « tag ≠ déploiement »). Step
      # limité à l'événement `push` : un workflow_dispatch, lui, enchaîne sur le job
      # `deploy`. La version vient de l'output `meta` (jamais une interpolation brute
      # d'une entrée du dispatch dans le shell).
      - name: Announce that a tag push only builds
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "Images publiées pour ${VERSION} — AUCUN déploiement."
            echo "Déployer : console SuperAdmin (onglet Exploitation) ou make deploy VERSION=${VERSION}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Roll the VM to ${{ needs.build-push.outputs.version }}
    runs-on: ubuntu-24.04
    needs: build-push
    # Two belts, both required — a tag push BUILDS but never DEPLOYS:
    #   - github.event_name == 'workflow_dispatch' separates build from deploy:
    #     a v* tag push only publishes images; deployment is a deliberate manual
    #     act (SuperAdmin console or `make deploy VERSION=…`, docs/ops/deploy.md).
    #   - vars.DEPLOY_ENABLED == 'true' arms the VM the day it exists (plus the
    #     secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY).
    # Until both hold the job is skipped and a release only publishes images.
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
    steps:
      # Validate the maintenance window FIRST — before any checkout or SSH, so a
      # forged value aborts the run without ever touching the VM. Empty input =
      # no window: this step is a no-op and the deploy is byte-for-byte unchanged.
      # The value arrives as an env var (never interpolated into the shell) and
      # is matched against a strict ISO-8601 instant with a timezone offset or Z.
      - name: Validate the maintenance window
        env:
          MAINTENANCE_UNTIL: ${{ inputs.maintenance_until }}
        run: |
          if [ -z "$MAINTENANCE_UNTIL" ]; then
            echo "No maintenance window requested — deploy proceeds unchanged."
            exit 0
          fi
          if ! printf '%s' "$MAINTENANCE_UNTIL" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?([+-][0-9]{2}:[0-9]{2}|Z)$'; then
            echo "::error::invalid maintenance_until '$MAINTENANCE_UNTIL' (expected ISO-8601 like 2026-10-19T02:00:00+02:00 or 2026-10-19T00:00:00Z)"
            exit 1
          fi
          echo "Maintenance window valid — returning at $MAINTENANCE_UNTIL"

      # Same ref logic as build-push: the compose file shipped to the VM must
      # be the one matching the deployed version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ (inputs.version != '' && !startsWith(inputs.version, 'sha-')) && inputs.version || '' }}
          fetch-depth: 0

      # Secrets rail: the ENV_PROD GitHub secret holds the VM's whole .env.prod
      # (the filled file pasted verbatim). GitHub masks secrets.* line by line
      # in the logs; we never echo the content and never `set -x`. It is written
      # to the runner under umask 077, travels only over scp (SSH) and lands
      # where it already lives today, chmod 600.
      # Empty/absent ENV_PROD = hard fail BEFORE any VM mutation (the message
      # says to create the secret). Rollback: `make deploy VERSION=<tag>`
      # (dispatch → the workflow of main → current secrets) — NEVER re-push an
      # old tag: its workflow still expects the old encrypted env rail and its
      # passphrase secret (both removed here) and would FATAL before any
      # mutation (docs/ops/deploy.md §Rollback).
      - name: Push .env.prod from the ENV_PROD secret
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/amateo' }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          if [ -z "$ENV_PROD" ]; then
            echo "FATAL: the ENV_PROD secret is empty or not set — create it (the full .env.prod pasted verbatim)" >&2
            exit 1
          fi
          # Same strict validation discipline as the SSH deploy step below.
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "FATAL: invalid DEPLOY_PATH '$DEPLOY_PATH'" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$ENV_PROD" > "$RUNNER_TEMP/.env.prod"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST")
          SCP=(scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new)
          # remote-deploy.sh pins VERSION= into the VM's .env.prod after every
          # successful deploy; the VERSION line in the secret is stale by
          # design. Preserve the VM's current pin so a manual `up -d` between
          # deploys keeps pulling the running version.
          current_pin=$("${SSH[@]}" "grep '^VERSION=' '$DEPLOY_PATH/.env.prod' 2>/dev/null || true")
          if [ -n "$current_pin" ]; then
            sed -i '/^VERSION=/d' "$RUNNER_TEMP/.env.prod"
            printf '%s\n' "$current_pin" >> "$RUNNER_TEMP/.env.prod"
          fi
          "${SCP[@]}" "$RUNNER_TEMP/.env.prod" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env.prod"
          "${SSH[@]}" "chmod 600 '$DEPLOY_PATH/.env.prod'"
          rm -f "$RUNNER_TEMP/.env.prod"

      # Raise the maintenance witness BEFORE rolling the stack, but only for a
      # scheduled window (empty input = skipped, deploy unchanged). Caddy serves
      # the maintenance page while $DEPLOY_PATH/maintenance.on exists and prints
      # its single line as the "back at" time. Same SSH rail as the steps around
      # it (key under ~/.ssh, StrictHostKeyChecking=accept-new). The validated
      # ISO is piped over stdin — never interpolated into the remote command —
      # and is the ONLY content of the file.
      - name: Raise the maintenance window
        if: inputs.maintenance_until != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/amateo' }}
          MAINTENANCE_UNTIL: ${{ inputs.maintenance_until }}
        run: |
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "FATAL: invalid DEPLOY_PATH '$DEPLOY_PATH'" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST")
          printf '%s\n' "$MAINTENANCE_UNTIL" | "${SSH[@]}" "cat > '$DEPLOY_PATH/maintenance.on'"

      - name: SSH deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/amateo' }}
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          # DEPLOY_PATH lands inside the remote command line — same strict
          # validation discipline as VERSION (absolute path, safe charset).
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "FATAL: invalid DEPLOY_PATH '$DEPLOY_PATH'" >&2
            exit 1
          fi
          if printf '%s' "$VERSION" | grep -Eq '^sha-[0-9a-f]{7,40}$'; then
            git checkout "${VERSION#sha-}"
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST")
          SCP=(scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new)
          # Ship the version-matched compose file + deploy script every time:
          # the VM's copy must never drift from the code being deployed (the
          # first-install copy would otherwise be frozen forever).
          "${SCP[@]}" docker-compose.prod.yml scripts/remote-deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          # P5-5 — la page de vente (statique pur) part avec la même version que l'app,
          # donc elle se ROLLBACK avec elle : une copie manuelle aurait créé une seconde
          # vérité, la page en ligne pouvant dater d'une version que plus personne ne
          # connaît. Elle n'est PAS servie par la stack Docker mais par Caddy, qui lit ce
          # dossier depuis le disque (docs/ops/Caddyfile.example).
          #
          # Copie dans un dossier NEUF puis bascule : `scp -r` par-dessus l'existant
          # laisserait vivre un fichier supprimé du dépôt, et servirait une page à moitié
          # écrite pendant la copie. Le `.old` est gardé un cycle — de quoi revenir à la
          # main si la bascule tombait au mauvais moment.
          "${SSH[@]}" "rm -rf '$DEPLOY_PATH/landing.new' '$DEPLOY_PATH/landing.old'"
          "${SCP[@]}" -r landing "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/landing.new"
          "${SSH[@]}" "if [ -d '$DEPLOY_PATH/landing' ]; then mv '$DEPLOY_PATH/landing' '$DEPLOY_PATH/landing.old'; fi; mv '$DEPLOY_PATH/landing.new' '$DEPLOY_PATH/landing'"
          # Les pages système (503 + maintenance, statique pur — docs/ops/Caddyfile.example)
          # partent avec la MÊME version que l'app, exactement comme la landing : même
          # rollback, même dépôt atomique (dossier NEUF puis bascule, `.old` gardé un cycle).
          # ⚠ `system-pages/` est un FRÈRE de `landing/`, jamais dedans : le domaine nu
          #   sert `landing/` et n'exposerait pas 503.html à côté de la page de vente.
          "${SSH[@]}" "rm -rf '$DEPLOY_PATH/system-pages.new' '$DEPLOY_PATH/system-pages.old'"
          "${SCP[@]}" -r system-pages "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/system-pages.new"
          "${SSH[@]}" "if [ -d '$DEPLOY_PATH/system-pages' ]; then mv '$DEPLOY_PATH/system-pages' '$DEPLOY_PATH/system-pages.old'; fi; mv '$DEPLOY_PATH/system-pages.new' '$DEPLOY_PATH/system-pages'"
          # Executed as a FILE, never piped: `docker compose run` reads stdin
          # and would swallow the rest of a piped script (silent half-deploy).
          "${SSH[@]}" "DEPLOY_PATH='$DEPLOY_PATH' VERSION='$VERSION' bash '$DEPLOY_PATH/remote-deploy.sh'"

      # Clear the maintenance witness ONLY after a successful roll (remote-deploy.sh
      # already includes the /health + /api/health probes in its exit code). No
      # always() here on purpose: if any prior step failed, the witness is LEFT in
      # place — the app stays behind the maintenance page and an operator is alerted.
      - name: Clear the maintenance window
        if: success() && inputs.maintenance_until != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/amateo' }}
        run: |
          if ! printf '%s' "$DEPLOY_PATH" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "FATAL: invalid DEPLOY_PATH '$DEPLOY_PATH'" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST")
          "${SSH[@]}" "rm -f '$DEPLOY_PATH/maintenance.on'"

  # Après un déploiement VM RÉUSSI, faire suivre la branche `release` au commit
  # RÉELLEMENT déployé : `release` reste ISO-prod, point de départ des correctifs
  # rapides (hotfix) sans embarquer tout `main`
  # (docs/ops/deploy.md §Branche `release` et correctif rapide).
  #   - `needs: [build-push, deploy]` → par la sémantique par défaut de `needs`,
  #     ce job ne tourne QUE si `deploy` a réussi ; tant que la VM n'existe pas
  #     (DEPLOY_ENABLED != 'true'), `deploy` est `skipped`, donc ce job aussi et
  #     `release` ne bouge pas — elle ne suit que de VRAIS déploiements.
  #   - `if: github.event_name == 'workflow_dispatch'` → ceinture EXPLICITE en
  #     plus de `needs: deploy` : recaler `release` est un geste de déploiement,
  #     jamais de simple build de tag (cadrage « tag ≠ déploiement »). Un push de
  #     tag `v*` ne fait que CONSTRUIRE : il ne recale donc pas `release`.
  #   - Le commit poussé est `deployed_sha` (résolu par build-push depuis la
  #     version : tag, `sha-…` ou commit courant), PAS le github.sha du dispatch →
  #     un rollback recale `release` sur l'artefact redéployé, pas sur `main`.
  update-release-branch:
    name: Fast-forward `release` to the deployed commit
    runs-on: ubuntu-24.04
    needs: [build-push, deploy]
    if: github.event_name == 'workflow_dispatch'
    # Moindre privilège : ce job est le SEUL à écrire dans le dépôt (pousser la
    # ref `release`). Un bloc `permissions:` par job REMPLACE le régime racine
    # (`contents: read`) ; `packages:` est donc absent ici — inutile pour ce job.
    permissions:
      contents: write
    steps:
      # On checkoute le commit déployé lui-même (fetch-depth 0 : tout l'historique
      # + les tags, pour que ce commit soit présent localement quel que soit le
      # déclencheur). persist-credentials (défaut d'actions/checkout) enregistre le
      # GITHUB_TOKEN du job — porté au scope `contents: write` ci-dessus — comme
      # credential git : le push s'authentifie SANS secret dans `env:` (convention).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build-push.outputs.deployed_sha }}
          fetch-depth: 0

      - name: Point `release` at the deployed commit
        env:
          # Commit résolu de la version déployée (sortie de build-push), pas le
          # github.sha du dispatch : un rollback recale donc `release` sur
          # l'artefact redéployé. Passé par env, jamais interpolé dans le script.
          DEPLOYED_SHA: ${{ needs.build-push.outputs.deployed_sha }}
        run: |
          # `--force` crée `release` si absente et la recale sinon : la branche a
          # sa propre histoire (partie de la 1re prod, v1.0.0), un push fast-forward
          # strict échouerait.
          git push --force origin "${DEPLOYED_SHA}:refs/heads/release"
