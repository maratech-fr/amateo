name: Visual Baselines

# Génération / vérification des CAPTURES DE RÉFÉRENCE de `tests/e2e/visual-reference.spec.ts`
# (PR 8/8 série « uniformité des écrans »). Les PNG de référence doivent être produits dans
# l'environnement EXACT de la CI : le conteneur Playwright (service compose `e2e`, image épinglée
# sur le lock) contre le Vite du conteneur `frontend-dev` — mêmes polices que le job `e2e` de
# `ci.yml` qui les COMPARE, que le job tourne chez GitHub ou sur le runner auto-hébergé. On ne
# les génère donc jamais en local.
#
# Déclenché À LA DEMANDE uniquement (`workflow_dispatch`) — une fois ce workflow sur `main`,
# `gh workflow run visual-baselines.yml --ref <branche> -f update=true` marche depuis N'IMPORTE
# quelle branche. Deux modes selon l'entrée `update` :
#   - update=true  (`--update-snapshots=all`) : RÉÉCRIT TOUS les PNG et les publie en artefact
#     `visual-baselines` → on télécharge, on committe le dossier `-snapshots/`, on re-pousse.
#     `=all`, jamais le mode par défaut (`changed`) : celui-ci ne réécrit que les captures en
#     ÉCHEC, or le spec tolère `maxDiffPixelRatio: 0.01` — un changement de texte de quelques
#     lettres passe sous la tolérance et la référence publiée garderait l'ancien texte, en
#     silence. Une régénération réécrit donc toutes les références.
#   - update=false (défaut)                    : compare aux PNG committés (vérification ad hoc).
#
# ⚠ Le GATE réel vit dans le job `e2e` de `ci.yml` (required check « E2E (Playwright) ») : il COMPARE
# le spec aux références à chaque PR, il ne réécrit JAMAIS (aucun `--update-snapshots`). La
# (re)génération vit ici, isolée.

on:
  workflow_dispatch:
    inputs:
      update:
        description: "Régénérer TOUS les PNG de référence (--update-snapshots=all) au lieu de comparer"
        type: boolean
        default: false

permissions:
  contents: read


jobs:
  visual-baselines:
    name: Visual Baselines
    runs-on: ${{ vars.CI_RUNS_ON_HEAVY || 'ubuntu-24.04' }}
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 40
    env:
      # Même régime que le job e2e de ci.yml : un projet compose par job et par tentative,
      # overlay sans port hôte, chemins ABSOLUS (un step en `working-directory: frontend` ne
      # résoudrait pas un chemin relatif).
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      AMATEO_STACK: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/docker-compose.test.yml
      # Même raison que le job e2e : couper la délégation bake évite « waiting for BuildKit ».
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job vont dans
      # un DOCKER_CONFIG propre au job, jamais dans celui du runner (même step que ci.yml).
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      # Connexion Docker Hub avant tout tirage (build-php-cached, compose pull/build) : les
      # runners partagés épuisent le quota ANONYME (429 Too Many Requests — incident 2026-10-09).
      # Conditionnelle : sans les secrets la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Pre-pull third-party images
        run: .github/scripts/retry.sh 3 docker compose --profile tools pull --ignore-buildable nginx mercure redis postgres mailpit e2e

      - name: Build the engine image
        run: .github/scripts/retry.sh 2 docker compose build engine

      - name: Start services
        run: .github/scripts/retry.sh 3 docker compose up -d --wait php-fpm nginx engine mercure redis postgres mailpit

      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # Même seed que le job e2e : BCCL (create-only) sur la connexion ADMIN (le seeder refuse
      # amateo_app) + les tables de référence vacances/fériés (globales, connexion simple).
      - name: Seed dev data
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — le seed ne peut pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console app:bccl:seed --no-interaction
            php bin/console app:school-holidays:seed --no-interaction
            php bin/console app:public-holidays:seed --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      # Même mécanique que le job e2e de ci.yml : Vite dans `frontend-dev` (busybox : `wget`,
      # jamais `curl`), attente bornée à 300 essais (~5 min, `npm ci` sur volume neuf), sonde sur
      # `127.0.0.1` : sous Alpine `localhost` → `::1` (IPv6), Vite n'écoute qu'en IPv4.
      - name: Start Vite dev server
        run: |
          docker compose --profile dev up -d frontend-dev
          for i in $(seq 1 300); do
            docker compose --profile dev exec -T frontend-dev wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker compose --profile dev logs --tail 80 frontend-dev
          echo "Vite dev server did not come up" && exit 1

      # Volume `e2e_node_modules` neuf (possédé par root) rendu à l'uid du runner. Guillemets
      # DOUBLES : l'HÔTE expanse `$(id -u)` (sous apostrophes il vaudrait 0, dans ce conteneur root).
      - name: Hand the e2e node_modules volume to the runner uid
        run: docker compose --profile tools run --rm --no-deps --user root e2e sh -lc "chown -R $(id -u):$(id -g) /app/frontend/node_modules"

      # Génère OU compare, selon le mode. `set -o pipefail` explicite (le shell `run` par défaut
      # est `bash -e {0}` SANS pipefail). En COMPARE une référence manquante fait ÉCHOUER (CI=true,
      # Playwright ne crée jamais une référence absente) — c'est voulu : on committe d'abord.
      - name: Run visual-reference (generate or compare)
        working-directory: frontend
        # `inputs.update` passe par l'ENV, JAMAIS interpolé dans le corps du `run` (semgrep
        # run-shell-injection) — même discipline que `ci.yml` pour toute valeur variable.
        env:
          UPDATE: ${{ inputs.update }}
        # Dans le conteneur Playwright (cible par défaut du service : http://frontend-dev:5173) ;
        # `CI=true` passé explicitement — l'env du runner n'entre pas dans le conteneur.
        run: |
          set -o pipefail
          ARGS=""
          if [ "$UPDATE" = "true" ]; then ARGS="--update-snapshots=all"; fi
          docker compose --profile tools run --rm --no-deps -e CI=true e2e sh -lc "PUPPETEER_SKIP_DOWNLOAD=1 npm ci --legacy-peer-deps && npx playwright test tests/e2e/visual-reference.spec.ts $ARGS"

      # Les PNG de référence (après un run UPDATE) + les diffs d'un run COMPARE rouge. `always()` :
      # en UPDATE le run est vert et on veut quand même les PNG ; en COMPARE rouge on veut les diffs.
      - name: Upload snapshots + diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-baselines
          path: |
            frontend/tests/e2e/visual-reference.spec.ts-snapshots/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

      # Démonte TOUJOURS la stack du job — même job rouge : démon partagé et persistant.
      - name: Tear down the compose stack (always)
        if: always()
        uses: ./.github/actions/ci-stack-down
