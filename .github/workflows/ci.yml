name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un push qui remplace un autre sur la MÊME réf annule le run précédent — sauf sur `main`, où
# chaque commit mérite son verdict complet (file de merge, historique du gate). Économise des
# exécutants sur les PR qui repoussent vite, sans jamais couper un run de `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Lint Docker Compose
        run: docker compose config > /dev/null

      - name: Lint Makefile
        run: make -n help

      - name: Stack resolve bench
        run: bash backend/scripts/lib/stack-resolve-test.sh

  # Frontend gate: until now the frontend had NO CI coverage — only the e2e job
  # touched it via `npm run dev` (Vite, no typecheck). A broken production build
  # (`tsc -b`) and failing Vitest units both slipped through. This job closes
  # that gap: typecheck + production build + unit tests on every PR.
  frontend:
    name: Frontend (build + unit)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Garde d'hygiène des dépendances : knip rougit sur une dev/dép déclarée mais
      # jamais importée, ou un fichier source inatteignable depuis les entrées
      # (`knip.json`). Mode `--dependencies --files` : les exports inutilisés restent
      # HORS du gate (bruit au départ). Le job `frontend` n'est pas dans les `needs`
      # de `build-docker` : une dérive d'hygiène rougit ce check sans bloquer l'image.
      - name: Dependency check (knip)
        working-directory: frontend
        run: npm run lint:deps

      - name: Build (tsc -b + vite)
        working-directory: frontend
        run: npm run build

      # Unitaires Vitest AVEC couverture + cliquet (ex-job `frontend-coverage` fondu ici,
      # 2026-10-14 : un seul passage de la suite au lieu de deux). Le cliquet rougit si la
      # couverture de lignes descend sous le plancher versionné (`coverage-floor.json`, lu par
      # `vitest.config.ts` → `thresholds.lines`) — un required check de `main` (job `frontend`),
      # donc BLOQUANT AU MERGE, mais `frontend` n'est pas dans les `needs` de `build-docker`
      # (une perte de 1 % ne bloque pas une image de prod urgente).
      - name: Unit tests + coverage (Vitest, cliquet)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report (frontend)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  # A18: blocking dependency-vulnerability audits, deliberately isolated in their OWN
  # job (no `needs`, and NOT a dependency of build-docker). A newly-disclosed advisory
  # against an unchanged package therefore reds only THIS check — which requires human
  # triage (bump the dep, or explicitly ignore the advisory) — without gating the image
  # build or the functional jobs on a commit that changed nothing.
  # SEC A19 (2026-08-05) — Gitleaks sur TOUT l'historique, BLOQUANT, sans needs
  # (même forme que dependency-audit) : un secret commité doit rougir dans la
  # minute — chaque heure passée exige de le révoquer. Les findings historiques
  # analysés vivent dans .gitleaks.toml, jamais d'élargissement « pour passer ».
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-24.04
    # docker login ghcr — image miroir gitleaks, P4-92 (contents:read répété : un bloc de job REMPLACE la racine)
    permissions:
      contents: read
      packages: read
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # P4-92 — image tirée de NOTRE miroir ghcr (GitHub-interne : un 503 Docker
      # Hub ne rougit plus ce gate — vécu le 2026-08-11). Bump de version =
      # mettre à jour ICI et dans mirror-images.yml, relancer ce workflow-là.
      - name: Login to ghcr.io (mirror pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/maratech-fr/mirror-gitleaks:v8.30.0
          git /repo --no-banner -c /repo/.gitleaks.toml

  # SEC-14 (2026-08-05) — Semgrep PROMU EN GATE après triage des 69 findings
  # initiaux (corrigés ou justifiés : .semgrepignore + nosemgrep inline motivés).
  # Zéro token IA — le filet qui remplace la revue systématique retirée du
  # cycle. Un nouveau finding = --error → rouge.
  semgrep:
    name: Semgrep (security gate)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run semgrep
        run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest
          semgrep scan --config p/default --config p/security-audit
          --config p/react --config p/python --config p/php
          --error --timeout 120 --metrics=off
          --exclude 'node_modules' --exclude 'vendor' --exclude 'var'

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # PHP — reads composer.lock, no vendor install needed. --abandoned=ignore: an
      # abandoned package is not a vulnerability (Composer 2.7+ would fail on it by default).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Composer audit
        working-directory: backend
        # audit-retry : relance seulement sur endpoint indisponible, jamais sur une vulnérabilité (P4-171).
        run: ../.github/scripts/audit-retry.sh composer audit --locked --no-interaction --abandoned=ignore

      # Node — reads package-lock, no install needed. All deps are scanned (a runtime lib
      # misfiled under devDependencies still ships to browsers), gated at high+ so an
      # unfixable low/moderate advisory doesn't block every unrelated PR.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: ../.github/scripts/audit-retry.sh npm audit --audit-level=high

      # Python — audit the ENGINE IMAGE's actual installed versions (what ships), not a
      # fresh unpinned resolve. `pip freeze` omits pip/setuptools tooling by default, and
      # auditing the frozen list via an isolated pipx-run pip-audit means the tool never
      # perturbs (upgrades) the set it is meant to check. The local non-PyPI package is stripped.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: pip-audit
        run: |
          docker compose build engine
          docker compose run --rm --no-deps engine pip freeze | grep -vE '^(-e |clubscheduler-engine)' > engine-deps.txt
          .github/scripts/audit-retry.sh pipx run pip-audit --requirement engine-deps.txt

  # Static analysis AND code style. CS-Fixer lives here rather than in the `lint`
  # job because it needs the PHP container this job already pays for (that job has
  # no PHP setup at all — it lints docker-compose + the Makefile in ~5 s). Same
  # gate either way: both feed `blocking-tests`.
  # Until 2026-07-17, CS-Fixer ran NOWHERE in CI — combined with the dormant
  # pre-commit hook (roadmap P4-11), nothing guarded PHP code style, and main was
  # merged red on it twice (PRs #241 and #244).
  phpstan:
    name: PHPStan & CS-Fixer
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Run PHPStan
        run: docker compose exec -T php-fpm composer phpstan

      # Same command as `make -C backend cs` — dry-run, so CI reports the diff
      # instead of rewriting files. Fix locally with `make -C backend cs-fix`.
      - name: Run PHP-CS-Fixer (dry-run)
        run: docker compose exec -T php-fpm composer cs-fix -- --dry-run --diff

      # Garde d'hygiène des dépendances : composer-unused rougit sur un paquet de
      # `require` dont plus aucun symbole n'est utilisé dans src/. Les faux positifs
      # câblés par bundle/config/runtime sont ignorés EXPLICITEMENT, chacun avec sa
      # raison (`backend/composer-unused.php`).
      - name: Run composer-unused
        run: docker compose exec -T php-fpm composer composer-unused

  # P4-24 : Rector dans son PROPRE job, sans `needs` et sans être
  # une dépendance de quoi que ce soit — exactement la forme de `dependency-audit`,
  # et pour la même raison. `rector.php` tire ses règles des versions INSTALLÉES
  # (`withComposerBased`, `withPreparedSets`) : un bump dependabot peut donc élargir
  # une règle et rougir ce check sur un commit qui n'a rien changé. Le mettre dans
  # `phpstan` ferait sauter `blocking-tests` (isolation tenant/RLS) et `build-docker`
  # pour de la dérive de STYLE — un signal de forme prendrait le déploiement en otage.
  # Ici il rougit seul, demande un arbitrage humain, et ne bloque ni tests ni images.
  # ⚠ POUR QU'IL BLOQUE LE MERGE, il faut ajouter le contexte « Rector (style gate) »
  # aux required status checks de `main` (réglage repo). Sans ça il rougit sans
  # empêcher quoi que ce soit — c'est le piège de sortir une étape d'un job requis.
  rector:
    name: Rector (style gate)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      # Dry-run : la CI rapporte le diff, elle ne réécrit pas. Pour CORRIGER en
      # local : `docker compose exec php-fpm sh -c 'cd /app/backend && composer rector'`
      # (`make -C backend rector` est lui aussi un dry-run — il montre, il ne fixe pas).
      - name: Run Rector (dry-run)
        run: docker compose exec -T php-fpm composer rector -- --dry-run

  blocking-tests:
    name: Blocking Tests
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    needs: [lint, phpstan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # L'axe auth/memberships : sans ce test dans le gate BLOQUANT, une
      # re-suppression de `eraseCredentials` (bump Rector + `make rector` pour
      # verdir le job de style) passe tous les checks requis.
      - name: UserInterfaceContractTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Unit/Entity/UserInterfaceContractTest.php --group phase1'

      # Axe auth/memberships (P4-263) : le refus de connexion parle français
      # (« Identifiants invalides. » via le socle de traduction) ET reste
      # byte-identique entre mauvais mot de passe et compte non vérifié
      # (anti-énumération). Sans ce gate, retirer symfony/translation ou donner un
      # message distinct à l'un des deux chemins passerait les checks requis.
      - name: LoginFailureCopyTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/LoginFailureCopyTest.php --group phase1'

      # Axe auth & memberships — la connexion démo ne s'ouvre que pendant sa fenêtre
      # d'activation : hors fenêtre, un compte démo est refusé d'une manière byte-identique
      # à un mauvais mot de passe (aucun oracle) ; dans la fenêtre il se connecte. Sans ce
      # gate, une régression rendrait la garde silencieuse et la démo joignable en prod.
      - name: DemoWindowTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/DemoWindowTest.php --group phase1'

      # Axes auth & memberships + tenant isolation — la console démo (PR B du lot Démos) : un JWT
      # club ne franchit pas /api/admin/demos, toute écriture exige le CSRF, activate ouvre une
      # fenêtre de 4 h à l'horloge RÉELLE (re-clic = redémarrage, jamais addition), le reset remet
      # simulated_today à null SANS toucher la fenêtre ni un autre club démo, et le re-seed refuse de
      # purger un club non-démo tenant ARA9999999 (un vrai club n'est jamais détruit).
      - name: AdminDemoResetTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Admin/AdminDemoResetTest.php --group phase1'

      # Axes auth & memberships + tenant isolation — le widget d'horloge du compte DÉMO
      # (POST /api/club/clock) : un gestionnaire d'un club démo pose/relâche l'horloge, un membre
      # non gestionnaire est refusé (403), un gestionnaire d'un VRAI club est refusé (403) et son
      # horloge reste intacte, date malformée 422, le clear relâche ET vide la boîte, et poser
      # l'horloge d'un club n'en touche jamais un autre.
      - name: ClubClockEndpointTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Api/ClubClockEndpointTest.php --group phase1'

      # Axe tenant isolation — la purge nocturne des démos prospect : le club démo de la veille est
      # détruit (FFBB libéré), mais un démo du jour, un démo partagé, un vrai club et la démo BCCL
      # permanente ne bougent jamais. Sans ce gate, un élargissement du prédicat détruirait un vrai
      # club ou la démo permanente en silence.
      - name: DemoPurgeStaleCommandTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Command/DemoPurgeStaleCommandTest.php --group phase1'

      # Axe auth & memberships — P4-294, conserver 14 j le club démo d'un prospect puis le reprendre
      # par l'approbation P3-4 : « Conserver » refusé (409) fenêtre ouverte, accepté fermée (animateur
      # détaché, horloge nulle, échéance posée) ; l'approbation reprend le club conservé homonyme
      # (is_demo=false, crédits 0, gestionnaire actif, nom conservé, jamais un 2e club) ; un club RÉEL
      # du même code garde la priorité ; deux conservés même code → le plus récent ; la purge détruit un
      # conservé expiré, épargne un non expiré et un repris. Sans ce gate, un club conservé deviendrait
      # immortel, ou l'approbation créerait un club neuf au lieu de reprendre l'espace de la démo.
      - name: DemoRetainedClubReclaimTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/DemoRetainedClubReclaimTest.php --group phase1'

      # Axe auth & memberships — chemin d'abus « export anonyme » : les DEUX routes d'export d'un
      # planning (export-pdf async ET export-xlsx sync) sont derrière le firewall JWT (401 sans
      # session) et rien n'est enfilé. Sans ce gate, ouvrir une route d'export en anonyme (un
      # planning PDF/XLSX divulgué) passerait tous les checks requis de `main`.
      - name: ExportAuthenticationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ExportAuthenticationTest.php --group phase1'

      # Axe tenant isolation (P4-357) — le rendu PDF se télécharge par la route AUTHENTIFIÉE
      # GET /api/schedules/{id}/export-pdf/{filename}, plus par une URL statique publique. Un club B
      # visant l'URL d'un rendu du club A obtient un 404 byte-identique à un planning inconnu (aucune
      # divulgation d'existence), une traversée / un nom hors motif / le nom d'un autre planning sont
      # refusés 404, et le disque reste intact. Sans ce gate, un rendu PDF d'un autre club serait
      # téléchargeable par énumération d'URL et passerait tous les checks requis de `main`.
      - name: ExportPdfDownloadIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ExportPdfDownloadIsolationTest.php --group phase1'

      # Axes auth & memberships + tenant isolation (D3) — un cookie de session JWT mort ne bloque
      # plus les pages publiques : sur une route PUBLIC_ACCESS du firewall `api`, le cookie BEARER et
