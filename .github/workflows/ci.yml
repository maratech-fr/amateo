name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Lint Docker Compose
        run: docker compose config > /dev/null

      - name: Lint Makefile
        run: make -n help

  # Frontend gate: until now the frontend had NO CI coverage — only the e2e job
  # touched it via `npm run dev` (Vite, no typecheck). A broken production build
  # (`tsc -b`) and failing Vitest units both slipped through. This job closes
  # that gap: typecheck + production build + unit tests on every PR.
  frontend:
    name: Frontend (build + unit)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc -b + vite)
        working-directory: frontend
        run: npm run build

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npx vitest run

  # P4-166 (B5) — la couverture frontend est un required check À PART : elle rougit
  # seule si la couverture de lignes descend sous le plancher versionné
  # (`coverage-floor.json`, lu par `vitest.config.ts` → `thresholds.lines`), sans jamais
  # entrer dans les `needs` de `build-docker` (une perte de 1 % ne bloque pas une image de
  # prod urgente). Même patron/SHA que le job `frontend` (setup-node + npm ci sur l'hôte).
  frontend-coverage:
    name: Frontend Coverage (cliquet)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 15
    needs: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Coverage (frontend) + cliquet
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report (frontend)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  # A18: blocking dependency-vulnerability audits, deliberately isolated in their OWN
  # job (no `needs`, and NOT a dependency of build-docker). A newly-disclosed advisory
  # against an unchanged package therefore reds only THIS check — which requires human
  # triage (bump the dep, or explicitly ignore the advisory) — without gating the image
  # build or the functional jobs on a commit that changed nothing.
  # SEC A19 (2026-08-05) — Gitleaks sur TOUT l'historique, BLOQUANT, sans needs
  # (même forme que dependency-audit) : un secret commité doit rougir dans la
  # minute — chaque heure passée exige de le révoquer. Les findings historiques
  # analysés vivent dans .gitleaks.toml, jamais d'élargissement « pour passer ».
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # P4-92 — image tirée de NOTRE miroir ghcr (GitHub-interne : un 503 Docker
      # Hub ne rougit plus ce gate — vécu le 2026-08-11). Bump de version =
      # mettre à jour ICI et dans mirror-images.yml, relancer ce workflow-là.
      - name: Login to ghcr.io (mirror pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/maratech-fr/mirror-gitleaks:v8.30.0
          git /repo --no-banner -c /repo/.gitleaks.toml

  # SEC-14 (2026-08-05) — Semgrep PROMU EN GATE après triage des 69 findings
  # initiaux (corrigés ou justifiés : .semgrepignore + nosemgrep inline motivés).
  # Zéro token IA — le filet qui remplace la revue systématique retirée du
  # cycle. Un nouveau finding = --error → rouge.
  semgrep:
    name: Semgrep (security gate)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run semgrep
        run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest
          semgrep scan --config p/default --config p/security-audit
          --config p/react --config p/python --config p/php
          --error --timeout 120 --metrics=off
          --exclude 'node_modules' --exclude 'vendor' --exclude 'var'

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # PHP — reads composer.lock, no vendor install needed. --abandoned=ignore: an
      # abandoned package is not a vulnerability (Composer 2.7+ would fail on it by default).
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Composer audit
        working-directory: backend
        # audit-retry : relance seulement sur endpoint indisponible, jamais sur une vulnérabilité (P4-171).
        run: ../.github/scripts/audit-retry.sh composer audit --locked --no-interaction --abandoned=ignore

      # Node — reads package-lock, no install needed. All deps are scanned (a runtime lib
      # misfiled under devDependencies still ships to browsers), gated at high+ so an
      # unfixable low/moderate advisory doesn't block every unrelated PR.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: ../.github/scripts/audit-retry.sh npm audit --audit-level=high

      # Python — audit the ENGINE IMAGE's actual installed versions (what ships), not a
      # fresh unpinned resolve. `pip freeze` omits pip/setuptools tooling by default, and
      # auditing the frozen list via an isolated pipx-run pip-audit means the tool never
      # perturbs (upgrades) the set it is meant to check. The local non-PyPI package is stripped.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: pip-audit
        run: |
          docker compose build engine
          docker compose run --rm --no-deps engine pip freeze | grep -vE '^(-e |clubscheduler-engine)' > engine-deps.txt
          .github/scripts/audit-retry.sh pipx run pip-audit --requirement engine-deps.txt

  # Static analysis AND code style. CS-Fixer lives here rather than in the `lint`
  # job because it needs the PHP container this job already pays for (that job has
  # no PHP setup at all — it lints docker-compose + the Makefile in ~5 s). Same
  # gate either way: both feed `blocking-tests`.
  # Until 2026-07-17, CS-Fixer ran NOWHERE in CI — combined with the dormant
  # pre-commit hook (roadmap P4-11), nothing guarded PHP code style, and main was
  # merged red on it twice (PRs #241 and #244).
  phpstan:
    name: PHPStan & CS-Fixer
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Run PHPStan
        run: docker compose exec -T php-fpm composer phpstan

      # Same command as `make -C backend cs` — dry-run, so CI reports the diff
      # instead of rewriting files. Fix locally with `make -C backend cs-fix`.
      - name: Run PHP-CS-Fixer (dry-run)
        run: docker compose exec -T php-fpm composer cs-fix -- --dry-run --diff

  # P4-24 : Rector dans son PROPRE job, sans `needs` et sans être
  # une dépendance de quoi que ce soit — exactement la forme de `dependency-audit`,
  # et pour la même raison. `rector.php` tire ses règles des versions INSTALLÉES
  # (`withComposerBased`, `withPreparedSets`) : un bump dependabot peut donc élargir
  # une règle et rougir ce check sur un commit qui n'a rien changé. Le mettre dans
  # `phpstan` ferait sauter `blocking-tests` (isolation tenant/RLS) et `build-docker`
  # pour de la dérive de STYLE — un signal de forme prendrait le déploiement en otage.
  # Ici il rougit seul, demande un arbitrage humain, et ne bloque ni tests ni images.
  # ⚠ POUR QU'IL BLOQUE LE MERGE, il faut ajouter le contexte « Rector (style gate) »
  # aux required status checks de `main` (réglage repo). Sans ça il rougit sans
  # empêcher quoi que ce soit — c'est le piège de sortir une étape d'un job requis.
  rector:
    name: Rector (style gate)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      # Dry-run : la CI rapporte le diff, elle ne réécrit pas. Pour CORRIGER en
      # local : `docker compose exec php-fpm sh -c 'cd /app/backend && composer rector'`
      # (`make -C backend rector` est lui aussi un dry-run — il montre, il ne fixe pas).
      - name: Run Rector (dry-run)
        run: docker compose exec -T php-fpm composer rector -- --dry-run

  blocking-tests:
    name: Blocking Tests
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    needs: [lint, phpstan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # L'axe auth/memberships : sans ce test dans le gate BLOQUANT, une
      # re-suppression de `eraseCredentials` (bump Rector + `make rector` pour
      # verdir le job de style) passe tous les checks requis.
      - name: UserInterfaceContractTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Unit/Entity/UserInterfaceContractTest.php --group phase1'

      # Coûte 0,2 s et attrape une classe de défaut qui a ATTEINT `main` le 2026-08-21
      # (marqueurs de `git stash pop` commités dans un journal Markdown, PR #682) : rien
      # d'autre ne la voit — ni linter, ni test, ni revue humaine sur un diff de prose.
      - name: NoMergeConflictMarkerTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Unit/NoMergeConflictMarkerTest.php --group phase1'

      # NOTE : `SymfonyStackAlignmentTest` (dérive du stack hors LTS 7.4) tourne
      # dans `unit-tests`, PAS ici. Une chaîne de version n'a pas sa place dans
      # le job qui gate `build-docker` : un bump dependabot remontant un split
      # Symfony ferait rougir `blocking-tests` AVANT même que
      # TenantIsolationTest/RlsIsolationTest ne s'exécutent (étapes suivantes du
      # même job), et bloquerait le déploiement du correctif de sécurité que ce
      # bump apportait. C'est la raison exacte pour laquelle Rector a quitté le
      # job `phpstan` (P4-24 b) et pour laquelle `dependency-audit` n'a pas de
      # `needs` : une dérive de dépendance se signale, elle ne prend pas la
      # livraison en otage.

      - name: TenantIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/TenantIsolationTest.php --group phase1'

      - name: SeasonIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonIsolationTest.php --group phase1'

      - name: SeasonReadonlyTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonReadonlyTest.php --group phase1'

      - name: MatchTenantIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/MatchTenantIsolationTest.php --group phase1'

      - name: TenantCacheIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/TenantCacheIsolationTest.php --group phase1'

      - name: ConcurrentGenerationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Queue/ConcurrentGenerationTest.php --group phase1'

      - name: ContractSchemaTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/ContractSchemaTest.php --group phase1'

      - name: PayloadVersionMatchesContractVersionTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/PayloadVersionMatchesContractVersionTest.php --group phase1'

      - name: ValidateAssignmentsContractSchemaTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/ValidateAssignmentsContractSchemaTest.php --group phase1'

      - name: RlsIsolationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/RlsIsolationTest.php --group phase1'

      - name: ClubUserAccessTests
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ClubAccessTest.php tests/Security/UserSelfOnlyTest.php tests/Security/ImportAuthorizationTest.php --group phase1'

      - name: MercureHardeningTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/MercureHardeningTest.php --group phase1'

      - name: ManagementRoleTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ManagementRoleTest.php --group phase1'

      - name: ApiRateLimitTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ApiRateLimitTest.php --group phase1'

      # P5-3a — parité anti-énumération du rail mot de passe (hash factice, mail par le bus, 429 reset).
      - name: PasswordResetEnumerationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PasswordResetEnumerationTest.php --group phase1'

      # P5-3b — Turnstile sur le register (NR d'axe auth) : inerte sans secret, 403 fail-closed
      # sur verdict, fail-open sur panne transport, 403 identique frais/connu, rate-limit prioritaire.
      - name: RegisterTurnstileTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/RegisterTurnstileTest.php --group phase1'

      # P4-45 — le pendant PAR CLUB de SEC-11. Step nommé, donc réellement bloquant :
      # porter `phase1` ne suffit pas (cf. le commentaire P2-9ter plus bas).
      - name: ClubQuotaTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ClubQuotaTest.php --group phase1'

      - name: SuperAdminAccessTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SuperAdminAccessTest.php --group phase1'

      - name: EngagedTeamGuardTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/EngagedTeamGuardTest.php --group phase1'

      - name: PeriodPlanBirthTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PeriodPlanBirthTest.php --group phase1'

      # « L'adaptation naît comme une copie du socle » (axes generation pipeline + planning
      # lifecycle) : la V1 d'un plan de période transcrit la version pointée du socle, filtrée des
      # réglages/fermetures de la période — falsifié dans les deux sens, avec la liste « à replacer ».
      - name: PeriodCopyBirthTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PeriodCopyBirthTest.php --group phase1'

      # P2-44 PR-5 (axes generation pipeline + planning lifecycle) : les écarts NOMMÉS entre une
      # version affichée d'un plan de FERMETURE et la version pointée du socle — séances déplacées
      # (appariement chronologique) et non replacées (raison SERVIE par la sélection, null quand
      # inexpliquée). Falsifié dans les deux sens, plus les refus (422 saison/vacances, 409 non
      # COMPLETED / socle non pointé, tenant) et la lecture ouverte au Membre.
      - name: SocleDeviationParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SocleDeviationParityTest.php --group phase1'

      # P2-38 prévention (axe planning lifecycle — ADR-0002 inv. 4) : la route de lecture
      # GET /api/planned-windows sert EXACTEMENT les fenêtres que la garde d'écriture refuse
      # en 409 window_already_planned — même prédicat par construction (foyer unique
      # governingWindows), prouvé par le comportement, falsifié dans les deux sens. Plus la
      # famille (ni servie ni refusée), l'isolation saison/club (404), le chevauchement partiel
      # aux bornes, le chemin pending (seasonId) et la lecture ouverte au Membre.
      - name: PlannedWindowsParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PlannedWindowsParityTest.php --group phase1'

      # RMM-3 (axe constraint semantics — le radar de conflits) : le gardien à l'ouverture stampe une
      # référence de VISITE et sert le delta « depuis ta dernière visite ». L'empreinte d'un conflit est
      # son IDENTITÉ stable — une nature changée (autre paire, MATCH_MATCH→MATCH_TRAINING) est signalée,
      # une sévérité/segment ou un compteur qui bougent SEULS ne le sont pas. Falsifié dans les deux sens,
      # plus l'isolation user (le stamp d'Anna n'éteint pas le delta de Mateo) + club + saison, le F5 dans
      # la grâce (référence intacte), planningChanged dans les deux sens, le Membre autorisé, la première
      # visite muette, et la saison archivée qui stampe quand même.
      - name: MatchVisitDeltaParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/MatchVisitDeltaParityTest.php --group phase1'

      - name: SeasonVersionUniquenessTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonVersionUniquenessTest.php --group phase1'

      - name: SeasonPlanInForceTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SeasonPlanInForceTest.php --group phase1'

      # P2-14 (axe constraint semantics) : le gate pré-solve valide EXACTEMENT le jeu de
      # contraintes que le payload sérialise — parité tenue par la source unique
      # PeriodConstraintSelector, plus par deux copies manuelles.
      - name: PeriodGatePayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PeriodGatePayloadParityTest.php --group phase1'

      # P2-9 PR A (axe constraint semantics) : le volet capacité du récap, dans les deux
      # sens — les nombres viennent du payload du solveur, jamais d'un recalcul à la main.
      - name: RecapCapacityWarningTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/RecapCapacityWarningTest.php --group phase1'

      - name: CoachDoubleBookingTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/CoachDoubleBookingTest.php --group phase1'

      # P2-2 F2b (axes planning lifecycle + constraint semantics) : un déplacement de créneau
      # ne s'écrit QUE si le moteur l'accepte — un verdict « non » ne modifie pas le planning,
      # la source est retirée de la baseline, et une génération en cours refuse (409). Le moteur
      # est moqué : on garde que le BACKEND honore le verdict (le contrat cross-stack garde le reste).
      - name: SlotMoveVerdictTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SlotMoveVerdictTest.php --group phase1'

      # P2-30 PR A (axes planning lifecycle + constraint semantics) : PLACER une séance à la
      # dérive (une séance qui n'existait pas) passe sous le verdict — refus = rien créé, accepté
      # = ligne DÉVERROUILLÉE + marqueur, 409 pendant une génération (moteur jamais appelé) et sur
      # la version choisie, tenant (planning/équipe d'un autre club refusés). Pendant de /move
      # pour la création ; le moteur est moqué (le contrat cross-stack garde le reste).
      - name: SlotPlacementVerdictTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SlotPlacementVerdictTest.php --group phase1'

      # Résidu de P2-43 — la garde PRÉCOCE de move() sur la grille : ce que l'écran Gymnases
      # OFFRE, le serveur l'accepte ; ce qu'il n'offre pas (triplet inexistant, jour fermé), il le
      # refuse sans appeler le moteur ; la durée écrite est TOUJOURS celle de l'emplacement, jamais
      # celle qui voyageait avec l'équipe. Compteur de requêtes moteur, saison ET période.
      - name: SlotMoveGridParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SlotMoveGridParityTest.php --group phase1'

      # P2-9ter — le fichier portait déjà #[Group('phase1')] sans qu'AUCUN step de CE job
      # ne le lance : il tournait bien, mais dans `unit-tests` (qui exécute `phpunit
      # tests/`) — c'est-à-dire APRÈS `blocking-tests` et sans gater `build-docker`. Il ne
      # jouait donc pas le rôle de gate bloquant que son groupe annonçait. Il porte les NR
      # « le build n'écrit pas », « le write-path écrit vraiment », « ordre des tags
      # déterministe », « un seul chemin de calcul » et « cache scopé par saison ».
      - name: ScheduleConstraintBuilderOverlayTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/ScheduleConstraintBuilderOverlayTest.php --group phase1'

      # P1-3 PR B — le pool de crédits de sortie du plan Découverte + les caps payants aux
      # portes de création d'équipes. Axes generation pipeline + auth/périmètre : le refus
      # avant solve, le décompte au succès (pool PAR CLUB, partagé/isolé), et le cap payant.
      - name: PlanEntitlementsTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PlanEntitlementsTest.php --group phase1'

      # P1-1 PR B (axe auth & memberships) : deux rôles assignables (Gestionnaire/Membre),
      # le cycle de vie désactiver/réactiver, et l'invariant « au moins un gestionnaire
      # actif » tenu sous verrou — un membre lit tout, seul le management écrit et pilote.
      - name: MemberRoleTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/MemberRoleTest.php --group phase1'

      # P2-8 PR A (axe planning lifecycle) : PARITÉ capacité affichée == verdict du refus.
      # Le bloc `capabilities` sérialisé sur chaque Schedule est calculé par le MÊME code que
      # les gardes d'écriture (ScheduleCapabilityResolver) — canDelete/canValidate/
      # canRegenerateFrom et les deux compteurs annoncent EXACTEMENT ce que DELETE/validate/
      # regenerate-from FONT. Sans ce gate, une dérive serveur↔serveur (capacité ≠ refus)
      # passerait, et le front (PR B) afficherait un bouton que le serveur rejette.
      - name: ScheduleCapabilityParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ScheduleCapabilityParityTest.php --group phase1'

      # DOC-3, tranché le 2026-08-11 (option (a) : en faire un step). Le fichier se
      # sous-titrait « NR BLOQUANT — SÉMANTIQUE DE CONTRAINTE » depuis P4-42 sans qu'aucun
      # step ne le lance : il bloquait le merge via `unit-tests` (contexte requis de main),
      # mais PAS `build-docker` — l'image se construisait sur une base rouge, et le verdict
      # arrivait tard. Même écart que P2-9ter, même correctif.
      # Ce qu'il garde : la PORTÉE d'un tag, c'est-à-dire ce que le solveur applique
      # vraiment — `resolveTagToTeamIds` éclate un `targetTag` en N contraintes TEAM dans le
      # payload. Les frontières d'âge (BABY/EMB/JEUNE, P4-42), la réutilisation d'un tag
      # homonyme non-système, l'unicité en base (P4-64), et depuis P4-50 le fait qu'éditer
      # une `SportCategory` retague ses équipes.
      - name: TeamTagScopeTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/TeamTagScopeTest.php --group phase1'

      # F1 (axes planning lifecycle + constraint semantics) : la PROVENANCE d'un verrou de
      # créneau est VRAIE. Un verrou né d'une réservation se lit RESERVATION, un épinglage
      # manuel MANUAL, et un verrou d'origine indécidable UNKNOWN — jamais deviné. Sans ce
      # gate, une dérive (deviner RESERVATION, ou downgrader une réservation en MANUAL)
      # rendrait le gestionnaire confiant à tort sur ce qu'il peut retirer.
      - name: LockOriginProvenanceTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Service/LockOriginProvenanceTest.php --group phase1'

      # F2c (axe planning lifecycle) : une contrainte modifiée APRÈS génération marque les
      # plannings COMPLETED du club+saison comme PÉRIMÉS (état en base), et un import de
      # résultat solveur les démarque. Le marquage passe par un listener d'entité (tout writer,
      # même hors API) et respecte la frontière saison. Sans ce gate, l'application remettrait à
      # afficher un planning comme courant alors qu'une règle a changé sous lui — le bug de
      # confiance qui a fait perdre foi dans le produit.
      - name: ConstraintChangeStaleScheduleTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Service/ConstraintChangeStaleScheduleTest.php --group phase1'

      # P4-87 (axe planning lifecycle) : une contrainte n'est pas la seule entrée du solveur.
      # Un gymnase, un coach, un créneau/grille de période, une réservation, un override, un tag
      # ou une entrée de calendrier modifiés APRÈS génération marquent les plannings COMPLETED
      # comme PÉRIMÉS (état en base), un import démarque. Le CŒUR est ADR-0002 : le périmètre se
      # dérive MÉCANIQUEMENT de schedule_plan_id — la grille SAISON ne périme pas les COPIES de
      # période, et inversement. Sans ce gate, un planning serait périmé sans le dire pour toutes
      # ces raisons — le défaut de confiance qu'on a réparé pour les contraintes, resté ouvert.
      - name: ResourceChangeStaleScheduleTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Service/ResourceChangeStaleScheduleTest.php --group phase1'

      # P3-16 + DOC-2 (axes planning lifecycle + périmètre engagé) : supprimer une salle, une
      # équipe ou un coach détruit en cascade — et la modale annonçait, depuis le cache du
      # navigateur, une FRACTION de ce qui partait (2 familles sur 10 pour un gymnase, matchs
      # déjà déclarés à la fédération compris). Ce gate tient la maison unique : `CascadePlan`
      # est exécuté par le deleter ET compté par l'impact, aucune destruction ne peut être
      # ajoutée sans son annonce, et aucun DQL ne peut re-contourner le plan.
      - name: DeletionImpactParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Service/DeletionImpactParityTest.php --group phase1'

      # P2-28 PR 2 (axe backend↔engine contract + constraint semantics) : les 4 règles implicites
      # « bien-être » sont réglables par club/saison (intensité HARD/PREFERRED + seuils). Ce que le
      # gestionnaire STOCKE doit être EXACTEMENT le bloc `implicitRules` que le payload émet au
      # solveur — défauts résolus compris, sur le chemin base ET le chemin overlay de période
      # (season-scopé, ADR-0002). Sans ce gate, un réglage assoupli pourrait être stocké sans jamais
      # atteindre le solveur (ou l'inverse), en silence — le solveur appliquerait autre chose que ce
      # que l'écran annonce.
      - name: ImplicitRulePayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/ImplicitRulePayloadParityTest.php --group phase1'

      # P3-21 PR B — le placement précédent ÉMIS au moteur (terme de stabilité) doit être
      # EXACTEMENT les placements de la version source en base, et NE PAS entrer dans le hash
      # de snapshot (sinon snapshotHash diverge de currentStructureHash à chaque régénération).
      - name: PreviousAssignmentsPayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/PreviousAssignmentsPayloadParityTest.php --group phase1'

      # PR-3 (axes generation pipeline + backend↔engine contract) : en COMBLEMENT seulement, la
      # référence socle ÉMISE au moteur == les placements de la version POINTÉE du socle (cross-plan),
      # {teamId, dayOfWeek, startTime} SANS venueId ; hors fill, rien n'est émis ; et le bloc N'ENTRE
      # PAS dans le hash de snapshot — falsifié dans les deux sens.
      - name: SocleReferencePayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SocleReferencePayloadParityTest.php --group phase1'

      # P2-51 PR-2 : ce qui est STOCKÉ (blocs de mutualisation {équipes, K}, ancrés au plan) == le
      # bloc `sharedBlocks` émis au moteur, socle ET période, portée dérivée du plan (ADR-0002),
      # membre hors roster filtré + bloc tombé sous 2 abandonné — falsifié dans les deux sens (un
      # bloc stocké apparaît, un bloc d'une autre portée ne fuit pas).
      - name: SharedBlockPayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SharedBlockPayloadParityTest.php --group phase1'

      # Lot PASSERELLES PR-1 : ce qui est STOCKÉ (passerelles club+saison {teamAId, teamBId,
      # intensity}) == le bloc `teamLinks` émis au moteur, socle ET période, FILTRÉ au roster —
      # falsifié dans les deux sens (une passerelle stockée apparaît avec son intensité, un lien
      # nommant une équipe hors roster de période ne fuit pas).
      - name: TeamLinkPayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/TeamLinkPayloadParityTest.php --group phase1'

      # P2-53 RMM-8 PR-2 : ce qui est STOCKÉ (matrice de trajet {venueAId, venueBId, driving,
      # walking}, STRUCTURE club+saison) == le bloc `venueTravelTimes` émis au moteur, TRIÉ ; et sa
      # présence — et elle seule — active la règle implicite `travelTime` (opt-in au 1er geste,
      # jamais silencieux). Falsifié dans les deux sens (ligne stockée émise triée + coach véhiculé ;
      # matrice d'un autre club ne fuit pas ; club sans matrice = bloc [] ET règle inactive).
      - name: VenueTravelTimePayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/VenueTravelTimePayloadParityTest.php --group phase1'

      # RMM-5 (P2-49) rotation A/B PR-2 : ce qui est STOCKÉ (créneaux de match partagés
      # {venue, jour, heure, membres}) == le bloc `slotRotations` émis au moteur, et la SUPPLÉANCE
      # retire l'habitude d'un membre le MÊME jour que sa rotation — jamais les autres. Falsifié
      # dans les deux sens (rotation stockée émise, rotation d'un autre club ne fuit pas, habitude
      # même-jour supplantée / autre jour conservée, sans rotation bloc [] + habitudes intactes).
      - name: SlotRotationPayloadParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SlotRotationPayloadParityTest.php --group phase1'

      # RMM-6 (P2-50) échéances ligue/comité PR-1 : le défaut communautaire vit dans une table
      # PARTAGÉE entre clubs (`shared_competition_deadline`) — la seule surface du module matchs qui
      # traverse la frontière tenant. Ce gate tient l'invariant de partage : le SCHÉMA du partagé
      # n'a AUCUNE colonne club-identifiante (assertion sur le catalogue Postgres), un club apparié à
      # la même compétition fédérale LIT la proposition et un club apparié à une autre NON, la valeur
      # club gagne toujours, la réponse servie est BYTE-IDENTIQUE quel que soit l'auteur (zéro
      # oracle), dernière écriture gagne sans toucher le premier club, les gardes (management 403,
      # tenant 422, saison archivée 409), et l'outlook J-7 ne STAMPE pas la visite. Falsifié dans les
      # deux sens. Sans ce gate, une colonne club_id pourrait se glisser dans le partagé (fuite
      # tenant) ou l'écrasement piétiner une valeur club souveraine, en silence.
      - name: EntryDeadlineShareTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/EntryDeadlineShareTest.php --group phase1'

      # P2-54 RMM-9 annuaire adverse PR-2 : la localisation d'un adversaire vit dans une table
      # PARTAGÉE entre clubs (`opponent_directory`) — surface qui traverse la frontière tenant.
      # Ce gate tient l'invariant de partage : le SCHÉMA n'a AUCUNE colonne club-identifiante
      # (catalogue Postgres, liste blanche exacte), une entrée est visible et BYTE-IDENTIQUE quel
      # que soit le club lecteur (aucun filtre tenant, aucune RLS), le rôle amateo_app a
      # SELECT+INSERT+UPDATE mais PAS DELETE (seule couche DB d'une table sans RLS), et une
      # résolution plus précise (VENUE) remplace une moins précise (CITY) jamais l'inverse.
      # Falsifié dans les deux sens. Sans ce gate, une colonne club_id/provenance pourrait se
      # glisser dans le partagé (fuite tenant, vecteur A21/BCK-18), en silence.
      - name: OpponentDirectoryShareTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/OpponentDirectoryShareTest.php --group phase1'

      # P2-54 RMM-9 correctif sécu 2026-08-28 : garde l'invariant COMPORTEMENTAL du résolveur —
      # un label de salle xlsx (fourni par le club, texte libre) ne peut établir une précision
      # VENUE dans la table partagée `opponent_directory` ; seul le hit API autoritatif
      # (directVenue) le peut. Falsifié dans les deux sens (observation xlsx directVenue=null →
      # CITY jamais VENUE, même index de salles rendant un appariement parfait ; observation API
      # directVenue peuplé → VENUE). Le gate SCHÉMA voisin ne couvre PAS cette règle. Sans ce gate,
      # l'empoisonnement permanent de la revue sécurité revient en silence.
      - name: OpponentLocationResolverTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Service/Basketball/OpponentLocationResolverTest.php --group phase1'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    needs: blocking-tests
    steps:
      # fetch-depth: 0 — DocStampFreshnessTest compare chaque « Last verified » à la date du
      # dernier commit ayant touché le fichier. Un clone superficiel ne connaît qu'un commit :
      # le test se saborderait en skip (il le dit) et le garde ne verrait plus rien.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      - name: Run unit tests
        # SEC-13 : le groupe `contract` a QUITTÉ ce job pour « Engine semantics »
        # (dédié, sans needs). Ce sont les tests qui interrogent le VRAI moteur —
        # une autre question que « le code unitaire tient-il ? », noyée ici parmi
        # plus d'un millier de tests, donc invisible quand elle tombait.
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/ --exclude-group contract'

  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        run: docker compose build engine

      - name: Run pytest
        run: docker compose run --rm engine pytest

      - name: Run ruff
        run: docker compose run --rm engine ruff check .

      # P4-64 — le formatage est GARDÉ, pas seulement disponible. Sans ce pas, `ruff check`
      # (lint) passait sur un arbre dont 41 fichiers sur 70 n'étaient pas au format : la
      # cible `make format` existait, personne ne pouvait la lancer sans churner 41 fichiers
      # étrangers à son travail, donc personne ne la lançait, donc la dérive grossissait.
      - name: Check ruff formatting
        run: docker compose run --rm engine ruff format --check .

      - name: Run mypy
        run: docker compose run --rm engine mypy

  engine-perf:
    name: Engine Perf Gate (main only)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 30
    # Perf gate is main-only. It guards the MVP "< 3 min" exit criterion and,
    # since the multi-worker fix, ratchets the large tier (dense + BCCL) to a
    # 60s budget so a regression to the single-worker prove-stall (612s) fails.
    # PRs get a cheaper, earlier signal from `engine-perf-pr` below (dense only,
    # only when engine/ moved, higher budget) — this job keeps main honest at 60s.
    if: github.ref == 'refs/heads/main'
    needs: engine-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        run: docker compose build engine

      - name: Run perf gate
        run: docker compose run --rm engine pytest -m perf

  engine-perf-pr:
    name: Engine Perf (PR, dense only)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 15
    # Earlier, cheaper perf signal ON PRS (main keeps the full gate above).
    # Only the dense tier (BCCL stays on main), and only when engine/ moved
    # (a backend-only PR does not pay it) — P4-167, decisions C1-C3.
    if: github.event_name == 'pull_request'
    needs: engine-tests
    # Budget PR = budget main (60 s), décision C2 du 2026-09-03 : la variance a été
    # mesurée AVANT (C1, 5 runs sur runners GitHub, dense de l'ordre de 0,2-0,3 s,
    # valeurs dans la PR #838) — 60 s est ≥ 1,5 × la médiane par deux ordres de
    # grandeur, et la régression visée est le prove-stall mono-worker (612 s).
    # Une seule vérité PR/main plutôt qu'un seuil dérivé qui dériverait tout seul.
    # On ne « réessaie » jamais un flake en CI : si ce gate rougit, on mesure.
    env:
      PERF_PR_BUDGET: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # need base..HEAD to diff which paths changed on this PR
          fetch-depth: 0

      # Path filter WITHOUT a third-party action: the repo pins every external
      # action by SHA and gates supply chain with semgrep/secrets-scan, so the
      # filter is a plain git diff, not `dorny/paths-filter` or `tj-actions`.
      - name: Engine changed?
        id: engine_changed
        # base_ref passe par l'ENV, jamais interpolé dans le shell : un nom de
        # branche est une entrée d'attaquant sur une PR de fork (semgrep
        # run-shell-injection, gate `semgrep`).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
              | grep -qE '^(engine/|docker/engine/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # When engine is untouched the job still finishes GREEN in seconds: a
      # required check that is a green-empty job differs from one that never ran
      # (a "missing" required check blocks the merge — we want the passing one).
      - name: Skipped, engine untouched
        if: steps.engine_changed.outputs.changed != 'true'
        run: |
          echo "Skipped: engine untouched — no engine/ or docker/engine/ change on this PR."

      - name: Prepare .env
        if: steps.engine_changed.outputs.changed == 'true'
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        if: steps.engine_changed.outputs.changed == 'true'
        run: docker compose build engine

      # Dense tier only (BCCL stays on main — C2/C3). The selector is `dense_club`,
      # not `dense`: pytest -k matches the full node id, and the FILE is
      # test_perf_dense.py, so `-k dense` would also drag in the BCCL test. The
      # dense test function is test_dense_club_… — `dense_club` isolates it.
      # --durations=0 + -rA surface the measured solve time in the log: this run
      # is also the C1 measurement point (variance before we tighten the budget).
      - name: Run perf gate (dense)
        if: steps.engine_changed.outputs.changed == 'true'
        run: docker compose run --rm -e PERF_BUDGET_SECONDS=${{ env.PERF_PR_BUDGET }} engine pytest -m perf -k dense_club --durations=0 -rA

  # Couverture de code de l'engine + cliquet (P4-166, décisions B2/B3/B5).
  #
  # `needs: engine-tests` mais PAS dans les `needs` de `build-docker` : le cliquet
  # (« on a perdu 1 % ») ne doit JAMAIS bloquer une image de prod sans décision
  # humaine (B5). Le plancher est lu de `coverage-floor.json` à la racine — une seule
  # maison, remontée dans la MÊME PR quand la mesure s'améliore ; jamais un chiffre
  # magique en dur. `--cov-fail-under` fait rougir CE job (et lui seul).
  #
  # Restitution (B2) : artefact `coverage-engine` (xml + résumé texte), aucun service
  # tiers. `set -euo pipefail` pour que le `| tee` ne masque pas l'échec du seuil.
  # `-u` mappe l'uid du runner : l'engine tourne sinon en uid 1000 (SEC-15) et ne
  # pourrait pas écrire le rapport dans le bind-mount possédé par le runner.
  engine-coverage:
    name: Engine Coverage (cliquet)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 15
    needs: engine-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        run: docker compose build engine

      - name: Coverage (engine) + cliquet
        run: |
          set -euo pipefail
          FLOOR=$(python3 -c "import json; print(json.load(open('coverage-floor.json'))['engine'])")
          echo "Plancher engine (coverage-floor.json) : ${FLOOR}%"
          mkdir -p engine/coverage
          docker compose run --rm -u "$(id -u):$(id -g)" engine \
            pytest --cov=app --cov-report=term-missing \
              --cov-report=xml:coverage/engine.xml \
              --cov-fail-under="${FLOOR}" | tee engine/coverage/engine.txt

      - name: Upload coverage report (engine)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-engine
          path: engine/coverage/
          retention-days: 7

  # Couverture de code du backend + cliquet (P4-166, décisions B1/B2/B3/B5).
  #
  # `needs: blocking-tests` (comme `unit-tests`) mais PAS dans les `needs` de
  # `build-docker` : le cliquet (« on a perdu 1 % ») ne doit JAMAIS bloquer une image
  # de prod sans décision humaine (B5). Job SÉPARÉ d'`unit-tests` : pcov instrumente,
  # donc coûte — la boucle courte reste sans couverture. Le driver pcov est présent
  # UNIQUEMENT dans l'image dev/test (build-php-cached, WITH_PCOV=1) et INERTE par
  # défaut (pcov.enabled=0) : ce job seul l'active via `-d pcov.enabled=1`.
  #
  # Le plancher est lu de `coverage-floor.json` (racine) par scripts/coverage-gate.php
  # (PHPUnit 11 n'a pas de --fail-under natif). Restitution (B2) : artefact
  # `coverage-backend` (clover + résumé texte), aucun service tiers.
  backend-coverage:
    name: Backend Coverage (cliquet)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    needs: blocking-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (pcov compris,
      # WITH_PCOV=1 dans l'action : image dev/test).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # Couverture sur la MÊME suite que `unit-tests` (`phpunit tests/ --exclude-group
      # contract`), instrumentée par pcov. Le clover est écrit AVANT le gate : l'artefact
      # part même si le cliquet (ou un test) rougit (`if: always()` plus bas).
      - name: Coverage (backend) + cliquet
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php -d pcov.enabled=1 vendor/bin/phpunit tests/ --exclude-group contract --coverage-text --coverage-clover coverage/backend.xml && php scripts/coverage-gate.php'

      - name: Upload coverage report (backend)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 40
    needs: blocking-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      # The journey drives the real stack: nginx (/api), engine (solve),
      # mercure, redis, postgres. messenger-worker starts AFTER composer
      # install — its `bin/console messenger:consume` command dies without
      # vendor/ on a fresh checkout and `--wait` would fail the job.
      - name: Start services
        run: docker compose up -d --wait php-fpm nginx engine mercure redis postgres

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # matches.spec logs in as the real BCCL dev club — seed it (create-only,
      # no-op if already there) plus the global holiday reference data. The BCCL
      # seeder REFUSES the amateo_app connection (RLS silently breaks the purge —
      # see the superuser guard in BcclSeeder::run): inject the admin URL, like
      # `make seed-bccl` (reads .env then .env.local, last wins), so it runs as the
      # superuser. Fail fast if the key is missing — an empty DATABASE_URL
      # suppresses the Dotenv fallback and would abort with an opaque DSN error deep
      # in the seeder instead. The holiday tables are global (no RLS) → plain
      # connection.
      - name: Seed dev data
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — le seed ne peut pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console app:bccl:seed --no-interaction
            php bin/console app:school-holidays:seed --no-interaction
            php bin/console app:public-holidays:seed --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Le navigateur en CACHE : au cas nominal, plus rien ne se télécharge. La clé porte
      # la version de @playwright/test (le lock) — un bump invalide le cache tout seul.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # ⚠ PAS de `--with-deps` : il lance `apt-get`, et le runner Ubuntu tient le verrou apt
      # au démarrage (mises à jour automatiques) — `apt-get` attend alors ce verrou SANS
      # limite. Constaté le 2026-08-18 : 5 h de step figé, sans un mot. L'image
      # `ubuntu-latest` embarque déjà les bibliothèques dont Chromium a besoin ; si un jour
      # elles manquent, on ajoute un step apt DÉDIÉ, non interactif et borné, plutôt que de
      # rendre l'installation du navigateur dépendante d'un verrou système.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 1
          done
          echo "Vite dev server did not come up" && exit 1

      # Préflight SUPERADMIN — miroir de la cible `make -C frontend e2e`, sans quoi
      # `modal-reachability.spec.ts` se SKIPPERAIT ici en silence. C'est exactement le piège
      # D-04 documenté quelques lignes plus bas (un spec qui se skippait à chaque run et dont
      # personne ne voyait l'absence) : un garde qui ne tourne pas en CI ne garde rien.
      #
      # Compte JETABLE, base de CI éphémère. Aucune porte dev n'est ouverte côté backend : le
      # code TOTP est calculé dans le test (RFC 6238) à partir de la clé que la commande
      # imprime À LA CRÉATION — d'où le DELETE préalable, sans lequel elle ne la réaffiche
      # jamais. Le `cache:pool:clear` remet à zéro le compteur `admin_auth` (5 essais/15 min
      # par IP), qui ferait autrement rougir le spec en désignant l'écran TOTP.
      - name: Seed the e2e super-admin (modal reachability)
        run: |
          docker compose exec -T php-fpm php bin/console cache:pool:clear cache.rate_limiter
          docker compose exec -T postgres psql -U amateo_owner -d amateo_dev -c \
            "DELETE FROM super_admin WHERE email='e2e-admin@clubscheduler.test'"
          printf 'E2eAdminPass!2026\nE2eAdminPass!2026\n' \
            | docker compose exec -T php-fpm php bin/console app:superadmin:create e2e-admin@clubscheduler.test > /tmp/e2e-sa.txt
          {
            echo "E2E_SUPERADMIN_EMAIL=e2e-admin@clubscheduler.test"
            echo "E2E_SUPERADMIN_PASSWORD=E2eAdminPass!2026"
            echo "E2E_SUPERADMIN_TOTP_SECRET=$(sed -n 's/.*setup key: *//p' /tmp/e2e-sa.txt | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Run Playwright suite
        working-directory: frontend
        run: E2E_BASE_URL=http://localhost:5173 npx playwright test

      # D-04 — les en-têtes A17 (CSP, HSTS, X-Frame-Options, nosniff) ne vivent QUE sur
      # l'image nginx. La suite ci-dessus tourne contre le dev server, où le spec dédié se
      # skippait donc à CHAQUE run : le contrôle A17 n'a jamais tourné en CI, et retirer un
      # en-tête de la conf prod passait tous les checks. On construit l'image et on rejoue
      # le seul spec concerné contre elle. `E2E_A17_REQUIRED=1` interdit au skip de revenir
      # en silence : viser un dev server ici devient un échec, pas un test ignoré.
      - name: Build the nginx frontend image
        run: docker compose up -d --wait --build frontend

      - name: A17 security headers (against the nginx build, not the dev server)
        working-directory: frontend
        run: E2E_BASE_URL=http://localhost:8081 E2E_A17_REQUIRED=1 npx playwright test tests/e2e/security-headers.spec.ts

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # Semantic end-to-end smokes on a real stack — « les smokes doivent être joués
  # automatiquement et par la CI pour que l'on s'assure que les fonctionnalités
  # fonctionnent bien » (fondateur, 2026-08-03).
  #
  # NO `needs`: they answer « la fonctionnalité marche-t-elle ? », a question
  # independent of the unit/blocking suites — waiting for them only delayed the
  # answer (~13 min behind the e2e job, measured). Same reason dependency-audit
  # and rector have none. They need NO npm, NO Playwright, NO Vite: only the API
  # + the solver, so the job boots in a fraction of the e2e setup.
  #
  # Each script is self-sufficient (mints its JWT, creates AND cleans its data,
  # re-opens then RESTORES the season-plan pointer) — order is a convenience,
  # never a dependency. The seed ships a COMPLETED, pointed season schedule the
  # placement/overlay smokes settle onto; the season-generation smoke has moved
  # to the Behat functional-tests job.
  engine-semantics:
    name: Engine semantics
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 25
    # AUCUN `needs`, comme smoke-tests : la question « ce que le backend croit du
    # moteur est-il vrai ? » ne dépend d'aucune suite unitaire, et démarrer à t=0
    # la fait répondre tôt. ⚠ À ajouter aux required status checks de `main` pour
    # qu'elle BLOQUE (décision fondateur 2026-08-07) — le réglage est côté GitHub.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      # php-fpm pour exécuter phpunit, engine pour lui répondre. Pas de base :
      # ces tests POSTent des payloads construits à la main, ils ne lisent rien.
      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      # ⚠ La base EST nécessaire, contrairement à ce que le périmètre laissait
      # croire : trois des quatre tests du groupe POSTent des payloads construits
      # à la main, mais `MatchPlacementContractSchemaTest` persiste des entités
      # avant d'appeler /place-matches. Sans ça : « database amateo_test
      # does not exist », 23 verts sur 24.
      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # Chaque clé de la liste blanche `config` doit CHANGER le résultat du
      # solveur (SEC-13), le miroir de capacité doit rendre le même verdict que
      # lui (P3-19), et le payload doit rester recevable (contrat 2.2).
      - name: Constraint keys, capacity mirror, contract shape — against the REAL engine
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit --group contract'

      - name: Dump engine logs on failure
        if: failure()
        run: docker compose logs --tail 120 engine

  # Tests fonctionnels (Behat, Gherkin français) — scénarios métier relus par le
  # fondateur, joués contre la vraie stack (API seule, aucun navigateur). Ils
  # prouvent le rail ASYNC réel (Messenger → worker → moteur → import), ce qu'un
  # transport in-process ne prouverait plus. La génération du planning de saison,
  # naguère le smoke « season solver », vit ici désormais.
  functional-tests:
    name: Functional Tests (Behat)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 40
    # AUCUN `needs`, comme smoke-tests : la question « la fonctionnalité marche-t-elle ? »
    # ne dépend d'aucune suite unitaire, et démarrer à t=0 la fait répondre tôt.
    # ⚠ À ajouter aux required status checks de `main` pour qu'il BLOQUE — côté GitHub.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm nginx engine mercure redis postgres

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # Le club dev seedé que la feature pilote. Même danse admin-URL que le job
      # smoke-tests (le seeder BCCL refuse la connexion amateo_app).
      - name: Seed dev data
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — le seed ne peut pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console app:bccl:seed --no-interaction
            php bin/console app:school-holidays:seed --no-interaction
            php bin/console app:public-holidays:seed --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      - name: Functional tests (Behat, Gherkin FR — API-only, real async rail)
        run: docker compose exec -T -e APP_ENV=dev php-fpm vendor/bin/behat --format=pretty --no-interaction

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 120 php-fpm engine messenger-worker

  smoke-tests:
    name: Smoke Tests (semantic e2e)
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      # mailpit rides along (php-fpm depends_on it) — the onboarding smoke pulls
      # its verification link from it.
      - name: Start services
        run: docker compose up -d --wait php-fpm nginx engine mercure redis postgres

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # The seeded club the solver/matches/overlay smokes drive. Same admin-URL
      # dance as the e2e job (the BCCL seeder refuses the amateo_app connection).
      - name: Seed dev data
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — le seed ne peut pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console app:bccl:seed --no-interaction
            php bin/console app:school-holidays:seed --no-interaction
            php bin/console app:public-holidays:seed --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 120 php-fpm engine messenger-worker

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    needs: [blocking-tests, engine-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build all images
        run: docker compose build

      # Prod images (docker-compose.prod.yml) — built here so the prod stack
      # cannot rot silently: a change that breaks the php prod stage (COPY +
      # composer --no-dev), the prod edge conf or the postgres init image reds
      # this job even though no dev build uses those targets.
      - name: Build prod images
        run: |
          docker build --target prod -f docker/php/Dockerfile -t scan/php-prod .
          docker build --target nginx-prod -f docker/php/Dockerfile -t scan/nginx-prod .
          docker build --target prod -f docker/frontend/Dockerfile -t scan/frontend-prod .
          docker build -f docker/postgres/Dockerfile.prod -t scan/postgres-prod .

      # SEC A19 — Trivy sur les images PROD fraîchement construites : les paquets
      # OS (openssl, libc, nginx…) sont l'angle mort de dependency-audit, qui ne
      # voit que composer/npm/pip. Gate = CRITICAL fixables seulement (HIGH en
      # rapport) ; les exceptions vivent dans .trivyignore, datées et justifiées.
      # Le monde bouge même quand l'image ne change pas : le balayage HEBDO des
      # images ghcr publiées vit dans security-weekly.yml.
      # P4-92 — trois duretés sur ce step, né fragile (base Trivy en 404 le
      # 2026-08-13) : image tirée de NOTRE miroir ghcr ET ÉPINGLÉE (latest était
      # un 2ᵉ pull Docker Hub non maîtrisé) ; cache Actions de la base de vulns
      # (restaurée d'un run à l'autre — pas de téléchargement si fraîche <6 h) ;
      # chaîne de REPLIS pour la mise à jour (ghcr → ecr → gcr : il faut que les
      # trois toussent en même temps pour perdre le gate).
      - name: Login to ghcr.io (mirror pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore trivy vulnerability DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy scan (prod images, CRITICAL gate)
        run: |
          for img in scan/php-prod scan/nginx-prod scan/frontend-prod scan/postgres-prod; do
            echo "--- $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore" \
              -v "$PWD/.trivy-cache:/root/.cache/trivy" \
              -e TRIVY_DB_REPOSITORY="ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2" \
              ghcr.io/maratech-fr/mirror-trivy:0.69.1 image --ignorefile /.trivyignore --severity CRITICAL --ignore-unfixed \
              --exit-code 1 --scanners vuln "$img"
          done
