      # Lot 9 (axes constraint semantics + planning lifecycle) — un bloc de mutualisation ANCRÉ à
      # une case par le geste « mutualiser depuis la génération » (sharedBlocks + séances
      # co-localisées HARD) reste sur sa case à la RÉGÉNÉRATION et au COMBLEMENT contre le VRAI
      # moteur, honoré et sans conflit de sur-capacité ; TÉMOIN — sans la déclaration de bloc, les
      # deux séances HARD co-localisées sur une case capacité 1 déclenchent le conflit. Skip propre
      # si l'engine est absent. Sans ce gate, une régénération/un comblement pourrait déloger en
      # silence un bloc de sa case.
      - name: SharedBlockAnchoredCaseGateTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SharedBlockAnchoredCaseGateTest.php --group phase1'

      # P4-96 (axes constraint semantics + backend↔engine contract) — quand le moteur dit NON, il
      # NOMME les règles en conflit. De bout en bout contre le VRAI moteur (/generate, contrat 1.5) :
      # coach indispo vendredi + équipe vendredi imposé (seul jour ouvert) → INFEASIBLE (failed), et
      # `diag-infeasible` cite les DEUX règles (message + causes, kinds day_forced + coach_unavailability).
      # TÉMOIN — sans l'indispo coach, le même payload redevient résoluble. Skip propre si l'engine
      # est absent. Sans ce gate, l'infaisabilité redeviendrait un message générique muet.
      - name: InfeasibilityNamesConflictingRulesTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/InfeasibilityNamesConflictingRulesTest.php --group phase1'

      # Réservation souveraine (besoin fondateur 2026-10-30, amendement ADR-0001) — « la réservation
      # gagne envers tout, mais c'est la SEULE exception ». Quand un VERROU HARD rend une règle dure
      # insatisfiable, le moteur PRODUIT le planning et NOMME la règle sacrifiée (rule_sacrificed),
      # jamais INFEASIBLE muet ; SANS verrou en cause, deux règles contradictoires restent
      # un échec NOMMÉ. De bout en bout contre le VRAI moteur (/generate). Skip propre si l'engine est
      # absent. Sans ce gate, soit la réservation cesserait d'être souveraine, soit un second « cas
      # d'exception » s'ouvrirait en silence.
      - name: SovereignReservationProducesScheduleTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SovereignReservationProducesScheduleTest.php --group phase1'

      # Axes constraint semantics + backend↔engine contract — « tant qu'un coach tient la séance,
      # c'est OK » (fondateur 2026-10-30) : seul, un coach est indispensable ; à plusieurs, un seul
      # suffit, et le résultat nomme celui qui tient. De bout en bout contre le VRAI moteur
      # (/generate). TÉMOIN — un coach seul reste interdit dans deux gymnases. Skip propre si l'engine
      # est absent. Sans ce gate, le moteur recommencerait à occuper tous les coachs d'une équipe.
      - name: OneCoachHoldsTheSessionGateTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/OneCoachHoldsTheSessionGateTest.php --group phase1'

      # Lot 3B PR A (axes constraint semantics + backend↔engine contract) — « un coach suffit »
      # (Q4B) : dès qu'une séance a plusieurs coachs requis, UN coach disponible suffit, l'UNION des
      # coachs des membres servant une séance de BLOC. De bout en bout contre le VRAI moteur
      # (/generate, contrat 1.5) : un bloc {t1,t2} dont aucun jour n'a les deux coachs mais chaque
      # jour en a un de l'union place sa séance commune et co-localise les équipes (completed) —
      # l'ancien sens « chaque coach requis ferme » le rendait INFEASIBLE. TÉMOIN — le même bloc sur
      # une case dont l'union n'a AUCUN coach est fermé (failed). Skip propre si l'engine est absent.
      # Sans ce gate, « un coach suffit » cesserait en silence d'être honoré par le moteur.
      - name: SharedBlockCoachRelayGateTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SharedBlockCoachRelayGateTest.php --group phase1'

      # Lot 3B PR B' (axes constraint semantics + backend↔engine contract) — MIROIR pré-solve de
      # « un coach suffit » pour les blocs : le récap PRÉVIENT, avant génération, qu'un groupe sans
      # case où un coach de l'union soit disponible est infaisable. Gate de parité contre le VRAI
      # moteur (même esprit que CapacityMirrorParityTest) : le miroir AVERTIT ⇒ le moteur sort failed
      # (ici SANS verrou en cause : indispo de coach, pas de réservation) ; le miroir se tait ⇒
      # completed, bascule coordonnée sur le même scénario. NB : pour la saturation des « au moins »
      # CAUSÉE par une réservation, ce n'est plus vrai (le miroir avertit, le moteur PRODUIT et nomme
      # l'équipe privée de case — ADR-0001 amendée) ; seul le dépassement de la grille nue échoue. Skip propre si
      # l'engine est absent. Sans ce gate, les deux copies de la règle dériveraient et le récap
      # mentirait (crie à tort, ou se tait à tort).
      - name: SharedBlockPreSolveMirrorParityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SharedBlockPreSolveMirrorParityTest.php --group phase1'

      # PR 6 / lot 8 (axe constraint semantics) — « Garder ses créneaux de saison » est HONORÉ par le
      # VRAI moteur (/generate, contrat 1.5) : l'effet passe par socleReferenceAssignments en keep. (1)
      # TÉMOIN — une équipe qui préfère (souple) un autre jour garde quand même son créneau de saison
      # grâce au keep ; sans keep, elle suit sa préférence. (2) CONTRE-TÉMOIN (Q3bis) — quand une autre
      # équipe n'a aucune autre place, le keep cède et l'équipe de saison bouge (placer une séance
      # prime). Skip propre si l'engine est absent. Sans ce gate, le keep cesserait en silence de tenir.
      - name: SeasonSlotKeepSemanticsGateTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/SeasonSlotKeepSemanticsGateTest.php --group phase1'

      # Chantier H (axes constraint semantics + backend↔engine contract) — « le relais de l'adjoint
      # tolère un retard » est HONORÉ par le VRAI moteur (/generate, contrat 1.6) : la tolérance
      # saisie (Reservation.coachLateToleranceMinutes → slotTemplates) autorise le coach principal à
      # arriver en retard À CONDITION qu'un adjoint disponible ouvre la séance. (1) TÉMOIN — sans
      # tolérance, le coach verrouillé interdit l'autre séance. (2) tolérance + adjoint → la séance
      # est placée. (3) CONTRE-TÉMOIN — même tolérance SANS adjoint → toujours bloqué (l'adjoint est
      # vérifié). Skip propre si l'engine est absent. Sans ce gate, la tolérance cesserait en silence
      # d'être honorée par le moteur.
      - name: CoachLateToleranceSemanticsGateTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/CoachLateToleranceSemanticsGateTest.php --group phase1'

      # Axe auth & memberships — le code FFBB est l'IDENTITÉ fédérale du club : un PUT
      # qui le CHANGE est refusé 422 (le même code reste idempotent). Falsifié : garde
      # désactivée → le PUT réécrit le code (200). Sans ce gate, un club pourrait migrer
      # d'identité fédérale en silence par l'API.
      - name: ClubIdentityImmutabilityTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ClubIdentityImmutabilityTest.php --group phase1'

      # Axes auth & memberships + tenant isolation (BCK-33) — une VRAIE inscription sur le
      # code FFBB d'un club de DÉMONSTRATION n'entre JAMAIS dans la démo : tous les chemins
      # résolvent le club par findRealByFfbbCode (is_demo=false). Falsifié : sans le filtre,
      # le vrai inscrit rejoint la démo (même id). Sans ce gate, un prospect réel atterrirait
      # dans l'espace vendeur.
      - name: DemoClubCaptureTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/DemoClubCaptureTest.php --group phase1'

      # Axes auth & memberships + tenant isolation (P4-299) — une invitation nominative fait
      # entrer dans le club par un lien à usage unique : un club ne liste/révoque jamais une
      # invitation d'un autre (RLS), jeton inconnu/expiré/révoqué → 404 byte-identique, single-use,
      # adhésion née ACTIVE au rôle invité, absorption d'une pending, refus démo des deux côtés,
      # expiration sur l'horloge réelle sous un JWT démo (P4-304). Sans ce gate, un lien ouvrirait
      # une adhésion à la mauvaise personne, ou fuiterait les invitations d'un autre club.
      - name: ClubInvitationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/ClubInvitationTest.php --group phase1'

      # Axe auth & memberships (RGPD) — effacement du dernier gestionnaire : anonymisation
      # terminale, purge du club orphelin programmée à +30 j (revalidée à l'échéance, identité
      # FFBB épargnée), et reprise d'un club sans membre via l'approbation du contact officiel.
      - name: AccountErasureTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/AccountErasureTest.php --group phase1'

      # Axe auth & memberships (P4-301) — un compte qui a perdu son dernier club : le retrait
      # du dernier accès (désactivation/refus/purge de club) envoie un préavis ET pose un stamp,
      # le cron l'anonymise 30 j APRÈS un envoi réussi (jamais sans mail), la réactivation annule
      # le préavis, la revalidation saute un compte redevenu actif, et pending/démo/multi-club
      # actif ne sont jamais concernés. Sans ce gate, une régression supprimerait des comptes sans
      # préavis, ou n'en supprimerait jamais — invisible aux autres checks.
      - name: OrphanAccountLifecycleTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/OrphanAccountLifecycleTest.php --group phase1'

      # Axe auth & memberships (RGPD, P4-304) — rétention des comptes inactifs ET exclusion des
      # comptes de DÉMONSTRATION : un démo vit à une horloge simulée (souvent passée) qui le ferait
      # paraître inactif depuis 25 mois dès sa création. Falsifié : retirer `isDemo = false` de warn()
      # ferait prévenir le démo, de erase() l'anonymiserait. Promu step NOMMÉ (gate, pas après) car il
      # garde une promesse LÉGALE : des comptes démo supprimés à tort, ou de vrais comptes jamais purgés.
      - name: InactiveUsersRetentionTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/InactiveUsersRetentionTest.php --group phase1'

      # Axe tenant isolation (BCK-24/BCK-38) — garde de COMPLÉTUDE des purges : toute entité
      # tenant doit être purgée (par saison, par club) ou nommément exclue AVEC sa raison, pour
      # la rétention/reset de saison ET pour l'effacement RGPD (art. 17). Le test DÉRIVE des
      # constantes des deux purgers — une entité tenant nouvelle tombe en échec par défaut.
      # Falsifié : une table tenant NI purgée NI exclue (comme opponent_travel au 2026-09-18)
      # fait rougir. Non bloquant jusqu'ici (tournait dans backend-tests, après le gate) : promu
      # step NOMMÉ car il garde une promesse LÉGALE (une donnée personnelle promise détruite).
      - name: PurgeCompletenessTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PurgeCompletenessTest.php --group phase1'

      # Axe tenant isolation (BCK-03/BCK-38) — garde de COMPLÉTUDE du marqueur tenant : l'ensemble
      # des entités qui implémentent TenantOwnedInterface DOIT être exactement l'ensemble des
      # entités portant une colonne club_id. Les gardes applicatives (providers/processors) keyent
      # sur ce marqueur ; un écart le rend muet (entité éditable/supprimable cross-club à la couche
      # app, défense en profondeur perdue) ou mensonger (ligne globale déguisée en tenant). Falsifié
      # dans les deux sens. Même raison de promotion que PurgeCompletenessTest (gate, pas après).
      - name: TenantOwnedInterfaceCompletenessTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/TenantOwnedInterfaceCompletenessTest.php --group phase1'

      # Axe auth & memberships (P4-291) — la SESSION GLISSANTE du cookie JWT de club : le jeton du
      # navigateur glisse tant qu'on s'en sert (ré-émission d'un TTL frais au-delà de 5 min), mais
      # sous deux bornes infranchissables — 1 h d'inactivité ET 12 h absolues depuis l'auth initiale
      # (exp plafonné à auth_at + 12 h, mort EXACTE). Abus gardés : un jeton rejoué en continu
      # meurt à 12 h puis ne glisse plus, un jeton expiré reçoit 401 SANS Set-Cookie, et le flux
      # Bearer (en-tête Authorization) ne glisse jamais ; un cookie BEARER déjà posé par la réponse
      # n'est jamais écrasé, et une démo à fenêtre fermée ne glisse pas. Sans ce gate, un plafond retiré rendrait la
      # session éternelle, ou le glissement ressusciterait un jeton expiré, en silence.
      - name: SlidingSessionTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/SlidingSessionTest.php --group phase1'

      # Axe auth & memberships (+ tenant isolation, D3) — un cookie JWT MORT ne bloque plus les pages
      # publiques : un neutraliseur (kernel.request, AVANT le firewall) retire cookie/Authorization
      # sur les routes du firewall `api` publiques, et un purgeur efface un cookie BEARER mort au 401
      # d'une route protégée (jamais sur un échec Bearer en-tête). Byte-identique avec/sans jeton
      # pourri (expiré/signature/compte supprimé, cookie ET Bearer) ; logout d'une session morte ;
      # 404 des pages à token préservé ; un jeton valide ne pose aucun GUC tenant sur route publique ;
      # firewall admin intact. Sans ce gate, un vieux cookie rendrait indéconnectable et illisible une
      # page publique — invisible aux autres checks, qui n'exercent pas le jeton mort sur route publique.
      - name: PublicRouteStaleJwtTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Security/PublicRouteStaleJwtTest.php --group phase1'

      # Axe planning lifecycle (P2-63 PR 5) — « Transférer au planning » n'écrit QUE des objets de
      # période (overrides d'équipe, contraintes datées), ne fait JAMAIS naître un plan (semaine sans
      # plan → ignorée) et ne touche ni le socle ni sa version choisie ; idempotence par
      # (source=coach_wish, occurrence) ; 409 pendant une génération ; garde SEC-07 falsifiée ; une
      # doléance d'un autre club n'est jamais convertie. Sans ce gate, un transfert qui ferait naître
      # un plan ou toucherait le socle passerait les checks requis.
      - name: CoachWishTransferTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Api/CoachWishTransferTest.php --group phase1'

      # NR d'axe GENERATION PIPELINE (P4-350) — quand une mise en production est IMMINENTE (un
      # déploiement actif dont l'heure H est atteinte), les QUATRE guichets qui enfilent un solve
      # (générer, régénérer, combler un plan de période, placer des matchs) refusent 409 avec un
      # message EXACT, SANS rien enfiler et SANS fuiter la version/l'acteur/« GitHub ». Falsifié
      # PAR GUICHET (quatre chemins d'écriture distincts). Un déploiement futur ou annulé ne gèle
      # rien. Sans ce gate, un solve lancé pendant la bascule de maintenance corromprait un run
      # au moment du déploiement, invisible aux autres checks.
      - name: DeploymentImminentFreezeTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Api/DeploymentImminentFreezeTest.php --group phase1'

      # NR d'axe CONSTRAINT SEMANTICS (chantier A) — AU DÉPÔT d'un fichier FBI, tout championnat
      # COMMENCÉ (échéance passée OU premier match joué) voit ses domiciles validables (heure +
      # gymnase, sans écart) passer tout seuls « validé ligue » (source MANUAL + statut VALIDATED),
      # BYTE-IDENTIQUE au POST manuel en lot ; un championnat non commencé reste UNPLACED/TO_PLACE,
      # un sans heure / sans gymnase / avec écart n'est jamais validé, le compteur leagueValidated
      # est exact et un re-dépôt ne revalide pas. Le DÉPÔT emprunte la MAISON UNIQUE du prédicat
      # (LeagueValidationOutlook), jamais une seconde copie. Sans ce gate, une régression qui
      # cesserait de valider au dépôt — ou qui verrouillerait en ancre fixe une vague non commencée
      # qu'il faut pouvoir bouger — passerait tous les checks requis.
      - name: ImportLeagueAutoValidationTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/Integration/Service/ImportLeagueAutoValidationTest.php --group phase1'

      # NR d'axe CONSTRAINT SEMANTICS + GENERATION PIPELINE (lot correctif import IA « G2 » PR1) —
      # une RÉSERVATION DÉRIVÉE d'une CASE parc-v2 par l'IMPORT DE PARC est HONORÉE par le solveur, de
      # bout en bout : texte parc-v2 → dérivation + import réel (ParcImportExecutor) → vrai builder → vrai moteur /generate. Une
      # réservation d'équipe pré-génération est un verrou HARD : AVANT l'import l'équipe suit une
      # préférence souple (mercredi) ; APRÈS, la réservation du lundi pose sa séance sur la case
      # réservée malgré la préférence contraire. TÉMOIN falsifiable — le même décor sans la
      # réservation retombe sur le mercredi. Sans ce gate, une régression qui cesserait d'écrire la
      # réservation (ou de la poser HARD au socle) passerait tous les checks requis.
      - name: ParcImportReservationSemanticsGateTest
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit tests/CrossStack/ParcImportReservationSemanticsGateTest.php --group phase1'

  # Backend : UN SEUL passage de la suite PHPUnit COMPLÈTE (`phpunit tests/ --exclude-group
  # contract`), instrumenté par pcov, avec le cliquet de couverture — remplace les ex-jobs
  # `unit-tests` ET `backend-coverage` qui jouaient DEUX FOIS la même suite (P4-166 ; fusion
  # 2026-10-14). SANS `needs` : aucun job ne consomme son artefact, le `needs: blocking-tests`
  # d'`unit-tests` n'était que de l'ordonnancement — ce job démarre donc à t=0, en parallèle du
  # gate, et le verdict backend tombe plus tôt.
  #
  # Cliquet : `scripts/coverage-gate.php` lit le plancher `backend` de `coverage-floor.json`
  # (racine, une seule maison, remontée dans la MÊME PR quand la mesure s'améliore ; jamais un
  # chiffre en dur) et sort 1 sous le plancher — PHPUnit 11 n'a pas de `--fail-under` natif. Le
  # cliquet rougit CE job, un required check de `main` (« Backend Tests (suite + couverture) »,
  # ex-« Unit Tests ») : il BLOQUE LE MERGE. Mais ce job n'est PAS dans les `needs` de
  # `build-docker` — une perte de 1 % ne prend jamais en otage une image de prod urgente.
  #
  # pcov : driver présent UNIQUEMENT dans l'image dev/test (build-php-cached, WITH_PCOV=1) et
  # INERTE par défaut (pcov.enabled=0) ; ce job seul l'active via `-d pcov.enabled=1`. L'image de
  # PROD ne reçoit jamais cet arg et n'embarque jamais pcov. Restitution (B2) : artefact
  # `coverage-backend` (clover + résumé texte), écrit AVANT le gate (`if: always()` plus bas).
  backend-tests:
    name: Backend Tests (suite + couverture)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 — RoadmapIdentityTest rejoue `git log --reverse --follow -p` sur la
      # roadmap pour prouver qu'aucun identifiant retiré n'a été ressuscité. Un clone superficiel
      # ne connaît qu'un commit : le test se saborderait en skip (il le dit) et le garde ne
      # verrait plus rien.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # SEC-13 : le groupe `contract` reste EXCLU — il interroge le VRAI moteur (job dédié
      # « Engine semantics »), une autre question que « le code unitaire tient-il ? ». pcov
      # instrumente la suite ; le clover est écrit AVANT le gate pour que l'artefact parte même
      # si le cliquet (ou un test) rougit (`if: always()` plus bas).
      - name: Run full suite + coverage + cliquet
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php -d pcov.enabled=1 vendor/bin/phpunit tests/ --exclude-group contract --coverage-text --coverage-clover coverage/backend.xml && php scripts/coverage-gate.php'

      - name: Upload coverage report (backend)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7

  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        run: docker compose build engine

      # pytest AVEC couverture + cliquet (ex-job `engine-coverage` fondu ici, 2026-10-14 :
      # un seul passage au lieu de deux). ⚠ CONSÉQUENCE ACTÉE (décision fondateur 2026-10-14) :
      # `engine-tests` EST dans les `needs` de `build-docker`, donc le cliquet engine gate
      # DÉSORMAIS `build-docker` — contrairement aux cliquets backend/frontend qui restent hors
      # de ce chemin (ils bloquent le merge via leur required check, pas l'image). Plancher lu de
      # `coverage-floor.json` (racine, clé `engine`) — jamais un seuil en dur. `set -euo pipefail`
      # pour que le `| tee` ne masque pas l'échec du seuil. `-u` mappe l'uid du runner : l'engine
      # tourne sinon en uid 1000 (SEC-15) et ne pourrait pas écrire le rapport dans le bind-mount.
      - name: Run pytest + coverage + cliquet
        run: |
          set -euo pipefail
          FLOOR=$(python3 -c "import json; print(json.load(open('coverage-floor.json'))['engine'])")
          echo "Plancher engine (coverage-floor.json) : ${FLOOR}%"
          mkdir -p engine/coverage
          docker compose run --rm -u "$(id -u):$(id -g)" engine \
            pytest --cov=app --cov-report=term-missing \
              --cov-report=xml:coverage/engine.xml \
              --cov-fail-under="${FLOOR}" | tee engine/coverage/engine.txt

      - name: Run ruff
        run: docker compose run --rm engine ruff check .

      # P4-64 — le formatage est GARDÉ, pas seulement disponible. Sans ce pas, `ruff check`
      # (lint) passait sur un arbre dont 41 fichiers sur 70 n'étaient pas au format : la
      # cible `make format` existait, personne ne pouvait la lancer sans churner 41 fichiers
      # étrangers à son travail, donc personne ne la lançait, donc la dérive grossissait.
      - name: Check ruff formatting
        run: docker compose run --rm engine ruff format --check .

      - name: Run mypy
        run: docker compose run --rm engine mypy

      - name: Run bandit
        run: docker compose run --rm engine bandit -r app/

      # Garde d'hygiène des dépendances : deptry rougit sur une dépendance déclarée
      # mais jamais importée (DEP002), manquante (DEP001) ou seulement transitive
      # (DEP003). Config dans pyproject.toml (`tests` réintégré, faux positifs des
      # outils CLI/plugins pytest ignorés en DEP002).
      - name: Run deptry
        run: docker compose run --rm engine deptry .

      - name: Upload coverage report (engine)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-engine
          path: engine/coverage/
          retention-days: 7

  engine-perf:
    name: Engine Perf Gate (main only)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 30
    # Perf gate is main-only. It guards the MVP "< 3 min" exit criterion and,
    # since the multi-worker fix, ratchets the large tier (dense + BCCL) to a
    # 60s budget so a regression to the single-worker prove-stall (612s) fails.
    # PRs get a cheaper, earlier signal from `engine-perf-pr` below (dense only,
    # only when engine/ moved, higher budget) — this job keeps main honest at 60s.
    if: github.ref == 'refs/heads/main'
    needs: engine-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        run: docker compose build engine

      - name: Run perf gate
        run: docker compose run --rm engine pytest -m perf --durations=0

  engine-perf-pr:
    name: Engine Perf (PR, dense only)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 15
    # Earlier, cheaper perf signal ON PRS (main keeps the full gate above).
    # Only the dense tier (BCCL stays on main), and only when engine/ moved
    # (a backend-only PR does not pay it) — P4-167, decisions C1-C3.
    if: github.event_name == 'pull_request'
    needs: engine-tests
    # Budget PR = budget main (60 s), décision C2 du 2026-09-03 : la variance a été
    # mesurée AVANT (C1, 5 runs sur runners GitHub, dense de l'ordre de 0,2-0,3 s,
    # valeurs dans la PR #838) — 60 s est ≥ 1,5 × la médiane par deux ordres de
    # grandeur, et la régression visée est le prove-stall mono-worker (612 s).
    # Une seule vérité PR/main plutôt qu'un seuil dérivé qui dériverait tout seul.
    # On ne « réessaie » jamais un flake en CI : si ce gate rougit, on mesure.
    env:
      PERF_PR_BUDGET: "60"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # need base..HEAD to diff which paths changed on this PR
          fetch-depth: 0

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Path filter WITHOUT a third-party action: the repo pins every external
      # action by SHA and gates supply chain with semgrep/secrets-scan, so the
      # filter is a plain git diff, not `dorny/paths-filter` or `tj-actions`.
      - name: Engine changed?
        id: engine_changed
        # base_ref passe par l'ENV, jamais interpolé dans le shell : un nom de
        # branche est une entrée d'attaquant sur une PR de fork (semgrep
        # run-shell-injection, gate `semgrep`).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
              | grep -qE '^(engine/|docker/engine/)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # When engine is untouched the job still finishes GREEN in seconds: a
      # required check that is a green-empty job differs from one that never ran
      # (a "missing" required check blocks the merge — we want the passing one).
      - name: Skipped, engine untouched
        if: steps.engine_changed.outputs.changed != 'true'
        run: |
          echo "Skipped: engine untouched — no engine/ or docker/engine/ change on this PR."

      - name: Prepare .env
        if: steps.engine_changed.outputs.changed == 'true'
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build engine
        if: steps.engine_changed.outputs.changed == 'true'
        run: docker compose build engine

      # Dense tier only (BCCL stays on main — C2/C3). The selector is `dense_club`,
      # not `dense`: pytest -k matches the full node id, and the FILE is
      # test_perf_dense.py, so `-k dense` would also drag in the BCCL test. The
      # dense test function is test_dense_club_… — `dense_club` isolates it.
      # --durations=0 + -rA surface the measured solve time in the log: this run
      # is also the C1 measurement point (variance before we tighten the budget).
      - name: Run perf gate (dense)
        if: steps.engine_changed.outputs.changed == 'true'
        run: docker compose run --rm -e PERF_BUDGET_SECONDS=${{ env.PERF_PR_BUDGET }} engine pytest -m perf -k dense_club --durations=0 -rA

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 40
    # SANS `needs` (2026-10-14) : l'e2e ne consommait aucun artefact de `blocking-tests`, ce
    # `needs` n'était que de l'ordonnancement — il faisait attendre ~6 min un verdict navigateur
    # qui peut tomber à t=0 (comme Behat, déjà sans needs). Prix assumé : un runner e2e dépensé
    # même sur une PR déjà rouge au gate.
    env:
      # BuildKit « bake » démarre un builder et peut se figer sur « waiting for BuildKit:
      # DeadlineExceeded » quand compose délègue un build local (engine) — run e2e rouge du
      # 2026-09-15. On coupe la délégation à `docker buildx bake` : compose bâtit alors par sa
      # voie classique (BuildKit intégré au démon), sans builder externe à attendre.
      COMPOSE_BAKE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      # Docker Hub injoignable au PULL a rougi « Start services » (run 2026-09-15 : i/o timeout
      # sur `dunglas/mercure`). On pré-tire les images TIERCES à part, avec relance : un aléa de
      # registre ne doit plus déguiser une infra saine en échec. `--ignore-buildable` laisse de
      # côté les images bâties localement (php déjà chargée par l'action ci-dessus, engine ci-après).
      - name: Pre-pull third-party images
        id: prepull
        run: .github/scripts/retry.sh 3 docker compose pull --ignore-buildable nginx mercure redis postgres

      # `engine` est la SEULE image du démarrage à être bâtie localement (les autres sont tierces
      # ou déjà chargées). On la bâtit À PART, avec relance : « Start services » n'a alors plus
      # aucun build à déclencher — c'est ce build implicite d'engine (via bake) qui a rougi le
      # 2026-09-15. (COMPOSE_BAKE=false, en env du job, écarte le builder externe.)
      - name: Build the engine image
        id: buildengine
        run: .github/scripts/retry.sh 2 docker compose build engine

      # The journey drives the real stack: nginx (/api), engine (solve),
      # mercure, redis, postgres. messenger-worker starts AFTER composer
      # install — its `bin/console messenger:consume` command dies without
      # vendor/ on a fresh checkout and `--wait` would fail the job.
      # ⚠ Pas de `--no-build` : php-fpm est chargée par l'action sous le tag `scheduler-php-fpm`
      # alors que compose la résout sous le nom du projet (`container_name: amateo-php-fpm`) — un
      # `--no-build` risquerait « image introuvable » sur php. On laisse donc compose retomber sur
      # un build classique au besoin (rare, engine déjà bâtie, tierces déjà tirées), sous relance.
      - name: Start services
        id: startservices
        run: .github/scripts/retry.sh 3 docker compose up -d --wait php-fpm nginx engine mercure redis postgres

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # matches.spec logs in as the real BCCL dev club — seed it (create-only,
      # no-op if already there) plus the global holiday reference data. The BCCL
      # seeder REFUSES the amateo_app connection (RLS silently breaks the purge —
      # see the superuser guard in BcclSeeder::run): inject the admin URL, like
      # `make seed-bccl` (reads .env then .env.local, last wins), so it runs as the
      # superuser. Fail fast if the key is missing — an empty DATABASE_URL
      # suppresses the Dotenv fallback and would abort with an opaque DSN error deep
      # in the seeder instead. The holiday tables are global (no RLS) → plain
      # connection.
      - name: Seed dev data
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — le seed ne peut pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console app:bccl:seed --no-interaction
            php bin/console app:school-holidays:seed --no-interaction
            php bin/console app:public-holidays:seed --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Le navigateur en CACHE : au cas nominal, plus rien ne se télécharge. La clé porte
      # la version de @playwright/test (le lock) — un bump invalide le cache tout seul.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # ⚠ PAS de `--with-deps` : il lance `apt-get`, et le runner Ubuntu tient le verrou apt
      # au démarrage (mises à jour automatiques) — `apt-get` attend alors ce verrou SANS
      # limite. Constaté le 2026-08-18 : 5 h de step figé, sans un mot. L'image
      # `ubuntu-24.04` embarque déjà les bibliothèques dont Chromium a besoin ; si un jour
      # elles manquent, on ajoute un step apt DÉDIÉ, non interactif et borné, plutôt que de
      # rendre l'installation du navigateur dépendante d'un verrou système.
      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 1
          done
          echo "Vite dev server did not come up" && exit 1

      # Préflight SUPERADMIN — miroir de la cible `make -C frontend e2e`, sans quoi
      # `modal-reachability.spec.ts` se SKIPPERAIT ici en silence. C'est exactement le piège
      # D-04 documenté quelques lignes plus bas (un spec qui se skippait à chaque run et dont
      # personne ne voyait l'absence) : un garde qui ne tourne pas en CI ne garde rien.
      #
      # Compte JETABLE, base de CI éphémère. Aucune porte dev n'est ouverte côté backend : le
      # code TOTP est calculé dans le test (RFC 6238) à partir de la clé que la commande
      # imprime À LA CRÉATION — d'où le DELETE préalable, sans lequel elle ne la réaffiche
      # jamais. Le `cache:pool:clear` remet à zéro le compteur `admin_auth` (5 essais/15 min
      # par IP), qui ferait autrement rougir le spec en désignant l'écran TOTP.
      - name: Seed the e2e super-admin (modal reachability)
        run: |
          docker compose exec -T php-fpm php bin/console cache:pool:clear cache.rate_limiter
          docker compose exec -T postgres psql -U amateo_owner -d amateo_dev -c \
            "DELETE FROM super_admin WHERE email='e2e-admin@clubscheduler.test'"
          printf 'E2eAdminPass!2026\nE2eAdminPass!2026\n' \
            | docker compose exec -T php-fpm php bin/console app:superadmin:create e2e-admin@clubscheduler.test > /tmp/e2e-sa.txt
          {
            echo "E2E_SUPERADMIN_EMAIL=e2e-admin@clubscheduler.test"
            echo "E2E_SUPERADMIN_PASSWORD=E2eAdminPass!2026"
            echo "E2E_SUPERADMIN_TOTP_SECRET=$(sed -n 's/.*setup key: *//p' /tmp/e2e-sa.txt | tr -d '\r\n')"
          } >> "$GITHUB_ENV"

      - name: Run Playwright suite
        id: playwright
        working-directory: frontend
        # `set -o pipefail` EXPLICITE, dans le corps du run : le shell `run` par défaut sur
        # Linux est `bash -e {0}` SANS pipefail (il ne serait armé qu'avec un `shell: bash`
        # explicite, absent de ce workflow — vérifié). Sans pipefail, `… | tee` renverrait le
        # code de `tee` (toujours 0) et MASQUERAIT un échec de Playwright : `steps.playwright.
        # outcome` mentirait « success », Classify failure ne se déclencherait jamais et le job
        # E2E serait vert en permanence. Avec pipefail + le `-e` par défaut, un échec de
        # Playwright fait échouer le step. Le tee alimente le step « E2E — tests flaky ».
        run: |
          set -o pipefail
          E2E_BASE_URL=http://localhost:5173 npx playwright test 2>&1 | tee "$RUNNER_TEMP/playwright-list.log"

      # D-04 — les en-têtes A17 (CSP, HSTS, X-Frame-Options, nosniff) ne vivent QUE sur
      # l'image nginx. La suite ci-dessus tourne contre le dev server, où le spec dédié se
      # skippait donc à CHAQUE run : le contrôle A17 n'a jamais tourné en CI, et retirer un
      # en-tête de la conf prod passait tous les checks. On construit l'image et on rejoue
      # le seul spec concerné contre elle. `E2E_A17_REQUIRED=1` interdit au skip de revenir
      # en silence : viser un dev server ici devient un échec, pas un test ignoré.
      # `--build` → BuildKit : relance bornée (2 essais) au cas où le builder mette du temps à
      # répondre, comme pour l'image engine plus haut.
      - name: Build the nginx frontend image
        id: buildfrontend
        run: .github/scripts/retry.sh 2 docker compose up -d --wait --build frontend

      - name: A17 security headers (against the nginx build, not the dev server)
        id: a17
        working-directory: frontend
        # `--output` DÉDIÉ : Playwright vide l'outputDir au démarrage de CHAQUE run (tâche de
        # setup « clear output », runner/index.js → removeFolders sur chaque projet). Sans dossier
        # à part, cette 2ᵉ invocation effacerait le `test-results/` que la suite principale vient
        # de remplir (dont la trace d'un essai flaky perdu) et l'upload final ne trouverait plus
        # rien — run réel #968 : « No files were found with the provided path ». Deux dossiers
        # distincts → l'upload les ramasse tous les deux, y compris LA trace d'A17 si elle rougit.
        run: E2E_BASE_URL=http://localhost:8081 E2E_A17_REQUIRED=1 npx playwright test tests/e2e/security-headers.spec.ts --output test-results-a17

      # Boussole d'échec : distinguer une panne d'INFRA (avant que Playwright tourne) d'un vrai
      # échec de test, pour ne pas envoyer chercher un bug produit quand c'est le registre, BuildKit
      # ou la stack qui a lâché. Lu depuis l'`outcome` des steps (un step sauté par un échec amont
      # n'a pas l'`outcome` « failure »).
      - name: Classify failure (infra vs Playwright)
        if: failure()
        run: |
          {
            echo "## E2E — nature de l'échec"
            if [ "${{ steps.playwright.outcome }}" = "failure" ] || [ "${{ steps.a17.outcome }}" = "failure" ]; then
              echo "❌ **Échec Playwright** — la suite a démarré et au moins un test a rougi. Voir l'artefact \`playwright-results\`."
            else
              echo "⚠️ **Échec AVANT Playwright (infra)** — la suite n'a pas démarré. La cause est en amont (pull d'images, build engine/frontend, démarrage de la stack), pas dans les tests."
            fi
            echo ""
            echo "| Step | Résultat |"
            echo "| --- | --- |"
            echo "| Pre-pull images | ${{ steps.prepull.outcome }} |"
            echo "| Build engine | ${{ steps.buildengine.outcome }} |"
            echo "| Start services | ${{ steps.startservices.outcome }} |"
            echo "| Build frontend nginx | ${{ steps.buildfrontend.outcome }} |"
            echo "| Run Playwright | ${{ steps.playwright.outcome }} |"
            echo "| A17 headers | ${{ steps.a17.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Un run vert-mais-flaky doit le DIRE : `always()` pour parler même quand le job est
      # vert (Classify failure, lui, ne parle qu'en `failure()`). Le script sort 0 quoi qu'il
      # lise — il ne peut ni faire rougir un job vert, ni casser un job qui rougit déjà pour
      # une autre raison. Reporter `list` (playwright.config.ts) : pas de JSON, on parse le
      # résumé texte du run principal capturé ci-dessus.
      - name: E2E — flaky tests (green-but-flaky notice)
        if: always()
        run: .github/scripts/flaky-summary.sh "$RUNNER_TEMP/playwright-list.log" >> "$GITHUB_STEP_SUMMARY"

      # `always()` (+ `if-no-files-found: ignore`) : la trace d'un essai perdu (trace:
      # retain-on-failure) doit survivre MÊME quand le job finit vert. Sur un run 100 % vert le
      # dossier est absent/vide et l'upload se TAIT au lieu de rougir. « on failure » serait
      # devenu un mensonge — d'où le renommage.
      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          # Deux dossiers : la suite principale (`test-results/`, dont la trace d'un essai flaky
          # perdu) ET le run A17 (`test-results-a17/`, sa propre trace s'il rougit). Un SEUL
          # artefact multi-chemins plutôt que deux artefacts nommés : un seul téléchargement pour
          # diagnostiquer, et les sous-dossiers sont distincts (aucune collision). `ignore` couvre
          # le cas « tout vert » où aucun des deux dossiers n'existe → rien uploadé, pas d'erreur.
          path: |
            frontend/test-results/
            frontend/test-results-a17/
          if-no-files-found: ignore
          retention-days: 7

  # Vérifs sémantiques de bout en bout sur une vraie stack — « il faut s'assurer
  # automatiquement, par la CI, que les fonctionnalités fonctionnent bien »
  # (fondateur, 2026-08-03). Deux jobs le portent : engine-semantics (le contrat
  # backend⇄moteur contre le VRAI solveur) et functional-tests (les features
  # Behat en Gherkin français, API contre la stack réelle — elles ont remplacé
  # les smokes .sh, P4-165).
  #
  # AUCUN `needs` : ils répondent « la fonctionnalité marche-t-elle ? », question
  # indépendante des suites unitaires/bloquantes — les attendre ne faisait que
  # retarder la réponse (~13 min derrière le job e2e, mesuré). Même raison que
  # dependency-audit et rector. Ni npm, ni Playwright, ni Vite : seulement l'API
  # + le solveur, donc le job démarre en une fraction du setup e2e.
  #
  # Chaque feature Behat est autosuffisante (forge son JWT, crée ET nettoie ses
  # données, rouvre puis RESTAURE le pointeur du socle) — jouable seule et dans
  # n'importe quel ordre. Le seed livre un planning de saison COMPLETED et pointé
  # sur lequel les features placement/overlay s'appuient.
  engine-semantics:
    name: Engine semantics
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 25
    # AUCUN `needs`, comme les tests fonctionnels : la question « ce que le backend croit du
    # moteur est-il vrai ? » ne dépend d'aucune suite unitaire, et démarrer à t=0
    # la fait répondre tôt. ⚠ À ajouter aux required status checks de `main` pour
    # qu'elle BLOQUE (décision fondateur 2026-08-07) — le réglage est côté GitHub.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      # php-fpm pour exécuter phpunit, engine pour lui répondre. Pas de base :
      # ces tests POSTent des payloads construits à la main, ils ne lisent rien.
      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      # ⚠ La base EST nécessaire, contrairement à ce que le périmètre laissait
      # croire : trois des quatre tests du groupe POSTent des payloads construits
      # à la main, mais `MatchPlacementContractSchemaTest` persiste des entités
      # avant d'appeler /place-matches. Sans ça : « database amateo_test
      # does not exist », 23 verts sur 24.
      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # Chaque clé de la liste blanche `config` doit CHANGER le résultat du
      # solveur (SEC-13), le miroir de capacité doit rendre le même verdict que
      # lui (P3-19), et le payload doit rester recevable (contrat 2.2).
      - name: Constraint keys, capacity mirror, contract shape — against the REAL engine
        run: docker compose exec -T -e APP_ENV=test php-fpm sh -c 'cd /app/backend && php vendor/bin/phpunit --group contract'

      - name: Dump engine logs on failure
        if: failure()
        run: docker compose logs --tail 120 engine

  # Tests fonctionnels (Behat, Gherkin français) — scénarios métier relus par le
  # fondateur, joués contre la vraie stack (API seule, aucun navigateur). Ils
  # prouvent le rail ASYNC réel (Messenger → worker → moteur → import), ce qu'un
  # transport in-process ne prouverait plus. La génération du planning de saison,
  # naguère le smoke « season solver », vit ici désormais.
  functional-tests:
    name: Functional Tests (Behat)
    runs-on: ubuntu-24.04
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 40
    # AUCUN `needs`, comme engine-semantics et rector : la question « la fonctionnalité marche-t-elle ? »
    # ne dépend d'aucune suite unitaire, et démarrer à t=0 la fait répondre tôt.
    # ⚠ À ajouter aux required status checks de `main` pour qu'il BLOQUE — côté GitHub.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        # pdf-worker : la feature « l'export du planning » attend un PDF réel (Puppeteer) — sans lui
        # le worker d'export répond « failed » (attrapé au premier run CI de la feature, 2026-09-05).
        run: docker compose up -d --wait php-fpm nginx engine mercure redis postgres pdf-worker

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Migrate dev database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:migrations:migrate --no-interaction'

      # Le club dev seedé que la feature pilote. Même danse admin-URL que le job
      # e2e (le seeder BCCL refuse la connexion amateo_app).
      - name: Seed dev data
        run: |
          docker compose exec -T php-fpm sh -c '
            cd /app/backend
            DBU=$(cat .env .env.local 2>/dev/null | sed -n "s/^DATABASE_ADMIN_URL=//p" | tail -n1 | tr -d "\"")
            [ -n "$DBU" ] || { echo "DATABASE_ADMIN_URL introuvable dans backend/.env — le seed ne peut pas tourner sur la connexion admin"; exit 1; }
            DATABASE_URL="$DBU" php bin/console app:bccl:seed --no-interaction
            php bin/console app:school-holidays:seed --no-interaction
            php bin/console app:public-holidays:seed --no-interaction
          '

      - name: Start messenger worker
        run: docker compose up -d --wait messenger-worker

      - name: Functional tests (Behat, Gherkin FR — API-only, real async rail)
        run: docker compose exec -T -e APP_ENV=dev php-fpm vendor/bin/behat --format=pretty --no-interaction

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 120 php-fpm engine messenger-worker

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-24.04
    # docker login ghcr — image miroir trivy, P4-92 (contents:read répété : un bloc de job REMPLACE la racine)
    permissions:
      contents: read
      packages: read
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    needs: [blocking-tests, engine-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Build all images
        run: docker compose build

      # Prod images (docker-compose.prod.yml) — built here so the prod stack
      # cannot rot silently: a change that breaks the php prod stage (COPY +
      # composer --no-dev), the prod edge conf or the postgres init image reds
      # this job even though no dev build uses those targets.
      - name: Build prod images
        run: |
          docker build --target prod -f docker/php/Dockerfile -t scan/php-prod .
          docker build --target nginx-prod -f docker/php/Dockerfile -t scan/nginx-prod .
          docker build --target prod -f docker/frontend/Dockerfile -t scan/frontend-prod .
          docker build --target prod -f docker/engine/Dockerfile -t scan/engine-prod .
          docker build -f docker/postgres/Dockerfile.prod -t scan/postgres-prod .

      # SEC A19 — Trivy sur les images PROD fraîchement construites : les paquets
      # OS (openssl, libc, nginx…) sont l'angle mort de dependency-audit, qui ne
      # voit que composer/npm/pip. Gate = CRITICAL fixables seulement (HIGH en
      # rapport) ; les exceptions vivent dans .trivyignore, datées et justifiées.
      # Le monde bouge même quand l'image ne change pas : le balayage HEBDO des
      # images ghcr publiées vit dans security-weekly.yml.
      # P4-92 — trois duretés sur ce step, né fragile (base Trivy en 404 le
      # 2026-08-13) : image tirée de NOTRE miroir ghcr ET ÉPINGLÉE (latest était
      # un 2ᵉ pull Docker Hub non maîtrisé) ; cache Actions de la base de vulns
      # (restaurée d'un run à l'autre — pas de téléchargement si fraîche <6 h) ;
      # chaîne de REPLIS pour la mise à jour (ghcr → ecr → gcr : il faut que les
      # trois toussent en même temps pour perdre le gate).
      - name: Login to ghcr.io (mirror pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore trivy vulnerability DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Trivy scan (prod images, CRITICAL gate)
        run: |
          for img in scan/php-prod scan/nginx-prod scan/frontend-prod scan/postgres-prod; do
            echo "--- $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore" \
              -v "$PWD/.trivy-cache:/root/.cache/trivy" \
              -e TRIVY_DB_REPOSITORY="ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2" \
              ghcr.io/maratech-fr/mirror-trivy:0.69.1 image --ignorefile /.trivyignore --severity CRITICAL --ignore-unfixed \
              --exit-code 1 --scanners vuln "$img"
          done
