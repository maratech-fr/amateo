name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` : un changement de base (lot/<sujet> → main) relance le run sous le régime de
    # la base COURANTE. Aucun `if` ne lit `github.event.action` : une édition rejoue tout le
    # régime, jamais un sous-ensemble.
    types: [opened, synchronize, reopened, edited]
    branches: [main, 'lot/**']

permissions:
  contents: read

# Régime par branche cible (jamais par dossier touché) : une PR vers `main` joue le gate
# COMPLET (tout sauf engine-perf) ; une PR vers `lot/<sujet>` joue le régime LÉGER (jobs sans
# `if` + jobs `if: pull_request`) — les lourds (backend-tests, e2e, functional-tests,
# dependency-audit, build-docker) attendent la PR finale `lot/<sujet>` → `main`. Le push sur
# `main` garde son run (isCiGreen) ; un push sur `lot/**` ne lance aucun run.
#
# Un push qui remplace un autre sur la MÊME réf annule le run précédent — sauf sur `main`, où
# chaque commit mérite son verdict complet (file de merge, historique du gate). Économise des
# exécutants sur les PR qui repoussent vite, sans jamais couper un run de `main`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  # Garde fork (ceinture YAML ; le garde réel est le réglage « Require approval for all
  # external contributors » du dépôt) : une PR venue d'un AUTRE dépôt — vers `main` comme vers
  # `lot/**` — n'exécute rien sur le runner auto-hébergé. Aucun checkout ici — le code d'un
  # fork n'atterrit jamais sur le runner. Tous les autres jobs `needs: preflight` ; « Preflight » est un required check (un
  # job sauté vaudrait succès). Sur `push main` le step se saute et le job est vert.
  preflight:
    name: Preflight
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Refuse pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Cette CI ne tourne que pour les PR du dépôt lui-même ; une PR de fork n'est jamais exécutée sur le runner."
          exit 1

  lint:
    name: Lint
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    needs: preflight
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      - name: Lint Docker Compose
        run: docker compose config > /dev/null

      - name: Lint Makefile
        run: make -n help

      - name: Stack resolve bench
        run: bash backend/scripts/lib/stack-resolve-test.sh

      - name: ci-releve self-test
        run: python3 --version && python3 -I scripts/ci-releve-test.py

  # Frontend gate: until now the frontend had NO CI coverage — only the e2e job
  # touched it via `npm run dev` (Vite, no typecheck). A broken production build
  # (`tsc -b`) and failing Vitest units both slipped through. This job closes
  # that gap: typecheck + production build + unit tests on every PR.
  frontend:
    name: Frontend (build + unit)
    runs-on: ${{ vars.CI_RUNS_ON_HEAVY || 'ubuntu-24.04' }}
    if: github.event_name == 'pull_request'
    needs: preflight
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Garde d'hygiène des dépendances : knip rougit sur une dev/dép déclarée mais
      # jamais importée, ou un fichier source inatteignable depuis les entrées
      # (`knip.json`). Mode `--dependencies --files` : les exports inutilisés restent
      # HORS du gate (bruit au départ). Le job `frontend` n'est pas dans les `needs`
      # de `build-docker` : une dérive d'hygiène rougit ce check sans bloquer l'image.
      - name: Dependency check (knip)
        working-directory: frontend
        run: npm run lint:deps

      - name: Build (tsc -b + vite)
        working-directory: frontend
        run: npm run build

      # Unitaires Vitest AVEC couverture + cliquet (ex-job `frontend-coverage` fondu ici,
      # 2026-10-14 : un seul passage de la suite au lieu de deux). Le cliquet rougit si la
      # couverture de lignes descend sous le plancher versionné (`coverage-floor.json`, lu par
      # `vitest.config.ts` → `thresholds.lines`) — un required check de `main` (job `frontend`),
      # donc BLOQUANT AU MERGE, mais `frontend` n'est pas dans les `needs` de `build-docker`
      # (une perte de 1 % ne bloque pas une image de prod urgente).
      - name: Unit tests + coverage (Vitest, cliquet)
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report (frontend)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  # A18: blocking dependency-vulnerability audits, deliberately isolated in their OWN
  # job (no `needs`, and NOT a dependency of build-docker). A newly-disclosed advisory
  # against an unchanged package therefore reds only THIS check — which requires human
  # triage (bump the dep, or explicitly ignore the advisory) — without gating the image
  # build or the functional jobs on a commit that changed nothing.
  # SEC A19 (2026-08-05) — Gitleaks sur TOUT l'historique, BLOQUANT, sans needs
  # (même forme que dependency-audit) : un secret commité doit rougir dans la
  # minute — chaque heure passée exige de le révoquer. Les findings historiques
  # analysés vivent dans .gitleaks.toml, jamais d'élargissement « pour passer ».
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    needs: preflight
    # docker login ghcr — image miroir gitleaks, P4-92 (contents:read répété : un bloc de job REMPLACE la racine)
    permissions:
      contents: read
      packages: read
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"
      # P4-92 — image tirée de NOTRE miroir ghcr (GitHub-interne : un 503 Docker
      # Hub ne rougit plus ce gate — vécu le 2026-08-11). Bump de version =
      # mettre à jour ICI et dans mirror-images.yml, relancer ce workflow-là.
      - name: Login to ghcr.io (mirror pull)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Run gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/maratech-fr/mirror-gitleaks:v8.30.0
          git /repo --no-banner -c /repo/.gitleaks.toml

  # SEC-14 (2026-08-05) — Semgrep PROMU EN GATE après triage des 69 findings
  # initiaux (corrigés ou justifiés : .semgrepignore + nosemgrep inline motivés).
  # Zéro token IA — le filet qui remplace la revue systématique retirée du
  # cycle. Un nouveau finding = --error → rouge.
  semgrep:
    name: Semgrep (security gate)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    needs: preflight
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run semgrep
        run: >
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest
          semgrep scan --config p/default --config p/security-audit
          --config p/react --config p/python --config p/php
          --error --timeout 120 --metrics=off
          --exclude 'node_modules' --exclude 'vendor' --exclude 'var'

  dependency-audit:
    name: Dependency Audit
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    # PR vers `main` et push main ; jamais sur une PR vers `lot/**` (vue à la PR finale du lot).
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    needs: preflight
    env:
      # Un projet compose PAR JOB et par tentative : deux jobs sur le même démon (runner
      # auto-hébergé) ne se voient jamais — conteneurs, volumes, réseaux et images au nom du
      # projet. Overlay `docker-compose.test.yml` : aucun port hôte publié. Chemins ABSOLUS :
      # un step en `working-directory: frontend` ne résoudrait pas un chemin relatif.
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      AMATEO_STACK: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/docker-compose.test.yml
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # PHP — reads composer.lock, no vendor install needed. --abandoned=ignore: an
      # abandoned package is not a vulnerability (Composer 2.7+ would fail on it by default).
      # Composer tourne dans le conteneur php-fpm (image de build-php-cached) : PHP n'est jamais
      # installé sur l'hôte du runner auto-hébergé, persistant et partagé.
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached
      - name: Composer audit
        # audit-retry : relance seulement sur endpoint indisponible, jamais sur une vulnérabilité (P4-171).
        run: .github/scripts/audit-retry.sh docker compose run --rm --no-deps php-fpm composer audit --locked --no-interaction --abandoned=ignore

      # Node — reads package-lock, no install needed. All deps are scanned (a runtime lib
      # misfiled under devDependencies still ships to browsers), gated at high+ so an
      # unfixable low/moderate advisory doesn't block every unrelated PR.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit
        working-directory: frontend
        run: ../.github/scripts/audit-retry.sh npm audit --audit-level=high

      # Python — audit the ENGINE IMAGE's actual installed versions (what ships), not a
      # fresh unpinned resolve. `pip freeze` omits pip/setuptools tooling by default, and
      # auditing the frozen list via an isolated pipx-run pip-audit means the tool never
      # perturbs (upgrades) the set it is meant to check. The local non-PyPI package is stripped.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: pip-audit
        run: |
          docker compose build engine
          docker compose run --rm --no-deps engine pip freeze | grep -vE '^(-e |clubscheduler-engine)' > engine-deps.txt
          .github/scripts/audit-retry.sh pipx run pip-audit --requirement engine-deps.txt

      # Démonte TOUJOURS la stack du job (conteneurs, volumes, images locales, orphelins) — même
      # job rouge ou annulé en cours : le démon du runner auto-hébergé est partagé et persistant.
      - name: Tear down the compose stack (always)
        if: always()
        uses: ./.github/actions/ci-stack-down

  # Static analysis AND code style. CS-Fixer lives here rather than in the `lint`
  # job because it needs the PHP container this job already pays for (that job has
  # no PHP setup at all — it lints docker-compose + the Makefile in ~5 s). Same
  # gate either way: both feed `blocking-tests`.
  # Until 2026-07-17, CS-Fixer ran NOWHERE in CI — combined with the dormant
  # pre-commit hook (roadmap P4-11), nothing guarded PHP code style, and main was
  # merged red on it twice (PRs #241 and #244).
  phpstan:
    name: PHPStan & CS-Fixer
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    if: github.event_name == 'pull_request'
    needs: preflight
    env:
      # Un projet compose PAR JOB et par tentative : deux jobs sur le même démon (runner
      # auto-hébergé) ne se voient jamais — conteneurs, volumes, réseaux et images au nom du
      # projet. Overlay `docker-compose.test.yml` : aucun port hôte publié. Chemins ABSOLUS :
      # un step en `working-directory: frontend` ne résoudrait pas un chemin relatif.
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      AMATEO_STACK: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/docker-compose.test.yml
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Run PHPStan
        run: docker compose exec -T php-fpm composer phpstan

      # Same command as `make -C backend cs` — dry-run, so CI reports the diff
      # instead of rewriting files. Fix locally with `make -C backend cs-fix`.
      - name: Run PHP-CS-Fixer (dry-run)
        run: docker compose exec -T php-fpm composer cs-fix -- --dry-run --diff

      # Garde d'hygiène des dépendances : composer-unused rougit sur un paquet de
      # `require` dont plus aucun symbole n'est utilisé dans src/. Les faux positifs
      # câblés par bundle/config/runtime sont ignorés EXPLICITEMENT, chacun avec sa
      # raison (`backend/composer-unused.php`).
      - name: Run composer-unused
        run: docker compose exec -T php-fpm composer composer-unused

      # Démonte TOUJOURS la stack du job (conteneurs, volumes, images locales, orphelins) — même
      # job rouge ou annulé en cours : le démon du runner auto-hébergé est partagé et persistant.
      - name: Tear down the compose stack (always)
        if: always()
        uses: ./.github/actions/ci-stack-down

  # P4-24 : Rector dans son PROPRE job, sans `needs` et sans être
  # une dépendance de quoi que ce soit — exactement la forme de `dependency-audit`,
  # et pour la même raison. `rector.php` tire ses règles des versions INSTALLÉES
  # (`withComposerBased`, `withPreparedSets`) : un bump dependabot peut donc élargir
  # une règle et rougir ce check sur un commit qui n'a rien changé. Le mettre dans
  # `phpstan` ferait sauter `blocking-tests` (isolation tenant/RLS) et `build-docker`
  # pour de la dérive de STYLE — un signal de forme prendrait le déploiement en otage.
  # Ici il rougit seul, demande un arbitrage humain, et ne bloque ni tests ni images.
  # ⚠ POUR QU'IL BLOQUE LE MERGE, il faut ajouter le contexte « Rector (style gate) »
  # aux required status checks de `main` (réglage repo). Sans ça il rougit sans
  # empêcher quoi que ce soit — c'est le piège de sortir une étape d'un job requis.
  rector:
    name: Rector (style gate)
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    if: github.event_name == 'pull_request'
    needs: preflight
    env:
      # Un projet compose PAR JOB et par tentative : deux jobs sur le même démon (runner
      # auto-hébergé) ne se voient jamais — conteneurs, volumes, réseaux et images au nom du
      # projet. Overlay `docker-compose.test.yml` : aucun port hôte publié. Chemins ABSOLUS :
      # un step en `working-directory: frontend` ne résoudrait pas un chemin relatif.
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      AMATEO_STACK: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/docker-compose.test.yml
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm postgres redis

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      # Dry-run : la CI rapporte le diff, elle ne réécrit pas. Pour CORRIGER en
      # local : `docker compose exec php-fpm sh -c 'cd /app/backend && composer rector'`
      # (`make -C backend rector` est lui aussi un dry-run — il montre, il ne fixe pas).
      - name: Run Rector (dry-run)
        run: docker compose exec -T php-fpm composer rector -- --dry-run

      # Démonte TOUJOURS la stack du job (conteneurs, volumes, images locales, orphelins) — même
      # job rouge ou annulé en cours : le démon du runner auto-hébergé est partagé et persistant.
      - name: Tear down the compose stack (always)
        if: always()
        uses: ./.github/actions/ci-stack-down

  blocking-tests:
    name: Blocking Tests
    runs-on: ${{ vars.CI_RUNS_ON || 'ubuntu-24.04' }}
    if: github.event_name == 'pull_request'
    env:
      # Un projet compose PAR JOB et par tentative : deux jobs sur le même démon (runner
      # auto-hébergé) ne se voient jamais — conteneurs, volumes, réseaux et images au nom du
      # projet. Overlay `docker-compose.test.yml` : aucun port hôte publié. Chemins ABSOLUS :
      # un step en `working-directory: frontend` ne résoudrait pas un chemin relatif.
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      AMATEO_STACK: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml:${{ github.workspace }}/docker-compose.test.yml
    # Un step bloqué (verrou apt, téléchargement figé) consommerait sinon le défaut
    # GitHub de 6 h : il occupe un exécutant, bloque la file, et ne dit RIEN.
    timeout-minutes: 45
    needs: [preflight, lint, phpstan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner auto-hébergé PERSISTANT et partagé : les identifiants Docker de ce job (logins
      # Docker Hub / ghcr) vont dans un DOCKER_CONFIG propre au job, jamais dans celui du runner.
      # Posé par GITHUB_ENV : le contexte `runner` est interdit dans un `env` de job.
      - name: Isolate the Docker credentials of this job
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "HOME=$HOME"

      # Connexion Docker Hub avant tout tirage : les runners partagés GitHub épuisent le
      # quota ANONYME (429 Too Many Requests — incident 2026-10-09, python:3.12-slim refusé).
      # Conditionnelle : sans les secrets (PR de fork) la CI tire en anonyme, comme avant.
      - name: Login to Docker Hub (anti-429)
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare .env
        run: |
          cp .env.dist .env
          printf 'USER_ID=%s\nGROUP_ID=%s\n' "$(id -u)" "$(id -g)" >> .env

      # P4-90 — la couche chère de l'image php vient du cache GHA (voir l'action).
      - name: Pre-build php image (GHA cache)
        uses: ./.github/actions/build-php-cached

      - name: Start services
        run: docker compose up -d --wait php-fpm engine

      # P4-100 — cache de backend/vendor + retry : un 5xx du registre ne doit
      # plus rougir une PR saine (voir l'action).
      - name: Install PHP deps (cached + retried)
        uses: ./.github/actions/composer-install-cached

      - name: Generate JWT keys
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction'

      - name: Init test database
        run: docker compose exec -T php-fpm sh -c 'cd /app/backend && php bin/console doctrine:database:create --if-not-exists --connection admin --env=test && php bin/console doctrine:migrations:migrate --no-interaction --env=test'

      # Le gate en DEUX processus PHPUnit (au lieu d'un step par fichier) : la suite `--group
      # phase1` ci-dessous, puis le NR tenant filtré (non phase1) juste après. Chaque fichier
      # garde, en commentaire shell au-dessus de son chemin, la raison pour laquelle il gate.
      # `-d memory_limit=1G` : ~133 fichiers dans un processus, même flag que `backend-tests`.
      # La liste de docs/testing/blocking-tests.md doit rester EXACTEMENT celle des chemins de
      # ce step + le step filtré (garde BlockingTestsListMatchesCiTest, dans les deux sens).
      - name: Blocking suite (phase1, one PHPUnit process)
        run: |
          FILES=""
          # Régime de la CI sur le runner auto-hébergé (NR de tous les axes : il décide QUAND
          # tournent leurs NR) — routage par variable, garde fork, régime par branche cible (gate
          # complet sur chaque PR vers main, léger vers lot/**), étanchéité des jobs sur le démon
          # partagé, bloquants en deux processus.
          FILES="$FILES tests/Unit/Documentation/CiWorkflowRegimeTest.php"
          # L'axe auth/memberships : sans ce test dans le gate BLOQUANT, une
          # re-suppression de `eraseCredentials` (bump Rector + `make rector` pour
          # verdir le job de style) passe tous les checks requis.
          FILES="$FILES tests/Unit/Entity/UserInterfaceContractTest.php"
          # Axe auth/memberships (P4-263) : le refus de connexion parle français
          # (« Identifiants invalides. » via le socle de traduction) ET reste
          # byte-identique entre mauvais mot de passe et compte non vérifié
          # (anti-énumération). Sans ce gate, retirer symfony/translation ou donner un
          # message distinct à l'un des deux chemins passerait les checks requis.
          FILES="$FILES tests/Security/LoginFailureCopyTest.php"
          # Axe auth & memberships — la connexion démo ne s'ouvre que pendant sa fenêtre
          # d'activation : hors fenêtre, un compte démo est refusé d'une manière byte-identique
          # à un mauvais mot de passe (aucun oracle) ; dans la fenêtre il se connecte. Sans ce
          # gate, une régression rendrait la garde silencieuse et la démo joignable en prod.
          FILES="$FILES tests/Security/DemoWindowTest.php"
          # Dépôt PUBLIC — les coachs du club pilote (seed BCCL) ne portent que des
          # libellés NEUTRES (« Coach » + numéro de clé) dans le seeder, les fixtures
          # moteur et les fichiers liés ; sans fichier local, le profil dev n'injecte
          # rien. Garde statique par liste autorisée, sans DB : un rouge nomme
          # fichier:ligne, jamais la valeur. Sans ce gate, un vrai surnom recollé au
          # seed passerait les checks requis.
          FILES="$FILES tests/Security/BcclSeedIdentityNeutralityTest.php"
          # Axes auth & memberships + tenant isolation — la console démo (PR B du lot Démos) : un JWT
          # club ne franchit pas /api/admin/demos, toute écriture exige le CSRF, activate ouvre une
          # fenêtre de 4 h à l'horloge RÉELLE (re-clic = redémarrage, jamais addition), le reset remet
          # simulated_today à null SANS toucher la fenêtre ni un autre club démo, et le re-seed refuse de
          # purger un club non-démo tenant ARA9999999 (un vrai club n'est jamais détruit).
          FILES="$FILES tests/Integration/Admin/AdminDemoResetTest.php"
          # Axes auth & memberships + tenant isolation — le widget d'horloge du compte DÉMO
          # (POST /api/club/clock) : un gestionnaire d'un club démo pose/relâche l'horloge, un membre
          # non gestionnaire est refusé (403), un gestionnaire d'un VRAI club est refusé (403) et son
          # horloge reste intacte, date malformée 422, le clear relâche ET vide la boîte, et poser
          # l'horloge d'un club n'en touche jamais un autre.
          FILES="$FILES tests/Integration/Api/ClubClockEndpointTest.php"
          # Axe tenant isolation — la purge nocturne des démos prospect : le club démo de la veille est
          # détruit (FFBB libéré), mais un démo du jour, un démo partagé, un vrai club et la démo BCCL
          # permanente ne bougent jamais. Sans ce gate, un élargissement du prédicat détruirait un vrai
          # club ou la démo permanente en silence.
          FILES="$FILES tests/Integration/Command/DemoPurgeStaleCommandTest.php"
          # Axe auth & memberships — P4-294, conserver 14 j le club démo d'un prospect puis le reprendre
          # par l'approbation P3-4 : « Conserver » refusé (409) fenêtre ouverte, accepté fermée (animateur
          # détaché, horloge nulle, échéance posée) ; l'approbation reprend le club conservé homonyme
          # (is_demo=false, crédits 0, gestionnaire actif, nom conservé, jamais un 2e club) ; un club RÉEL
          # du même code garde la priorité ; deux conservés même code → le plus récent ; la purge détruit un
          # conservé expiré, épargne un non expiré et un repris. Sans ce gate, un club conservé deviendrait
          # immortel, ou l'approbation créerait un club neuf au lieu de reprendre l'espace de la démo.
          FILES="$FILES tests/Security/DemoRetainedClubReclaimTest.php"
          # Axe auth & memberships — chemin d'abus « export anonyme » : les DEUX routes d'export d'un
          # planning (export-pdf async ET export-xlsx sync) sont derrière le firewall JWT (401 sans
          # session) et rien n'est enfilé. Sans ce gate, ouvrir une route d'export en anonyme (un
          # planning PDF/XLSX divulgué) passerait tous les checks requis de `main`.
          FILES="$FILES tests/Security/ExportAuthenticationTest.php"
          # Axe tenant isolation (P4-357) — le rendu PDF se télécharge par la route AUTHENTIFIÉE
          # GET /api/schedules/{id}/export-pdf/{filename}, plus par une URL statique publique. Un club B
          # visant l'URL d'un rendu du club A obtient un 404 byte-identique à un planning inconnu (aucune
          # divulgation d'existence), une traversée / un nom hors motif / le nom d'un autre planning sont
          # refusés 404, et le disque reste intact. Sans ce gate, un rendu PDF d'un autre club serait
          # téléchargeable par énumération d'URL et passerait tous les checks requis de `main`.
          FILES="$FILES tests/Security/ExportPdfDownloadIsolationTest.php"
          # Axes auth & memberships + tenant isolation (D3) — un cookie de session JWT mort ne bloque
          # plus les pages publiques : sur une route PUBLIC_ACCESS du firewall `api`, le cookie BEARER et
          # l'en-tête Authorization sont neutralisés AVANT le firewall (réponse byte-identique au cas sans
          # jeton, même sous un jeton VALIDE — aucune identité résolue, aucun GUC tenant posé), et sur une
          # route protégée un cookie mort est purgé au 401 (jamais sur un échec Bearer). Sans ce gate, un
          # retrait du neutraliseur ou du purgeur rendrait « Se déconnecter » / l'inscription impossibles
          # sur une session expirée, en silence, en passant tous les checks requis de `main`.
          FILES="$FILES tests/Security/PublicRouteStaleJwtTest.php"
          # Axe auth & memberships — le seed BCCL de PROD pose des gestionnaires PRÉ-VÉRIFIÉS,
          # rattachés au bon club, avec des mots de passe pilotés par options (les mots de passe
          # dev du dépôt n'ouvrent pas les comptes prod), refuse sans credentials, create-only.
          # Sans ce gate, une régression sur la vérification d'e-mail ou un credential en dur
          # passerait tous les checks requis de `main`.
          FILES="$FILES tests/Integration/Command/BcclProdSeedCommandTest.php"
          # Coûte 0,2 s et attrape une classe de défaut qui a ATTEINT `main` le 2026-08-21
          # (marqueurs de `git stash pop` commités dans un journal Markdown, PR #682) : rien
          # d'autre ne la voit — ni linter, ni test, ni revue humaine sur un diff de prose.
          FILES="$FILES tests/Unit/NoMergeConflictMarkerTest.php"
          # NOTE : `SymfonyStackAlignmentTest` (dérive du stack hors LTS 7.4) tourne
          # dans `backend-tests`, PAS ici. Une chaîne de version n'a pas sa place dans
          # le job qui gate `build-docker` : un bump dependabot remontant un split
          # Symfony ferait rougir `blocking-tests` AVANT même que
          # TenantIsolationTest/RlsIsolationTest ne s'exécutent (étapes suivantes du
          # même job), et bloquerait le déploiement du correctif de sécurité que ce
          # bump apportait. C'est la raison exacte pour laquelle Rector a quitté le
          # job `phpstan` (P4-24 b) et pour laquelle `dependency-audit` n'a pas de
          # `needs` : une dérive de dépendance se signale, elle ne prend pas la
          # livraison en otage.
          FILES="$FILES tests/Security/TenantIsolationTest.php"
          # Axe tenant isolation — le contexte automatique d'un signalement (Chantier F) est
          # calculé SERVEUR depuis le club authentifié : un client qui injecte dans `context`
          # les ids d'un autre club (clubId/planId/seasonId) ne fait JAMAIS lire ce club —
          # ces clés sont hors whitelist, l'enrichisseur ne lit que le club de l'auteur, et le
          # JSON stocké ne contient aucun identifiant étranger. Sans ce gate, un signalement
          # fuiterait les données d'un autre club dans la console superadmin.
          FILES="$FILES tests/Security/FeedbackContextIsolationTest.php"
          FILES="$FILES tests/Security/SeasonIsolationTest.php"
          FILES="$FILES tests/Security/SeasonReadonlyTest.php"
          FILES="$FILES tests/Security/MatchTenantIsolationTest.php"
          FILES="$FILES tests/Security/TenantCacheIsolationTest.php"
          FILES="$FILES tests/MessageHandler/ComputeTravelTimesHandlerTest.php"
          FILES="$FILES tests/Queue/ConcurrentGenerationTest.php"
          FILES="$FILES tests/CrossStack/ContractSchemaTest.php"
          FILES="$FILES tests/CrossStack/PayloadVersionMatchesContractVersionTest.php"
          FILES="$FILES tests/CrossStack/ValidateAssignmentsContractSchemaTest.php"
          FILES="$FILES tests/Security/RlsIsolationTest.php"
          # P4-16 — un club à horloge simulée n'envoie JAMAIS de vrai e-mail : il est rangé
          # dans sa boîte, l'enfilage est rejeté, et un autre club ne voit jamais cette boîte
          # (RLS). Sans ce gate BLOQUANT, une régression du listener d'interception enverrait
          # de vrais e-mails aux gestionnaires pendant une démo rejouée dans le passé/futur —
          # invisible aux autres checks, qui n'exercent pas l'enfilage sous horloge.
          FILES="$FILES tests/Integration/Mail/ClockedClubMailInterceptTest.php"
          # P5-20 — rôle Postgres de lecture seule amateo_read : SELECT scopé au club,
          # aucune écriture (refus privilège), aucune porte admin_all, et une garde du
          # futur (toute table club_id doit porter sa policy readonly_tenant). Sans ce
          # gate BLOQUANT, une table tenant ajoutée sans policy rendrait l'opérateur
          # aveugle en silence, ou une policy USING(true) posée à la main lui ouvrirait
          # le cross-club — invisible aux autres checks.
          FILES="$FILES tests/Security/ReadOnlyRoleTest.php"
          # Axe tenant isolation — rappel e-mail des vacances scolaires : le cron joint un
          # référentiel GLOBAL (school_holiday_period, sans RLS) aux données de CHAQUE club.
          # Ce qui ferme le rappel d'un club (vacance ignorée, coupure couvrante, version)
          # ne se lit jamais chez un autre — chaque requête du résolveur porte sa ceinture
          # club_id, falsifiée une à une — et le palier envoyé à un club n'en marque jamais
          # un autre. Sans ce gate, un club recevrait (ou perdrait) les rappels d'un autre.
          FILES="$FILES tests/Security/HolidayReminderStateIsolationTest.php"
          FILES="$FILES tests/Command/PeriodReminderCommandTest.php"
          # P4-272 ② — la suggestion de plages de ligue LIT à travers la frontière tenant
          # (fonction SQL SECURITY DEFINER). Sans ce gate BLOQUANT, une régression du seuil,
          # de la majorité, du groupement d'instance, de l'exclusion du demandeur, ou une
          # fuite de donnée club-identifiante passerait tous les checks requis.
          FILES="$FILES tests/Security/LeagueWindowSuggestionShareTest.php"
          FILES="$FILES tests/Security/ClubAccessTest.php"
          FILES="$FILES tests/Security/UserSelfOnlyTest.php"
          FILES="$FILES tests/Security/ImportAuthorizationTest.php"
          FILES="$FILES tests/Security/MercureHardeningTest.php"
          # NR d'axe GENERATION PIPELINE — le dernier maillon Mercure : une update PRIVÉE publiée sur
          # chacun des 3 topics d'un club (génération, trajets, placement) est RÉELLEMENT délivrée par
          # le HUB RÉEL à un abonné du club (protocole 1.0, abonnement `match`/`match_urlpattern`, jeton
          # en en-tête Authorization), et JAMAIS à un abonné d'un autre club (frontière tenant prouvée
          # AU HUB, pas seulement dans la forme du claim). Le hub est démarré via le depends_on de
          # php-fpm (service_healthy). Sans ce gate, un cutover 1.0 désynchronisé (jeton ↔ hub ↔ topics)
          # couperait le temps réel en silence — le front dégrade en polling, aucun autre test ne le voit.
          FILES="$FILES tests/Integration/Mercure/MercureEndToEndDeliveryTest.php"
          FILES="$FILES tests/Security/ManagementRoleTest.php"
          FILES="$FILES tests/Security/ApiRateLimitTest.php"
          # P5-3a — parité anti-énumération du rail mot de passe (hash factice, mail par le bus, 429 reset).
          FILES="$FILES tests/Security/PasswordResetEnumerationTest.php"
          # P5-3b — Turnstile sur le register (NR d'axe auth) : inerte sans secret, 403 fail-closed
          # sur verdict, fail-open sur panne transport, 403 identique frais/connu, rate-limit prioritaire.
          FILES="$FILES tests/Security/RegisterTurnstileTest.php"
          # P4-298 — le lookup public du NOM de club à l'inscription (NR d'axe auth, surface anonyme
          # adjacente au register) : réponse found SANS mail, unknown franc, code malformé SANS appel
          # sortant, FFBB muette → unavailable (jamais 500), gating off → unavailable sans sortie, et
          # le limiteur IP dédié épuisé → 429. Sans ce gate, le mail du club pourrait fuiter dans la
          # réponse ou l'énumération de codes s'ouvrir, invisible aux autres checks.
          FILES="$FILES tests/Security/RegisterClubLookupTest.php"
          # Améliorations légères #1 (revient sur P4-298) — l'inscription RE-RÉSOUT elle-même le nom du
          # club auprès de la FFBB et IGNORE le `club_name` soumis quand la fédération connaît le code
          # (nom menteur neutralisé) ; FFBB muette + nom vide → 400 « nom requis » jamais 500 ; la
          # réponse 202 ne révèle jamais le nom résolu ni ne dépend de l'existence d'un compte ; un code
          # malformé ne sort jamais vers la FFBB. Sans ce gate, un attaquant imposerait un nom de club
          # arbitraire ou la panne FFBB deviendrait une 500, invisible aux autres checks.
          FILES="$FILES tests/Security/RegisterClubNameResolutionTest.php"
          # P4-45 — le pendant PAR CLUB de SEC-11. Step nommé, donc réellement bloquant :
          # porter `phase1` ne suffit pas (cf. le commentaire P2-9ter plus bas).
          FILES="$FILES tests/Security/ClubQuotaTest.php"
          FILES="$FILES tests/Security/SuperAdminAccessTest.php"
          FILES="$FILES tests/Security/EngagedTeamGuardTest.php"
          # Axe périmètre engagé — la résorption des jumelles au confirm d'appariement FFBB
          # ne supprime qu'une compétition VIDE et ne ré-affecte jamais un match. Sans ce gate,
          # un élargissement effacerait un périmètre déjà engagé en silence.
          FILES="$FILES tests/Security/FfbbConfirmPerimeterTest.php"
          # Axes périmètre engagé + constraint semantics — le niveau d'une équipe jeune suit son
          # engagement FFBB par clic : la garde générique du PUT reste souveraine, le confirm n'aligne
          # que sur demande explicite et avec la valeur SERVEUR re-déduite. Sans ce gate, affaiblir la
          # garde ou écrire un niveau client / sur une ligne inéligible passerait invisible.
          FILES="$FILES tests/Security/FfbbLevelAlignmentTest.php"
          FILES="$FILES tests/Security/PeriodPlanBirthTest.php"
          # « L'adaptation naît comme une copie du socle » (axes generation pipeline + planning
          # lifecycle) : la V1 d'un plan de période transcrit la version pointée du socle, filtrée des
          # réglages/fermetures de la période — falsifié dans les deux sens, avec la liste « à replacer ».
          FILES="$FILES tests/Security/PeriodCopyBirthTest.php"
          # P2-44 PR-5 (axes generation pipeline + planning lifecycle) : les écarts NOMMÉS entre une
          # version affichée d'un plan de FERMETURE et la version pointée du socle — séances déplacées
          # (appariement chronologique) et non replacées (raison SERVIE par la sélection, null quand
          # inexpliquée). Falsifié dans les deux sens, plus les refus (422 saison/vacances, 409 non
          # COMPLETED / socle non pointé, tenant) et la lecture ouverte au Membre.
          FILES="$FILES tests/Security/SocleDeviationParityTest.php"
          # P2-38 prévention (axe planning lifecycle — ADR-0002 inv. 4) : la route de lecture
          # GET /api/planned-windows sert EXACTEMENT les fenêtres que la garde d'écriture refuse
          # en 409 window_already_planned — même prédicat par construction (foyer unique
          # governingWindows), prouvé par le comportement, falsifié dans les deux sens. Plus la
          # famille (ni servie ni refusée), l'isolation saison/club (404), le chevauchement partiel
          # aux bornes, le chemin pending (seasonId) et la lecture ouverte au Membre.
          FILES="$FILES tests/Security/PlannedWindowsParityTest.php"
          # D3 v2 (P4-174, axe planning lifecycle) : re-dater une indisponibilité DÉCOUPÉE = aperçu
          # servi + confirmation. On apparie les anciens enfants aux nouveaux segments (rôle prime),
          # verdicts keep/shift/absorb/vanish/birth + « les vacances ont la main » ; jeton d'aperçu
          # confronté sous verrous (périmé → 409), PUT sans jeton → 422, aperçu == effets appliqués.
          FILES="$FILES tests/Security/SplitMotherRedateTest.php"
          # Fermeture qui ENJAMBE des vacances (fondateur 2026-10-27, axe planning lifecycle) : le rail
          # NEUF /window-preview + /window prolonge/raccourcit une fermeture d'un bloc, aperçu puis
          # confirmation. Milieu ré-ancré (même version), fins/après-vacances en copies VALIDÉES, datée
          # étendue (plancher « le passé ne bouge pas » servi), reprises recoupées « à régénérer », inv. 14,
          # jeton recalculé sous verrous, et les abus (tenant 404 byte-identique, jeton, rôle, saison archivée).
          FILES="$FILES tests/Security/ClosureWindowExtendTest.php"
          # Fermetures de gymnase, « Enregistrer vaut geste » (fondateur 2026-11-02, axe planning
          # lifecycle) : déclarer / re-dater / élargir une fermeture retire, dans la même transaction et
          # sous le verrou de génération du club, les verrous HARD (version chargée) et les réservations
          # des plans de période qui gouvernent les jours fermés nouveaux — jamais le socle ni un autre
          # jour/gymnase ; 409 si une génération est en vol ; un échec annule tout.
          FILES="$FILES tests/Security/ClosureRemovesPinsAtomicallyTest.php"
          # Même chantier : un plan de période validé touché par une fermeture est périmé, se régénère
          # une fois rouvert (202), sans épingle au gymnase fermé et avec celles des autres jours.
          FILES="$FILES tests/Security/StalePeriodPlanRegenerationTest.php"
          # Même chantier : l'aperçu du formulaire, l'impact de la fermeture enregistrée et le retrait
          # disent le même chiffre (famille écartée, jamais le socle, tenant).
          FILES="$FILES tests/Security/ClosureImpactSaysTheSameEverywhereTest.php"
          # RMM-3 (axe constraint semantics — le radar de conflits) : le gardien à l'ouverture stampe une
          # référence de VISITE et sert le delta « depuis ta dernière visite ». L'empreinte d'un conflit est
          # son IDENTITÉ stable — une nature changée (autre paire, MATCH_MATCH→MATCH_TRAINING) est signalée,
          # une sévérité/segment ou un compteur qui bougent SEULS ne le sont pas. Falsifié dans les deux sens,
          # plus l'isolation user (le stamp d'Anna n'éteint pas le delta de Mateo) + club + saison, le F5 dans
          # la grâce (référence intacte), planningChanged dans les deux sens, le Membre autorisé, la première
          # visite muette, et la saison archivée qui stampe quand même.
          FILES="$FILES tests/Security/MatchVisitDeltaParityTest.php"
          FILES="$FILES tests/Security/SeasonVersionUniquenessTest.php"
          FILES="$FILES tests/Security/SeasonPlanInForceTest.php"
          # P2-14 (axe constraint semantics) : le gate pré-solve valide EXACTEMENT le jeu de
          # contraintes que le payload sérialise — parité tenue par la source unique
          # PeriodConstraintSelector, plus par deux copies manuelles.
          FILES="$FILES tests/Security/PeriodGatePayloadParityTest.php"
          # P2-9 PR A (axe constraint semantics) : le volet capacité du récap, dans les deux
