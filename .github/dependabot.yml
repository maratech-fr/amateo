# Dependabot — scan automatisé des dépendances (audit supply-chain, le -10).
# Couvre les 4 écosystèmes du monorepo. MAJ hebdomadaires, groupées par
# écosystème pour limiter le bruit de PRs ; les alertes de sécurité (GHSA)
# ouvrent des PRs même hors fenêtre grâce à Dependabot security-updates
# (activé au niveau du repo : Settings → Code security → Dependabot).
version: 2
updates:
  # Engine — Python (pip, lit engine/pyproject.toml [project] + [dev])
  - package-ecosystem: "pip"
    directory: "/engine"
    schedule:
      interval: "weekly"
    # SEC-14 : 7 jours de refroidissement — un paquet publié il y a une heure
    # peut être un hijack de mainteneur ; on laisse la communauté le voir
    # d'abord. Les security-updates GHSA passent outre (voulu).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      engine-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "engine"]

  # Frontend — npm (lit frontend/package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # SEC-14 : 7 jours de refroidissement — un paquet publié il y a une heure
    # peut être un hijack de mainteneur ; on laisse la communauté le voir
    # d'abord. Les security-updates GHSA passent outre (voulu).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "frontend"]

  # Backend — Composer (lit backend/composer.lock)
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # SEC-14 : 7 jours de refroidissement — un paquet publié il y a une heure
    # peut être un hijack de mainteneur ; on laisse la communauté le voir
    # d'abord. Les security-updates GHSA passent outre (voulu).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      backend-composer:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Symfony reste en LTS 7.4 jusqu'à la 8.4 (~nov. 2027, CLAUDE.md §5) : Flex
    # borne déjà `extra.symfony.require` à 7.4.*, mais Dependabot ignore cette
    # contrainte et proposait des paquets Symfony en 8.x (PR #1093 : symfony/string
    # 8.0.15, symfony/var-exporter 8.0.16 → rouge `SymfonyStackAlignmentTest`). On
    # bloque toute la 8.x : la montée de majeure est une décision, pas un bump auto.
    ignore:
      - dependency-name: "symfony/*"
        versions: [">=8.0"]
    labels: ["dependencies", "backend"]

  # CI — GitHub Actions (lit .github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # SEC-14 : 7 jours de refroidissement — un paquet publié il y a une heure
    # peut être un hijack de mainteneur ; on laisse la communauté le voir
    # d'abord. Les security-updates GHSA passent outre (voulu).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  # Docker — images de base des Dockerfiles (lit les `FROM`). Une entrée par
  # DOSSIER contenant un Dockerfile : Dependabot docker ne scanne qu'un dossier
  # à la fois et détecte tout fichier dont le nom contient « dockerfile »
  # (docker/postgres/Dockerfile.prod inclus). Même cadence/refroidissement/
  # regroupement/labels que les écosystèmes ci-dessus.
  - package-ecosystem: "docker"
    directory: "/docker/php"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-php:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/docker/engine"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-engine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/docker/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Node est épinglé à une MAJEURE choisie (LTS) : un saut de majeure est une
    # décision, pas un bump automatique (#1055 Node 26 fermée, fondateur 2026-10-02).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/docker/pdf-worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-pdf-worker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "docker"]

  - package-ecosystem: "docker"
    directory: "/docker/postgres"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-postgres:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # PostgreSQL est épinglé à une MAJEURE : un saut de majeure impose une
    # migration de données, c'est une décision (#1052 PG 18 fermée, fondateur 2026-10-02).
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "docker"]

  # Compose — images tierces épinglées DANS les fichiers compose eux-mêmes (pas
  # un `FROM` de Dockerfile : l'écosystème `docker` ci-dessus ne les voit pas).
  # Ajouté pour suivre l'image Umami de `docker-compose.prod.yml` (P4-276) ; il
  # couvre DU MÊME COUP les autres pins compose encore non suivis — `dunglas/
  # mercure` et `redis:7-alpine` (dev ET prod) : chaque bump reste une PR que le
  # fondateur merge ou ferme (effet de bord assumé, 2026-10-06).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-compose:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Les sauts de MAJEURE de ces images sont des décisions, pas des bumps auto —
    # Dependabot les ouvrait une par une (#1105 umami, #1104 postgres, #1103 redis,
    # #1102 mercure, toutes fermées). ⚠ Le `dependency-name` est le nom d'image
    # SANS le registre `ghcr.io/` (c'est pourquoi l'ancienne règle
    # `ghcr.io/umami-software/umami` ne matchait pas #1105).
    ignore:
      # Umami : tag v3 en semver propre (`3.x.y`), semver-major suffit (3 → 4).
      - dependency-name: "umami-software/umami"
        update-types: ["version-update:semver-major"]
      # PostgreSQL (dev `postgres:16-alpine`) : une majeure impose une migration
      # de données. La prod est déjà couverte par le bloc docker /docker/postgres.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Redis (dev+prod `redis:7-alpine`) : Redis 8 pose une question de licence,
      # à trancher à part (roadmap P4-310).
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      # Mercure (dev `v0.24.2`, prod `v0.19`) : en 0.x `semver-major` ne capte
      # pas le saut 0.x → 1.0, on borne donc par version. On laisse passer les
      # bumps 0.x (dont l'alignement dev/prod — roadmap P4-310) et on bloque la
      # montée majeure 1.0, qui est une décision.
      - dependency-name: "dunglas/mercure"
        versions: [">=1.0.0"]
    labels: ["dependencies", "docker"]
