# ClubScheduler — PROD stack. Standalone on purpose (NOT an overlay of the dev
# docker-compose.yml): no bind-mounted code, no dev-only services (mailpit,
# frontend-dev, frontend-tooling), every image is self-contained and pulled
# from ghcr.io by tag. The VM only needs this file, a filled .env.prod, the
# JWT keypair directory, and Docker.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# `build:` sections are kept so the whole stack can be built and rehearsed
# locally (docker compose -f docker-compose.prod.yml build); the VM never
# builds — it pulls (deploy workflow, docs/ops/deploy.md).
#
# RAM limits per service come from specs/initiales/ClubScheduler_v3.md §2.2
# (INF-03). Log rotation: json-file 10m × 3 per service (x-logging).

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  frontend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env.prod}/scheduler-frontend:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: prod
    container_name: amateo-frontend
    # Only published port of the whole stack — bound to localhost, the host
    # reverse-proxy (Caddy, TLS) is the actual internet-facing edge.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      nginx:
        condition: service_healthy
      mercure:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 64m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  php-fpm:
    image: ghcr.io/${GHCR_OWNER:?}/scheduler-php:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: amateo-php-fpm
    working_dir: /app/backend
    env_file:
      - ./.env.prod
    environment:
      APP_ENV: prod
      MERCURE_PUBLIC_URL: "${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.prod}/.well-known/mercure"
    volumes:
      # JWT keypair generated ON the VM at first install (runbook) — never in the image.
      - ./jwt:/app/backend/config/jwt:ro
      - backups:/app/backend/var/backups
      - logo_storage:/app/backend/var/storage
      - exports:/app/backend/public/exports
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    healthcheck:
      # Real liveness: the FPM master must ACCEPT FastCGI connections — a mere
      # config parse (php-fpm -t) can never fail at runtime in an immutable image.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 1g > v3 §2.2's 512M: sized to the FPM memory model (4×192M children +
    # 192M opcache shm + master — see docker/php/Dockerfile zz-prod-pool).
    mem_limit: 1g
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  nginx:
    image: ghcr.io/${GHCR_OWNER:?}/scheduler-nginx:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx-prod
    container_name: amateo-nginx
    depends_on:
      php-fpm:
        condition: service_healthy
    volumes:
      # pdf-worker writes exports at runtime; nginx serves them (/exports/).
      - exports:/app/backend/public/exports:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 64m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  postgres:
    image: ghcr.io/${GHCR_OWNER:?}/scheduler-postgres:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile.prod
    container_name: amateo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Consumed once by the 02-users.sh init script (first cluster init only).
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  redis:
    image: redis:7-alpine
    container_name: amateo-redis
    # AOF + a named volume: the Messenger queue and rate-limiter state survive
    # a container restart (dev deliberately has no redis volume — prod must).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  messenger-worker:
    image: ghcr.io/${GHCR_OWNER:?}/scheduler-php:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: amateo-messenger-worker
    working_dir: /app/backend
    env_file:
      - ./.env.prod
    environment:
      APP_ENV: prod
    volumes:
      - ./jwt:/app/backend/config/jwt:ro
      - backups:/app/backend/var/backups
      - logo_storage:/app/backend/var/storage
      - exports:/app/backend/public/exports
    command: >-
      php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --no-interaction
    depends_on:
      php-fpm:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$cmd = @file_get_contents(\"/proc/1/cmdline\"); exit(strpos($$cmd, \"messenger:consume\") === false ? 1 : 0);'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Above the worker's PHP --memory-limit=256M so Messenger's graceful stop
    # fires before the kernel OOM-killer (which would SIGKILL mid-message).
    mem_limit: 384m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  # Minute scheduler tick (app:jobs:run-due, Europe/Paris cadences — SA3-C).
  cron-runner:
    image: ghcr.io/${GHCR_OWNER:?}/scheduler-php:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    container_name: amateo-cron-runner
    working_dir: /app/backend
    env_file:
      - ./.env.prod
    environment:
      APP_ENV: prod
    volumes:
      - ./jwt:/app/backend/config/jwt:ro
      - backups:/app/backend/var/backups
      - logo_storage:/app/backend/var/storage
    # `|| true` keeps ONE failed tick from killing the loop, but each success
    # touches a witness file — the healthcheck goes red when no tick has
    # SUCCEEDED for 5 minutes, so a permanently-failing run-due (bad DSN,
    # missed migration) cannot hide behind an always-green "loop is alive".
    command: >-
      sh -lc 'while true; do
        (php bin/console app:jobs:run-due --no-interaction && date +%s > /tmp/last-tick-ok) || true;
        sleep 60;
      done'
    depends_on:
      php-fpm:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # 30 min threshold: the nightly backup tick (pg_dump + off-site rclone
      # upload, inline) can legitimately run several minutes on a grown DB —
      # 5 min would red the board every night and train the operator to ignore
      # it. A permanently-failing run-due still goes red within the half hour.
      test: ["CMD-SHELL", "php -r 'exit((time() - (int) @file_get_contents(\"/tmp/last-tick-ok\")) < 1800 ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    # Jobs run pg_dump (nightly backup) in the same cgroup as the PHP tick —
    # headroom over the 192M request limit.
    mem_limit: 384m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  engine:
    image: ghcr.io/${GHCR_OWNER:?}/scheduler-engine:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/engine/Dockerfile
    container_name: amateo-engine
    working_dir: /app/engine
    environment:
      PYTHONUNBUFFERED: "1"
      ENGINE_ENVIRONMENT: prod
      ENGINE_SENTRY_DSN: ${ENGINE_SENTRY_DSN:-}
    # NO published port: the engine is only reachable from the backend on the
    # internal network (and the prod edge conf has no /engine/ proxy).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()\""]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  pdf-worker:
    image: ghcr.io/${GHCR_OWNER:?}/scheduler-pdf-worker:${VERSION:-latest}
    build:
      context: .
      dockerfile: docker/pdf-worker/Dockerfile
    container_name: amateo-pdf-worker
    working_dir: /app/frontend
    # Same uid as the php image's www-data (usermod'ed to 1000 at build): both
    # write/read the shared exports volume without a chown dance.
    user: "1000:1000"
    volumes:
      - exports:/app/backend/public/exports
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # Chrome needs a writable $HOME (crashpad/profile) for an arbitrary uid,
      # while the browser binary stays in the image's puppeteer cache.
      HOME: /tmp
      PUPPETEER_CACHE_DIR: /home/pptruser/.cache/puppeteer
    command: ["node", "worker.js"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -fa 'node worker.js' >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

  mercure:
    # Pinned (dev uses :latest): same immutability contract as our own images —
    # a routine `docker compose pull` must never silently swap the hub version.
    image: dunglas/mercure:v0.19
    container_name: amateo-mercure
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?}
      # Browser subscribers connect through the frontend proxy on the public
      # origin — that origin is the only one allowed (no dev localhost list).
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${PUBLIC_BASE_URL:?}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    restart: unless-stopped
    <<: *logging
    networks:
      - amateo_network

networks:
  amateo_network:
    name: amateo_network

volumes:
  postgres_data:
  redis_data:
  backups:
  logo_storage:
  exports:
