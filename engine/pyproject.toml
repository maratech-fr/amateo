[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clubscheduler-engine"
version = "0.1.0"
description = "ClubScheduler scheduling engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "ortools>=9.11,<10",
  "uvicorn[standard]>=0.30,<1",
  "sentry-sdk[fastapi]>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-timeout>=2,<3",
  "pytest-cov>=5,<8",
  "hypothesis>=6,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
  "bandit>=1.7,<2",
  "deptry>=0.20,<1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not perf'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "perf: slow performance-gate tests (dense-club budget); excluded by default, run on CI main (dense + BCCL) and on PR when engine/ changes (dense only, job engine-perf-pr)",
]

# Couverture (P4-166) — le plancher (cliquet B3) vit dans `coverage-floor.json` à la
# racine, PAS ici : une seule maison, passée par `--cov-fail-under` (voir la cible
# `coverage` du Makefile et le job CI `engine-coverage`). Ne PAS ajouter `fail_under`.
[tool.coverage.run]
source = ["app"]
branch = false
# B4 — exclusions déclarées, pas implicites. `--cov=app` exclut déjà `tests/`. Aucun
# fichier généré ni `__main__` dans `app/` (l'entrée FastAPI est `app/main.py`, du
# domaine) : rien à retirer aujourd'hui. La liste reste explicite pour que tout ajout
# futur (code généré, script d'entrée hors domaine) soit un choix visible en diff.
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Broaden beyond the defaults (E4/E7/E9/F): imports order (I), bugbear (B),
# pyupgrade (UP), simplify (SIM), comprehensions (C4), warnings (W), Ruff (RUF).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # line length: cosmetic; format handles code, long French strings remain
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode: legitimate French text (é, à, …)
    "B008",  # function call in default arg: FastAPI Depends pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
show_error_codes = true
pretty = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]

# Garde d'hygiène des dépendances (deptry).
# ⚠ deptry EXCLUT `tests` par défaut : on redéfinit `exclude` SANS `tests` pour que
# pytest et hypothesis — importés uniquement par les tests — soient vus utilisés
# (sinon faux DEP002). `exclude` remplace entièrement la liste par défaut de deptry.
[tool.deptry]
exclude = ["\\.venv", "venv", "\\.direnv", "\\.git", "setup\\.py"]

[tool.deptry.per_rule_ignores]
# DEP002 = déclaré mais jamais importé — faux positifs légitimes : outils CLI et
# plugins pytest lancés en commande, jamais par `import`, plus deptry lui-même.
DEP002 = [
  "uvicorn",         # serveur ASGI lancé en commande (uvicorn app.main:app), jamais importé
  "ruff",            # linter/formateur CLI
  "mypy",            # vérificateur de types CLI
  "bandit",          # scanner de sécurité CLI
  "pytest-cov",      # plugin pytest (couverture) — chargé par pytest, pas importé
  "pytest-timeout",  # plugin pytest (timeout) — chargé par pytest, pas importé
  "deptry",          # cette garde elle-même — CLI, jamais importée
]
